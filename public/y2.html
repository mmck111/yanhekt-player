<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<title>延河课堂 · 新版播放器</title>
<link rel="icon" type="image/png" href="/icon.png">
<style>
  :root{
    --bg:#0b0d12; --panel:#12161f; --panel2:#181e2a; --panel3:#202737;
    --line:rgba(255,255,255,.08); --line-hi:rgba(91,156,255,.42);
    --fg:#eef2f7; --dim:#8f99ac; --muted:#5c6678;
    --accent:#5b9cff; --accent2:#7c8cff; --ok:#34d399; --warn:#fbbf24; --err:#f87171;
    --shadow:0 14px 40px rgba(0,0,0,.45);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
    font:14px/1.5 -apple-system,"Segoe UI",system-ui,"PingFang SC","Microsoft YaHei",sans-serif}
  ::-webkit-scrollbar{width:6px;height:6px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:99px}
  ::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.24)}

  .wrap{display:grid;grid-template-columns:338px 1fr;height:100vh;height:100dvh;overflow:hidden}

  /* 侧边栏 */
  aside{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
  .hd{padding:14px 14px 11px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,rgba(52,211,153,.055),transparent)}
  .brandhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
  .hd h1{margin:0;font-size:13.5px;color:var(--fg);font-weight:700;display:flex;align-items:center;gap:7px}
  .hd h1 .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px rgba(52,211,153,.75);flex:none}
  .hd h1 .dot.off{background:#6b4a4a;box-shadow:none}
  .fasttag{font-size:10.5px;font-weight:700;color:#052014;background:var(--ok);border-radius:999px;padding:1px 7px}


  .search{display:flex;gap:6px;align-items:center}
  .inpbox{position:relative;flex:1;min-width:0;display:flex;align-items:center}
  .inpbox svg.ico{position:absolute;left:10px;width:14px;height:14px;color:var(--muted);pointer-events:none}
  .inpbox input{width:100%;min-width:0;background:var(--panel2);border:1px solid var(--line);color:var(--fg);
    border-radius:8px;padding:7.5px 28px 7.5px 30px;font-size:13px;outline:none;transition:border-color .15s,box-shadow .15s}
  .inpbox input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(91,156,255,.14)}
  .clrbtn{position:absolute;right:5px;width:20px;height:20px;border-radius:50%;border:none;background:transparent;
    color:var(--muted);cursor:pointer;display:none;align-items:center;justify-content:center;font-size:13px;line-height:1;padding:0}
  .clrbtn.show{display:flex}
  .clrbtn:hover{background:rgba(255,255,255,.1);color:var(--fg)}
  .search button.sbtn{background:var(--panel3);border:1px solid var(--line);color:var(--fg);font-weight:600;border-radius:8px;
    padding:7.5px 12px;cursor:pointer;font-size:12.5px;flex:none}
  .search button.sbtn:hover{border-color:var(--line-hi);background:#252e41}

  .filters{display:flex;gap:6px;margin-top:7px}
  .filters select{flex:1;min-width:0;background:var(--panel2);border:1px solid var(--line);color:var(--fg);
    border-radius:8px;padding:6.5px 10px;font-size:12px;outline:none;cursor:pointer}
  .filters select:focus{border-color:var(--accent)}

  .userline{padding:8px 14px;font-size:11.5px;color:var(--dim);border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:6px;flex-wrap:wrap;background:rgba(255,255,255,.015)}
  .userline .yt{flex:1;min-width:95px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11px}
  .userline a{color:var(--dim);cursor:pointer;text-decoration:none;flex:none;padding:2px 6px;border-radius:6px;transition:all .15s}
  .userline a:hover{color:var(--fg);background:rgba(255,255,255,.06)}
  .userline a#btnLogout:hover{color:var(--err)}
  .userline a#oldlink{color:#9cc2ff;background:rgba(91,156,255,.1);border:1px solid rgba(91,156,255,.24);font-weight:600}
  .sb-tools{padding:8px 14px;display:grid;grid-template-columns:1fr 1fr;gap:8px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.02)}
  .toolbtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:7.5px 10px;border-radius:9px;
    font-size:13px;font-weight:700;text-decoration:none;cursor:pointer;transition:all .15s;white-space:nowrap}
  .dlentry{border:1px solid rgba(91,156,255,.38);background:rgba(28,45,76,.78);color:#bfe0ff}
  .dlentry:hover{background:rgba(41,66,112,.94);border-color:rgba(91,156,255,.65);color:#fff}
  .dlentry.busy{border-color:rgba(52,211,153,.55);color:var(--ok);background:rgba(18,44,32,.85)}
  .dlentry.warn{border-color:rgba(251,191,36,.5);color:#fde68a;background:rgba(56,42,16,.75)}
  .batchentry{grid-column:1 / -1;border:1px solid rgba(52,211,153,.38);background:rgba(16,44,34,.75);color:#9bf2cd}
  .batchentry:hover{background:rgba(22,60,46,.92);border-color:rgba(52,211,153,.65);color:#fff}
  .setentry{border:1px solid rgba(255,255,255,.18);background:var(--panel2);color:var(--fg)}
  .setentry:hover{border-color:rgba(91,156,255,.5);background:var(--panel3);color:#fff}
  .audsel{max-width:165px;text-overflow:ellipsis}

  .fmeta{font-size:11px;color:var(--dim);padding:4px 5px 7px;line-height:1.55}
  .list{overflow:auto;padding:8px 9px 14px;flex:1}
  .backrow{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:8px;padding:8px 11px;margin:0 0 8px;
    background:rgba(20,31,52,.92);backdrop-filter:blur(10px);border:1px solid rgba(91,156,255,.35);
    border-radius:10px;color:#b8d7ff;font-size:12.5px;cursor:pointer;box-shadow:0 6px 16px rgba(0,0,0,.35)}
  .backrow:hover{background:rgba(26,41,68,.98)}
  .backrow .bk{font-weight:600;white-space:nowrap}
  .backrow b{margin-left:auto;font-weight:500;color:#dbe7f7;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}

  .item{position:relative;padding:9px 11px;border-radius:10px;cursor:pointer;border:1px solid transparent;margin-bottom:4px;
    background:rgba(255,255,255,.018);transition:background .14s,border-color .14s;overflow:hidden}
  .item:hover{background:var(--panel2);border-color:var(--line)}
  .item.on{background:linear-gradient(135deg,rgba(91,156,255,.16),rgba(124,140,255,.08));border-color:rgba(91,156,255,.5)}
  .item.on::before{content:"";position:absolute;left:0;top:7px;bottom:7px;width:3px;border-radius:0 3px 3px 0;background:var(--accent)}
  .item.dim{opacity:.54}
  .item .d{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;line-height:1.45}
  .item .m{font-size:11px;color:var(--dim);margin-top:4px;display:flex;flex-wrap:wrap;gap:5px;align-items:center}
  .badge{font-size:10.5px;line-height:1.45;padding:1px 6px;border-radius:5px;border:1px solid var(--line);color:var(--dim);background:rgba(255,255,255,.04);white-space:nowrap}
  .badge.rec{color:#a9d4ff;border-color:rgba(91,156,255,.35);background:rgba(91,156,255,.14)}
  .badge.ok{color:#8be9be;border-color:rgba(52,211,153,.32);background:rgba(52,211,153,.1)}
  .badge.resume{color:#fde68a;border-color:rgba(251,191,36,.32);background:rgba(251,191,36,.1)}
  .progbar{position:absolute;left:0;right:0;bottom:0;height:2.5px;background:rgba(255,255,255,.05)}
  .progbar>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--ok))}
  .morebtn{width:100%;margin-top:6px;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);
    color:var(--accent);font-size:12px;font-weight:600;cursor:pointer}
  .morebtn:hover{border-color:var(--line-hi);background:var(--panel3)}

  .histbox{padding:6px 4px}
  .histtitle{font-size:11px;color:var(--muted);margin:4px 4px 8px;display:flex;align-items:center;justify-content:space-between}
  .histtitle a{color:var(--dim);cursor:pointer;font-size:11px}
  .histtitle a:hover{color:var(--fg)}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .qchip{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:999px;background:var(--panel2);
    border:1px solid var(--line);color:var(--fg);font-size:12px;cursor:pointer;transition:all .15s}
  .qchip:hover{border-color:var(--line-hi);background:var(--panel3)}

  .listnote{padding:7px 9px;font-size:11.5px;color:var(--dim);line-height:1.6;background:rgba(255,255,255,.025);border:1px solid var(--line);border-radius:8px;margin-bottom:6px}
  .listnote a{color:var(--accent);cursor:pointer}

  /* 主区域 */
  main{display:flex;flex-direction:column;min-width:0;min-height:0;background:radial-gradient(ellipse at top,rgba(52,211,153,.05),transparent 58%),var(--bg)}
  .bar{display:flex;gap:8px;align-items:center;padding:9px 16px;border-bottom:1px solid var(--line);background:rgba(18,22,31,.94);backdrop-filter:blur(8px);min-height:52px}
  .bar .who{min-width:0;margin-right:auto;flex:1}
  .bar .t{font-weight:700;font-size:14px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bar .subt{display:block;font-size:11.5px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tabs{display:flex;align-items:center;gap:5px;flex:none}
  .tab{padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel2);color:var(--dim);
    cursor:pointer;font-size:12px;font-weight:500;flex:none;transition:all .15s;white-space:nowrap}
  .tab:hover:not(:disabled){color:var(--fg);border-color:rgba(255,255,255,.2)}
  .tab.on{background:var(--accent);border-color:var(--accent);color:#051020;font-weight:700;box-shadow:0 2px 10px rgba(91,156,255,.28)}
  .tab:disabled{opacity:.3;cursor:not-allowed}

  .dualbar{display:none;align-items:center;gap:6px;padding:5px 16px;background:rgba(18,22,31,.8);border-bottom:1px solid var(--line);font-size:11.5px;color:var(--dim);flex-wrap:wrap}
  .dualbar.show{display:flex}
  .chipbtn{padding:3px 9px;border-radius:999px;border:1px solid var(--line);background:var(--panel2);color:var(--dim);
    font-size:11.5px;cursor:pointer;display:inline-flex;align-items:center;gap:4px;transition:all .15s}
  .chipbtn:hover{color:var(--fg);border-color:var(--line-hi)}
  .chipbtn.on{color:#b8d7ff;border-color:rgba(91,156,255,.5);background:rgba(91,156,255,.16)}

  .playerbox{flex:1;min-height:0;display:flex;flex-direction:column;position:relative;background:#050608}
  .playerbox:fullscreen,.playerbox:-webkit-full-screen{background:#000}
  .stagewrap{flex:1;display:flex;min-height:0;position:relative;overflow:hidden}
  .stage{flex:1;min-height:0;background:#050608;display:grid;gap:2px;position:relative;cursor:pointer}
  .stage.single{grid-template-columns:1fr}
  .stage.dual{grid-template-columns:1fr 1fr}
  .stage.pip{display:block}
  .pane{position:relative;min-height:0;min-width:0;background:#000;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .pane video{width:100%;height:100%;object-fit:contain;background:#000;display:block;pointer-events:none}
  .pane .tag{position:absolute;left:12px;top:10px;font-size:11px;font-weight:600;padding:3px 9px;border-radius:6px;
    background:rgba(10,12,18,.68);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.1);color:#d7e0ee;pointer-events:none;z-index:2}
  .pane.hide{display:none}
  .stage.pip .pane.pip-big{position:absolute;inset:0;width:100%;height:100%;z-index:1}
  .stage.pip .pane.pip-sub{position:absolute;right:14px;bottom:14px;width:min(30%,320px);aspect-ratio:16/9;height:auto;
    z-index:3;border-radius:10px;border:1.5px solid rgba(255,255,255,.28);box-shadow:0 12px 32px rgba(0,0,0,.7);cursor:pointer}
  .stage.pip .pane.pip-sub:hover{border-color:var(--accent)}

  .spin{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:6;display:none;align-items:center;gap:8px;
    background:rgba(14,17,24,.82);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:12px;color:var(--fg);pointer-events:none}
  .spin.on{display:flex}
  .spin i{width:14px;height:14px;border:2px solid rgba(91,156,255,.25);border-top-color:var(--accent);border-radius:50%;animation:sp .75s linear infinite;display:block}
  @keyframes sp{to{transform:rotate(360deg)}}

  .pane .perr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:10px;background:rgba(8,10,15,.88);backdrop-filter:blur(8px);color:var(--fg);padding:20px;text-align:center;font-size:13px;z-index:5;cursor:default}
  .pane .perr b{color:var(--err);font-size:14.5px}
  .pane .perr span{color:var(--dim);font-size:12px;max-width:480px;line-height:1.7}
  .pane .perr button{background:var(--accent);color:#051020;border:none;border-radius:8px;padding:7px 16px;font-weight:700;font-size:12.5px;cursor:pointer}

  .fshud{display:none;position:absolute;left:0;right:0;top:0;z-index:8;padding:12px 18px;
    background:linear-gradient(180deg,rgba(8,10,15,.85),transparent);align-items:center;gap:10px;transition:opacity .25s}
  .playerbox:fullscreen .fshud,.playerbox:-webkit-full-screen .fshud{display:flex}
  .playerbox.idle .fshud,.playerbox.idle .ctrldeck{opacity:0;pointer-events:none}
  .playerbox:fullscreen .ctrldeck,.playerbox:-webkit-full-screen .ctrldeck{position:absolute;left:0;right:0;bottom:0;z-index:8;
    background:linear-gradient(0deg,rgba(8,10,15,.92) 35%,transparent);border-top:none;padding-top:20px}
  .fshud .fstitle{flex:1;min-width:0;font-size:14px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 4px rgba(0,0,0,.8)}

  .ctrldeck{background:var(--panel);border-top:1px solid var(--line);padding:6px 14px 8px;display:flex;flex-direction:column;gap:6px;transition:opacity .25s}
  .scrub{position:relative;height:18px;display:flex;align-items:center;cursor:pointer;touch-action:none;user-select:none}
  .scrubtrack{position:relative;width:100%;height:4px;border-radius:99px;background:rgba(255,255,255,.13);transition:height .12s}
  .scrub:hover .scrubtrack,.scrub.drag .scrubtrack{height:6px}
  .scrubbuf{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:99px;background:rgba(255,255,255,.22)}
  .scrubfill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:99px;background:linear-gradient(90deg,var(--accent),#7eb3ff)}
  .scrubthumb{position:absolute;top:50%;width:13px;height:13px;border-radius:50%;background:#fff;border:2px solid var(--accent);
    transform:translate(-50%,-50%) scale(0);box-shadow:0 2px 8px rgba(0,0,0,.5);transition:transform .12s;left:0}
  .scrub:hover .scrubthumb,.scrub.drag .scrubthumb{transform:translate(-50%,-50%) scale(1)}
  .scrubtip{position:absolute;bottom:22px;transform:translateX(-50%);background:rgba(15,19,28,.95);border:1px solid var(--line);
    color:var(--fg);font-size:11px;font-variant-numeric:tabular-nums;padding:2px 7px;border-radius:5px;pointer-events:none;display:none;white-space:nowrap}
  .scrubtip.show{display:block}

  .ctrl{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .ctrl button,.ctrl select{background:var(--panel2);border:1px solid var(--line);color:var(--fg);border-radius:7px;
    height:30px;padding:0 9px;cursor:pointer;font-size:12px;display:inline-flex;align-items:center;gap:4px;transition:all .14s;flex:none}
  .ctrl button:hover:not(:disabled),.ctrl select:hover{border-color:var(--line-hi);background:var(--panel3)}
  .ctrl button:disabled{opacity:.35;cursor:not-allowed}
  .ctrl button.pri{background:var(--accent);border-color:var(--accent);color:#051020;font-weight:700;padding:0 12px}
  .ctrl button.pri:hover{filter:brightness(1.08);background:var(--accent)}
  .ctrl button.on{border-color:rgba(91,156,255,.55);color:#b8d7ff;background:rgba(91,156,255,.15)}
  .ctrl svg{width:14px;height:14px;flex:none}
  .ctrl .time{font-variant-numeric:tabular-nums;color:var(--dim);font-size:12px;padding:0 4px;flex:none}
  .ctrl .sp{flex:1}
  .volbox{display:inline-flex;align-items:center;gap:5px}
  .volbox input[type=range]{width:68px;accent-color:var(--accent);cursor:pointer}
  .dlwrap{position:relative;display:inline-flex}
  .dlmenu{position:absolute;bottom:calc(100% + 6px);right:0;min-width:220px;background:rgba(15,19,28,.98);border:1px solid var(--line-hi,rgba(255,255,255,.18));border-radius:10px;padding:5px;box-shadow:0 12px 32px rgba(0,0,0,.55);display:none;flex-direction:column;gap:3px;z-index:40}
  .dlmenu.show{display:flex}
  .dlmenu button{width:100%;height:auto;padding:7px 10px;border-radius:7px;background:transparent;border:none;color:var(--fg);font-size:12px;justify-content:space-between;text-align:left;cursor:pointer}
  .dlmenu button:hover:not(:disabled){background:rgba(91,156,255,.16);color:#b8d7ff}
  .dlmenu button:disabled{opacity:.4;cursor:not-allowed}
  .dlmenu .dtag{font-size:10.5px;color:var(--dim);margin-left:8px;white-space:nowrap}

  .hint{padding:6px 16px;font-size:11.5px;color:var(--muted);border-top:1px solid var(--line);background:var(--panel);display:flex;align-items:center;justify-content:space-between;gap:10px}
  .hint kbd{background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:0 5px;font-size:10.5px;color:var(--dim)}
  .hint a{color:var(--accent);cursor:pointer;text-decoration:none}
  .hint a:hover{text-decoration:underline}

  .splash{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
    color:var(--dim);padding:26px;text-align:center;overflow:auto}
  .splash .big{font-size:16px;font-weight:600;color:var(--fg)}
  .splash code{background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:2px 6px;font-size:12px;color:#b8d7ff}
  .splash .actrow{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:6px}
  .splash .sbtn2{background:var(--accent);color:#051020;border:none;border-radius:8px;padding:7px 14px;font-weight:700;font-size:12.5px;cursor:pointer}
  .splash .sbtn2.ghost{background:var(--panel2);color:var(--fg);border:1px solid var(--line)}

  .toast{position:fixed;right:18px;top:62px;z-index:60;background:rgba(16,20,29,.94);backdrop-filter:blur(10px);
    border:1px solid var(--line-hi);color:var(--fg);border-radius:10px;padding:8px 13px;font-size:12.5px;
    opacity:0;transform:translateY(-4px);transition:opacity .2s,transform .2s;pointer-events:none;box-shadow:var(--shadow)}
  .toast.on{opacity:1;transform:translateY(0)}

  /* 登录与下载弹窗 */
  .lgmodal{position:fixed;inset:0;background:rgba(4,6,10,.72);backdrop-filter:blur(6px);display:none;align-items:center;
    justify-content:center;padding:14px;z-index:45}
  .login{width:min(620px,94vw);max-height:88vh;overflow:auto;text-align:left;background:var(--panel);border:1px solid var(--line);
    border-radius:16px;padding:22px;box-shadow:var(--shadow)}
  .login h2{margin:0 0 4px;font-size:16.5px;color:var(--fg);display:flex;align-items:center;justify-content:space-between;gap:10px}
  .login .sub{margin:0 0 12px;font-size:12.5px;color:var(--dim)}
  .login .xbtn{background:var(--panel2);border:1px solid var(--line);color:var(--dim);border-radius:8px;width:28px;height:28px;cursor:pointer;font-size:15px}
  .login .xbtn:hover{color:var(--fg)}
  .login .paste{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:14px;margin:4px 0 12px}
  .login .paste>b{display:block;font-size:13.5px;margin-bottom:6px}
  .btn2{display:inline-block;background:var(--accent);color:#051020;text-decoration:none;font-weight:700;border-radius:8px;padding:8px 15px;font-size:12.5px}
  .btn2:hover{filter:brightness(1.08)}
  .dragrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:6px 0}
  .bmbtn{display:inline-block;background:var(--panel);border:1px dashed var(--accent);color:var(--fg);border-radius:8px;padding:7px 15px;
    text-decoration:none;font-size:13px;font-weight:600;cursor:grab;user-select:none}
  .pic{width:100%;max-width:420px;height:auto;margin-top:6px}
  .tiny{font-size:11.5px;color:var(--dim);line-height:1.7}

<script>
const $ = s => document.querySelector(s);
const v = $('#v'), vSub = $('#vSub'), vAux = $('#vAudioAux');
let hls = null, hlsSub = null, hlsAux = null, info = null, infoAudios = [], kind = 'camera', curCourse = null, playCourse = null, curSub = null, curQuery = '';
let serverHasFFmpeg = null;
function activePlayCourse(){ return playCourse || curCourse; }
let dualPip = false, dualSwapped = false, audioFrom = 'camera';
let autoNext = false, lastSaveAt = 0;
let searchSeq = 0, searchAbort = null, listScrollBackup = 0, curSearchLimit = 20;
let isLoggedIn = false;

const LS_RATE = 'yhkt_y2_rate_v1';
const LS_PROG = 'yhkt_y2_prog_v1';
const LS_HIST = 'yhkt_y2_hist_v1';
const LS_AUTONEXT = 'yhkt_y2_autonext_v1';
const LS_AUDIOPREF = 'yhkt_y2_audiopref_v1';

const fmt = t => { if(!isFinite(t)||t<0) t=0; const h=Math.floor(t/3600),m=Math.floor(t%3600/60),s=Math.floor(t%60);
  return (h?String(h).padStart(2,'0')+':':'')+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0'); };
const fmtMB = b => (b / 1048576).toFixed(1) + ' MB';
const b64 = s => btoa(String.fromCharCode(...new TextEncoder().encode(s))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function toast(m, ms){ const t=$('#toast'); t.textContent=m; t.classList.add('on'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('on'), ms||2200); }

async function jget(url, opts){
  const r = await fetch(url, opts);
  if (r.status === 401) { showLogin('登录已过期，重新点一下书签即可'); throw new Error('need login'); }
  return r.json();
}

/* ---------- 偏好与进度记忆 ---------- */
function getSavedRate(){
  try { const r = Number(localStorage.getItem(LS_RATE)); return (r >= 0.5 && r <= 3) ? r : 1; } catch(e){ return 1; }
}
function applyRate(r){
  const rate = Number(r) || 1;
  $('#rate').value = String(rate);
  v.defaultPlaybackRate = rate; vSub.defaultPlaybackRate = rate;
  if (vAux) { vAux.defaultPlaybackRate = rate; vAux.playbackRate = rate; }
  v.playbackRate = rate; vSub.playbackRate = rate;
  try { localStorage.setItem(LS_RATE, String(rate)); } catch(e){}
}
function loadProgMap(){
  try { return JSON.parse(localStorage.getItem(LS_PROG) || '{}') || {}; } catch(e){ return {}; }
}
function saveProgMap(m){
  try {
    const keys = Object.keys(m);
    if (keys.length > 80) keys.sort((a,b) => (m[a].at||0)-(m[b].at||0)).slice(0, keys.length-80).forEach(k => delete m[k]);
    localStorage.setItem(LS_PROG, JSON.stringify(m));
  } catch(e){}
}
let suppressProgressSave = false;
let pendingSeekGuard = 0;

function updateSidebarItemProg(sid, t, dur){
  if (!sid || !dur || dur <= 0) return;
  const el = document.querySelector(`.item[data-sid="${CSS.escape(String(sid))}"]`);
  if (!el) return;
  const pct = Math.min(100, Math.round(t / dur * 100));
  if (pct <= 0) return;
  let bar = el.querySelector('.progbar');
  if (!bar) {
    bar = document.createElement('div');
    bar.className = 'progbar';
    bar.innerHTML = '<i></i>';
    el.appendChild(bar);
  }
  const inner = bar.querySelector('i');
  if (inner) inner.style.width = pct + '%';
}

function saveCourseProgress(force){
  if (suppressProgressSave || window.__yhktRememberPos === false) return;
  const pc = activePlayCourse();
  if (!pc || !curSub) return;
  const now = performance.now();
  if (!force && now - lastSaveAt < 3500) return;
  const t = v.currentTime || 0;
  const dur = (isFinite(v.duration) && v.duration > 0 ? v.duration : 0) || Number(curSub.duration) || 0;
  if (pendingSeekGuard > 0) {
    if (Math.abs(t - pendingSeekGuard) <= 6) {
      pendingSeekGuard = 0;
    } else if (t < Math.max(3, pendingSeekGuard - 6)) {
      return;
    }
  }
  if (t < 3 && !force) return;
  lastSaveAt = now;
  const cid = String(pc.courseId);
  const sid = String(curSub.subId);
  const m = loadProgMap();
  const c = m[cid] || { sessions: {} };
  const prev = c.sessions && c.sessions[sid];
  if (force && t < 3 && prev && prev.t > 5) return;
  c.lastSid = sid; c.at = Date.now();
  c.sessions = c.sessions || {};
  c.sessions[sid] = { t: Math.floor(t), d: Math.floor(dur), at: Date.now() };
  m[cid] = c;
  saveProgMap(m);
  updateSidebarItemProg(sid, t, dur);
}
function getSessionProg(cid, sid){
  if (window.__yhktRememberPos === false) return null;
  const m = loadProgMap()[String(cid)];
  return m && m.sessions ? m.sessions[String(sid)] : null;
}

function getHist(){
  try { return JSON.parse(localStorage.getItem(LS_HIST) || '[]') || []; } catch(e){ return []; }
}
function pushHist(q){
  const s = (q || '').trim();
  if (!s) return;
  try { localStorage.setItem(LS_HIST, JSON.stringify([s, ...getHist().filter(x => x !== s)].slice(0, 8))); } catch(e){}
}
function renderHist(){
  const list = $('#list');
  if (curCourse) return;
  $('#fmeta').textContent = '';
  const h = getHist();
  if (!h.length) {
    list.innerHTML = '<div class="splash"><span style="font-size:12px">上面输入课程名或教师名开始，例如「数值分析」「孙新」</span></div>';
    return;
  }
  const box = document.createElement('div');
  box.className = 'histbox';
  box.innerHTML = '<div class="histtitle"><span>最近搜索</span><a id="clrHist">清空</a></div><div class="chips"></div>';
  const chips = box.querySelector('.chips');
  h.forEach(q => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'qchip'; b.textContent = q;
    b.onclick = () => { $('#q').value = q; syncClearBtn(); doFind(); };
    chips.appendChild(b);
  });
  box.querySelector('#clrHist').onclick = () => { try { localStorage.removeItem(LS_HIST); } catch(e){} renderHist(); };
  list.innerHTML = '';
  list.appendChild(box);
}

// ---------------- 登录 ----------------
function loginScript(){
  const origin = location.origin;
  const back = location.href.split('#')[0];
  return "(()=>{"
    + "const host=location.hostname||'';"
    + "const onLocal=host==='127.0.0.1'||host==='localhost'||host==='[::1]';"
    + "const onYh=/(^|\\.)yanhekt\\.cn$/i.test(host);"
    + "if(onLocal){"
    +   "alert('你点的是播放器里的这个按钮 —— 它得在「延河课堂」页面上点才有用。\\n\\n1) 先按住这个按钮，拖到浏览器顶部的书签栏，松手（只需一次）\\n2) 切到「延河课堂」那个标签页\\n3) 在延河页面上点一下书签栏里的「新版一键登录」');return;}"
    + "if(!onYh){"
    +   "alert('当前页面是 '+host+'，不是延河课堂。\\n\\n请先打开 https://aita.yanhekt.cn/portal/ 并登录，然后在延河课堂的那个标签页里点这个书签。');return;}"
    + "const dec=s=>{try{return decodeURIComponent(s)}catch(e){return s}};"
    + "const find=s=>{"
    +   "const w=/\\{i:\\d+;s:\\d+:\"_token\";i:\\d+;s:\\d+:\"(.+?)\";\\}/.exec(s);if(w)return w[1];"
    +   "const n=/(?:^|[;\\s])_token=([^;\\s]+)/.exec(s);if(n){const v=dec(n[1]);const w2=/\\{i:\\d+;s:\\d+:\"_token\";i:\\d+;s:\\d+:\"(.+?)\";\\}/.exec(v);return w2?w2[1]:v;}"
    +   "const j=/eyJ[A-Za-z0-9_\\-+\\/]+\\.[A-Za-z0-9_\\-+\\/]+\\.[A-Za-z0-9_\\-+\\/=]+/.exec(s);return j?j[0]:'';};"
    + "const ck=document.cookie||'';"
    + "let t=find(dec(ck))||find(ck);"
    + "if(!t)t=find(dec(localStorage.getItem('_token')||''));"
    + "if(!t)t=find(dec(sessionStorage.getItem('_token')||''));"

    + "let jumped=false;"

    + "try{fetch('/userapi/v1/infosimple',{credentials:'include'}).then(r=>go('&h='+r.status)).catch(()=>go('&h=x'));}catch(e){go('&h=x');}"
    + "setTimeout(()=>go('&h=timeout'),1500);"

async function doLogin(tokenFromHash, rawCookie, hint){
  const ta = document.querySelector('#tk');
  const tk = String(tokenFromHash || (ta ? ta.value : '') || '').trim();
  const m = document.querySelector('#m');
  if (m) { m.className='msg'; m.textContent='验证中…'; }
  if (!tk) { if (m) { m.className='msg err'; m.textContent='先粘登录态'; } return; }
  try{
    const j = await jget('/api/y2/login', { method:'POST', headers:{'content-type':'application/json'},
      body: JSON.stringify({ jwt: tk, cookie: String(rawCookie || '').trim() }) });
    if(!j.ok){
      let msg = j.error || '登录失败';
      if (hint === '200') msg += '｜浏览器里同一份 cookie 请求是 200，说明被本地转发拦了';
      else if (hint === '401' || hint === '403') msg += '｜延河那边需重新登录（HTTP ' + hint + '）';
      if (m) { m.className='msg err'; m.textContent = msg; } else toast(msg, 6000);
      return;
    }
    hideLoginModal();
    isLoggedIn = true;
    $('#sdot').classList.remove('off');
    $('#btnLogout').style.display = '';
    $('#btnSetup').textContent = '重登';
    await loadTerms();
    refreshY2Status();
    if (!curCourse) await resumeLast();
    else toast('新版登录状态已更新');
  }catch(e){ if (m) { m.className='msg err'; m.textContent=e.message; } else toast(e.message, 4000); }
}

async function refreshY2Status(){
  const el = $('#ytime');
  try{
    const st = await (await fetch('/api/y2/status')).json();
    isLoggedIn = !!(st && st.loggedIn);
    if (!isLoggedIn) {
      $('#sdot').classList.add('off');
      $('#btnLogout').style.display = 'none';
      $('#btnSetup').textContent = '登录';
      if (el) { el.textContent = '未登录新版'; el.style.color = ''; }
      return st;
    }
    $('#sdot').classList.remove('off');
    $('#btnLogout').style.display = '';
    $('#btnSetup').textContent = '重登';
    if (!el) return st;
    const exp = Number(st.expiresAt) || 0;
    if (!exp) { el.textContent = '新版已登录'; return st; }
    const left = exp * 1000 - Date.now();
    if (left <= 0) { el.textContent = '已过期 · 请重登'; el.style.color = 'var(--warn)'; return st; }
    const txt = left >= 3600000 ? Math.round(left / 3600000) + ' 小时' : Math.max(1, Math.round(left / 60000)) + ' 分钟';
    el.textContent = '还剩 ' + txt;
    el.style.color = left > 3600000 ? 'var(--dim)' : 'var(--warn)';
    return st;
  }catch(e){ if (el) el.textContent = ''; return null; }
}

async function doFind(limitOverride){
  const q = $('#q').value.trim();
  const term = curTerm();
  const isOldTerm = term.indexOf('old:') === 0;
  const oldTermName = isOldTerm ? term.slice(4) : '';
  if (!q && !isOldTerm && !term) { toast('先输个课程名，或选学期筛选', 2400); return; }
  if (q) pushHist(q);

  curQuery = q;
  curSearchLimit = limitOverride || 20;
  courseListBackup = null; curCourse = null;
  updateOldLink();

  if (searchAbort) { try { searchAbort.abort(); } catch(e){} }
  searchAbort = new AbortController();
  const sig = searchAbort.signal;
  const seq = ++searchSeq;

  $('#list').innerHTML = '<div class="splash"><span>正在极速检索…<br><span class="tiny">内置课程库本地毫秒命中</span></span></div>';
  $('#fmeta').textContent = '';

  const list = $('#list');
  const section = (title) => {
    const h = document.createElement('div');
    h.className = 'fmeta'; h.style.padding = '8px 4px 4px';
    h.textContent = title;
    return h;
  };

  let newOnes = [];
  let jMeta = { ok:true, total:0, hidden:0, unverified:0, notes:[] };
  let dbMeta = { ok:false, courses:[], total:0 };
  let oldSlot = null;

  const updateHeaderMeta = (loadingOld) => {
    if (seq !== searchSeq || curCourse) return;
    const bits = [];
    if (newOnes.length) bits.push('新版 ' + newOnes.length + (jMeta.total > newOnes.length ? '/' + jMeta.total : '') + ' 门');
    if (dbMeta.courses && dbMeta.courses.length) bits.push('老平台库 ' + dbMeta.total + ' 门');
    else if (loadingOld) bits.push('正同步老平台往届课程…');
    if (jMeta.hidden) bits.push('已隐藏 ' + jMeta.hidden + ' 门无录像');
    if (jMeta.unverified) bits.push(jMeta.unverified + ' 门未确认');
    const noteText = (jMeta.notes || []).join('；');
    $('#fmeta').innerHTML = esc(bits.join(' · ')) + (noteText ? ' · ' + esc(noteText) : '') + diagHint(jMeta.notes);
  };

  const renderOldSection = (oldOnes) => {
    if (seq !== searchSeq || curCourse) return;
    if (!oldSlot) {
      oldSlot = document.createElement('div');
      list.appendChild(oldSlot);
    }
    oldSlot.innerHTML = '';
    if (!oldOnes.length) return;
    oldSlot.appendChild(section('老平台课程库（往届学期，点开转老平台）'));
    oldOnes.forEach(c=>{
      const el = document.createElement('div');
      el.className='item';
      el.innerHTML = '<div class="d">' + esc(c.name) + '<span class="badge" style="margin-left:6px">课号 ' + esc(c.id) + '</span></div>'
        + '<div class="m">'
        + (c.term ? '<span class="badge">' + esc(c.term) + '</span>' : '')
        + (c.teacher ? '<span>' + esc(c.teacher) + '</span>' : '')
        + '</div>'
        + '<div class="m">'
        + (c.room ? '<span>教室 ' + esc(c.room) + '</span>' : '')
        + (c.videoCount ? '<span class="badge rec">' + c.videoCount + ' 讲有录像</span>' : '')
        + (c.verified === false ? '<span class="badge" title="' + esc(c.note||'没探到') + '">未确认</span>' : '')
        + '</div>';
      el.onclick = ()=>{ location.href = '/old?course=' + encodeURIComponent(c.id); };
      oldSlot.appendChild(el);
    });
  };

  const y2Promise = !isOldTerm
    ? fetch('/api/y2/search?q=' + encodeURIComponent(q) + (term ? '&term=' + encodeURIComponent(term) : '') + '&limit=' + curSearchLimit, { signal: sig })
        .then(r => r.json()).catch(e => (e && e.name === 'AbortError' ? { aborted:true } : { ok:false, error:e.message, courses:[] }))
    : Promise.resolve({ ok:true, courses:[], hidden:0, unverified:0, source:'skipped', notes:[] });

  const dbQS = 'q=' + encodeURIComponent(q) + (oldTermName ? '&term=' + encodeURIComponent(oldTermName) : '') + '&limit=' + (isOldTerm ? 80 : 20);
  const dbFastPromise = fetch('/api/db/search?' + dbQS + '&probe=0', { signal: sig })
    .then(r => r.json()).catch(() => ({ ok:false, courses:[], total:0 }));

  try{
    const j = await y2Promise;
    if (j && j.aborted || seq !== searchSeq) return;
    jMeta = j || jMeta;
    newOnes = (j.ok && j.courses) ? j.courses : [];

    // 立即先渲染新版结果（毫秒级出图），绝不卡在老平台网络探测上
    list.innerHTML = '';
    if (newOnes.length) {
      list.appendChild(section('新版平台（播放快，拖动秒定位）'));
      const pending = [];
      newOnes.forEach(c=>{
        const el = document.createElement('div');
        el.className='item';
        el.dataset.cid = c.courseId;
        const tn = c.termName || (c.termId ? termName(c.termId) : '');
        el.innerHTML = '<div class="d">' + esc(c.title || '（未命名课程）') + '</div>'
          + '<div class="m">'
          + (tn ? '<span class="badge">' + esc(tn) + '</span>' : '')
          + (c.teacher ? '<span>' + esc(c.teacher) + '</span>' : '')
          + '</div>'
          + '<div class="m">'
          + (c.room ? '<span>教室 ' + esc(c.room) + '</span>' : '')
          + '<span class="bd">' + badges(c) + '</span>'
          + '</div>';
        el.onclick = ()=>{ loadSessions(c, el); };
        list.appendChild(el);
        if (isLoggedIn && c.verified !== true) pending.push({ c, el });
      });
      if (pending.length) fillVerdicts(pending);
      if (j.total > newOnes.length && curSearchLimit < 80) {
        const more = document.createElement('button');
        more.type = 'button'; more.className = 'morebtn';
        more.textContent = `显示更多新版结果（已列 ${newOnes.length} / 共 ${j.total} 门）`;
        more.onclick = () => doFind(Math.min(80, curSearchLimit + 30));
        list.appendChild(more);
      }
      oldSlot = document.createElement('div');
      oldSlot.innerHTML = '<div class="listnote" style="margin-top:8px">正在同步补充老平台往届课程…</div>';
      list.appendChild(oldSlot);
      updateHeaderMeta(true);
    } else {
      updateHeaderMeta(true);
      list.innerHTML = '<div class="splash"><span>正在同步老平台课程库…</span></div>';
    }

    const db0 = await dbFastPromise;
    if (seq !== searchSeq || curCourse) return;
    dbMeta = db0 || dbMeta;
    const oldOnes = (db0.ok && db0.courses) ? db0.courses : [];
    if (!newOnes.length && !oldOnes.length){
      if (!j.ok && j.error) $('#fmeta').textContent = '新版检索提示：' + j.error;
      list.innerHTML = '<div class="splash"><b>没找到</b><span>课程库里没有匹配的课</span>'
        + '<span class="tiny">换个说法，或把学期改成「全部学期」</span></div>';
      return;
    }
    if (!newOnes.length) list.innerHTML = '';
    updateHeaderMeta(false);
    renderOldSection(oldOnes);

    if (db0.ok && !db0.probed && oldOnes.length > 0) {
      fetch('/api/db/search?' + dbQS + '&probe=1', { signal: sig })
        .then(r => r.json())
        .then(db1 => {
          if (seq !== searchSeq || curCourse || !db1 || !db1.ok) return;
          dbMeta = db1;
          updateHeaderMeta(false);
          renderOldSection(db1.courses || []);
        }).catch(() => {});
    }
  }catch(e){
    if (e.name === 'AbortError' || seq !== searchSeq) return;
    $('#list').innerHTML = '<div class="splash"><b>出错</b><span>'+ esc(e.message) +'</span></div>';
  }
}

function badges(c){
  let h = '';
  if(c.videoCount) h += '<span class="badge rec">' + c.videoCount + ' 讲有录像</span>';
  else if(c.verified) h += '<span class="badge rec">有录像</span>';
  if(c.noVideo) h += '<span class="badge">没录像</span>';
  if(c.totalSessions > c.videoCount) h += '<span class="badge" title="共 ' + c.totalSessions + ' 讲">共 ' + c.totalSessions + ' 讲</span>';
  if(c.verified === false && !c.noVideo) h += '<span class="badge" title="' + esc(c.note||'还没确认过') + '">未确认</span>';
  return h;
}

async function fillVerdicts(pending){
  const ids = pending.slice(0, 20).map(x => x.c.courseId);
  if(!ids.length) return;
  let items = [];
  try{
    const r = await fetch('/api/y2/verify', { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({ ids }) });
    const j = await r.json();
    if(!j.ok) return;
    items = j.items || [];
  }catch(e){ return; }
  const byId = new Map(items.map(i => [i.courseId, i]));
  let noVideo = 0;
  pending.forEach(({ c, el })=>{
    const vres = byId.get(c.courseId);
    if(!vres || vres.error) return;
    if(vres.videos > 0){
      c.verified = true;
      c.videoCount = vres.checked ? vres.videos : null;
      c.totalSessions = vres.total || c.totalSessions;
    }else if(vres.checked){
      noVideo++; c.noVideo = true; c.verified = false;
      el.classList.add('dim');
    }
    const bd = el.querySelector('.bd');
    if(bd) bd.innerHTML = badges(c);
  });
  if(noVideo){
    const meta = $('#fmeta');
    if(meta) meta.textContent = meta.textContent + ' · ' + noVideo + ' 门没录像';
  }
}

const subPrefetchSet = new Set();

async function loadSessions(c, el, opts){
  if (c && c.courseId) remember(c, $('#q').value.trim());
  if (!isLoggedIn) {
    showLogin('点播该课程录像前请先登录新版平台');
    return;
  }
  const wasSameCourse = curCourse && String(curCourse.courseId) === String(c.courseId);
  pushCourseList();
  try {
    if (!wasSameCourse && courseListBackup) history.pushState({ y2course: c.courseId }, '', '?course=' + encodeURIComponent(c.courseId));
  } catch(e) {}
  curCourse = c;
  if (el) document.querySelectorAll('.item').forEach(x=>x.classList.toggle('on', x===el));
  remember(c, curQuery);
  $('#now').textContent = c.title || '读取中…';
  $('#nowSub').textContent = [c.teacher, c.termName].filter(Boolean).join(' · ') || '正在读取讲次列表…';
  $('#fsTitle').textContent = $('#now').textContent;
  $('#list').innerHTML = '<div class="splash"><span>正在读取讲次列表…<br><span class="tiny">优先从详情接口秒取；必要时自动补全课表记录</span></span></div>';
  try{
    const url = '/api/y2/sessions?courseId=' + encodeURIComponent(c.courseId)
      + '&q=' + encodeURIComponent(curQuery)
      + '&termName=' + encodeURIComponent(c.termName || '')
      + (curTerm() && curTerm().indexOf('old:') !== 0 ? '&term=' + encodeURIComponent(curTerm()) : '')
      + (opts && opts.refresh ? '&refresh=1' : '');
    const j = await jget(url);
    const list = $('#list');
    if(!j.ok){
      list.innerHTML = '';
      list.appendChild(rowBack(c));
      list.insertAdjacentHTML('beforeend', '<div class="splash"><b>取讲次失败</b><span>'+ esc(j.error||'') +'</span></div>');
      return;
    }
    curCourse._sessions = j.sessions || [];
    list.innerHTML = '';
    list.appendChild(rowBack(c));
    if(!j.sessions.length){
      const empty = document.createElement('div');
      empty.className = 'splash';
      empty.innerHTML = '<b>没有可看的讲次</b><span>这门课在 ' + (curTerm()?'这个学期':'任何学期') + ' 都没有录像</span>'
        + (j.hidden ? '<span class="tiny">' + j.hidden + ' 讲里没有一节有录像</span>' : '')
        + (j.notes && j.notes.length ? '<span class="tiny">' + esc(j.notes.join('；')) + '</span>' + diagHint(j.notes) : '');
      list.appendChild(empty);
      return;
    }
    if (j.source === 'schedule') $('#fmeta').textContent = '讲次来自扫课表（' + j.sessions.length + ' 节有录像）';
    else $('#fmeta').textContent = j.sessions.length + ' 讲有录像' + (j.total > j.sessions.length ? '（共 ' + j.total + ' 讲）' : '');

    const progCourse = loadProgMap()[String(c.courseId)] || {};
    let resumeNode = null, firstPlayable = null;
    j.sessions.forEach(s=>{
      const el2 = document.createElement('div');
      el2.className = 'item';
      el2.dataset.sid = s.subId;
      const dur = s.duration ? Math.round(s.duration/60) + ' 分钟' : '';
      const tn = s.termName || '';
      const p = getSessionProg(c.courseId, s.subId);
      const pct = (p && p.d > 0) ? Math.min(100, Math.round(p.t / p.d * 100)) : 0;
      el2.innerHTML = '<div class="d">' + esc((s.date||'—') + (s.period ? ' ' + s.period : '') + (s.title && s.title !== s.period ? ' · ' + s.title : '')) + '</div>'
        + '<div class="m">'
        + (dur ? '<span>' + dur + '</span>' : '')
        + (s.room ? '<span>' + esc(s.room) + '</span>' : '')
        + (tn ? '<span>' + esc(tn) + '</span>' : '')
        + '</div>'
        + (pct > 0 ? `<div class="progbar"><i style="width:${pct}%"></i></div>` : '');
      el2.onmouseenter = ()=>{ prefetchY2Sub(c.courseId, s.subId); };
      el2.onclick = ()=>{ closeDrawer(); play(s, el2); };
      if (!firstPlayable) firstPlayable = { s, el2 };
      if (progCourse.lastSid && String(progCourse.lastSid) === String(s.subId)) resumeNode = { s, el2 };
      list.appendChild(el2);
    });

    if (opts && opts.autoLatest) {
      const target = resumeNode || firstPlayable;
      if (target) {
        target.el2.classList.add('on');
        play(target.s, target.el2);
      }
    } else {
      const warm = resumeNode || firstPlayable;
      if (warm) prefetchY2Sub(c.courseId, warm.s.subId);
    }
  }catch(e){
    if (e.message === 'need login') return;
    const list = $('#list');
    list.innerHTML = '';
    list.appendChild(rowBack(c));
    list.insertAdjacentHTML('beforeend', '<div class="splash"><b>出错</b><span>'+ esc(e.message) +'</span></div>');
  }
}

async function play(s, el, { noResume = false, courseData = null } = {}){
  saveCourseProgress(true);
  suppressProgressSave = true;
  if (courseData && courseData.courseId) {
    playCourse = courseData;
  } else if (curCourse && curCourse.courseId &&
             (!Array.isArray(curCourse._sessions) || curCourse._sessions.some(x => String(x.subId) === String(s.subId)))) {
    playCourse = curCourse;
  }
  const pc = activePlayCourse();
  if (!pc || !pc.courseId) { suppressProgressSave = false; toast('还没有课程信息', 2600); return; }
  document.querySelectorAll('.item').forEach(x=>x.classList.toggle('on', x===el));
  const t0 = performance.now();
  curSub = s;
  const saved = !noResume ? getSessionProg(pc.courseId, s.subId) : null;
  const resumeAt = (saved && saved.t > 5 && (!saved.d || saved.t < saved.d - 15)) ? saved.t : 0;
  pendingSeekGuard = resumeAt;

  try{
    const j = await jget(`/api/y2/sub?courseId=${encodeURIComponent(pc.courseId)}&subId=${encodeURIComponent(s.subId)}`);
    if(!j.ok){ suppressProgressSave = false; pendingSeekGuard = 0; toast('读取失败：'+(j.error||''), 4000); return; }
    info = j.info;
    infoAudios = Array.isArray(j.audios) ? j.audios : (info && info.audio ? [{ label: '独立音频', url: info.audio, format: 'aac' }] : []);
    updateTabs();
    updateNavButtons();
    if (resumeAt > 0) toast('已从 ' + fmt(resumeAt) + ' 续播', 2600);
    pick(t0, { seekTo: resumeAt, autoPlay: true });
    const nextS = adjacentSession(1);
    if (nextS) prefetchY2Sub(pc.courseId, nextS.subId);
  }catch(e){ suppressProgressSave = false; pendingSeekGuard = 0; if (e.message !== 'need login') toast('出错：'+e.message, 4000); }
}

function adjacentSession(dir){
  const pc = activePlayCourse();
  const arr = (pc && pc._sessions) || [];
  if (!arr.length || !curSub) return null;
  const idx = arr.findIndex(x => String(x.subId) === String(curSub.subId));
  if (idx < 0) return null;
  const ni = idx + dir;
  return (ni >= 0 && ni < arr.length) ? arr[ni] : null;
}
function updateNavButtons(){
  const p = adjacentSession(-1), n = adjacentSession(1);
  $('#btnPrev').disabled = !p;
  $('#btnNext').disabled = !n;
}
