function attachStream(vid, paneSel, st, { seekTo = 0, autoPlay = true, isSub = false, isAux = false } = {}){
  const url = '/y2play?u=' + b64(st.url);
  const rate = getSavedRate();
  vid.defaultPlaybackRate = rate;
  vid.playbackRate = rate;

  let needSeek = (seekTo && seekTo > 1) ? Number(seekTo) : 0;
  const doSeek = () => {
    vid.playbackRate = getSavedRate();
    if (!needSeek) {
      if (!isSub && !isAux) suppressProgressSave = false;
      return;
    }
    if (isFinite(vid.duration) && vid.duration > 0 && needSeek >= vid.duration - 2) {
      needSeek = 0;
      if (!isSub && !isAux) { pendingSeekGuard = 0; suppressProgressSave = false; }
      return;
    }
    if (Math.abs((vid.currentTime || 0) - needSeek) <= 2.5) {
      needSeek = 0;
      if (!isSub && !isAux) { pendingSeekGuard = 0; suppressProgressSave = false; }
      return;
    }
    try { vid.currentTime = needSeek; } catch(e){}
  };

  if (needSeek) {
    vid.addEventListener('loadedmetadata', doSeek);
    vid.addEventListener('loadeddata', doSeek);
    vid.addEventListener('canplay', doSeek);
    const onSeeked = () => {
      if (needSeek && Math.abs((vid.currentTime || 0) - needSeek) <= 3) {
        needSeek = 0;
        if (!isSub && !isAux) { pendingSeekGuard = 0; suppressProgressSave = false; }
        vid.removeEventListener('seeked', onSeeked);
      }
    };
    vid.addEventListener('seeked', onSeeked);
    if (!isSub && !isAux) {
      setTimeout(() => {
        needSeek = 0;
        pendingSeekGuard = 0;
        suppressProgressSave = false;
      }, 3500);
    }
  } else {
    if (!isSub && !isAux) suppressProgressSave = false;
  }

  const applySeekAndRate = () => {
    doSeek();
    if (autoPlay) vid.play().catch(()=>{});
  };

  const retry = () => attachStream(vid, paneSel, st, { seekTo: vid.currentTime || seekTo || 0, autoPlay: true, isSub, isAux });

  if (st.format === 'hls' && window.Hls && Hls.isSupported()) {
    const h = new Hls({
      maxBufferLength: 36,
      maxMaxBufferLength: 90,
      fragLoadingTimeOut: 15000,
      manifestLoadingTimeOut: 10000,
      levelLoadingTimeOut: 10000,
      fragLoadingMaxRetry: 6,
      fragLoadingRetryDelay: 300,
      manifestLoadingMaxRetry: 4,
      startFragPrefetch: true,
      liveDurationInfinity: !!(info && info.kind === 'live'),
      startPosition: needSeek ? needSeek : -1,
      abortLoadingOnSeek: true,
    });
    h.on(Hls.Events.MANIFEST_PARSED, () => { if (paneSel) clearErr(paneSel); applySeekAndRate(); if (!isAux) populateAudioSelect(); });
    h.on(Hls.Events.AUDIO_TRACKS_UPDATED, () => { if (!isAux) populateAudioSelect(); });
    h.on(Hls.Events.ERROR, (_, d) => {
      if (!d.fatal || isAux) return;
      const code = d.response && d.response.code;
      showErr(paneSel, '取不到视频流' + (code ? `（HTTP ${code}）` : ''), '本地转发未能拿到视频数据（可能登录过期或 CDN 限流）。', retry);
    });
    h.loadSource(url); h.attachMedia(vid);
    if (isAux) hlsAux = h; else if (isSub) hlsSub = h; else hls = h;
  } else {
    vid.src = url;
    if (!isAux) vid.onerror = () => showErr(paneSel, '视频加载失败', '直连流未能播放，可能登录已过期或网络中断。', retry);
    applySeekAndRate();
  }
}

let isMuted = false, dragging = false;
let audioPrefByView = {};
try { audioPrefByView = JSON.parse(localStorage.getItem(LS_AUDIOPREF) || '{}') || {}; } catch(e){}
let activeAudioKey = 'stream:camera';
let auxAudioActive = false;

function getAvailableAudioSources(){
  if (!info) return [];
  const srcs = [];
  const labelMap = { camera: '教师声音', screen: '课件声音', room: '教室声音' };
  for (const st of (info.streams || [])) {
    srcs.push({
      key: 'stream:' + st.type,
      kind: st.type,
      label: labelMap[st.type] || (st.type + ' 声音'),
      stream: st,
    });
  }
  const extra = (infoAudios && infoAudios.length) ? infoAudios : (info.audio ? [{ label: '独立音频', url: info.audio, format: 'aac' }] : []);
  extra.forEach((a, idx) => {
    if (a && a.url) {
      srcs.push({
        key: 'ext:' + idx,
        kind: 'ext',
        label: a.label || ('独立音频 ' + (idx + 1)),
        stream: { url: a.url, format: a.format === 'hls' ? 'hls' : 'mp4' },
      });
    }
  });
  if (hls && Array.isArray(hls.audioTracks) && hls.audioTracks.length > 1) {
    hls.audioTracks.forEach((tr, idx) => {
      const nm = (tr && (tr.name || tr.lang)) || ('音轨 ' + (idx + 1));
      srcs.push({ key: 'hlstrack:' + idx, kind: 'hlstrack', label: '内嵌·' + nm, trackId: idx });
    });
  }
  return srcs;
}

function defaultAudioKeyForView(srcs){
  const pref = audioPrefByView[kind];
  if (pref && srcs.some(s => s.key === pref)) return pref;
  const viewKey = 'stream:' + (kind === 'dual' ? 'camera' : kind);
  if (srcs.some(s => s.key === viewKey)) return viewKey;
  return (srcs[0] && srcs[0].key) || 'stream:camera';
}

function populateAudioSelect(){
  const sel = $('#audioSrc');
  if (!sel) return;
  const srcs = getAvailableAudioSources();
  if (!srcs.length) {
    sel.style.display = 'none';
    return;
  }
  if (!srcs.some(s => s.key === activeAudioKey)) {
    activeAudioKey = defaultAudioKeyForView(srcs);
  }
  sel.innerHTML = '';
  for (const s of srcs) {
    const o = document.createElement('option');
    o.value = s.key;
    o.textContent = '🔊 ' + s.label;
    sel.appendChild(o);
  }
  sel.value = activeAudioKey;
  sel.style.display = '';
  applyAudioSelection();
}

function setAudioSourceKey(key){
  activeAudioKey = key;
  audioPrefByView[kind] = key;
  try { localStorage.setItem(LS_AUDIOPREF, JSON.stringify(audioPrefByView)); } catch(e){}
  if (key === 'stream:screen') audioFrom = 'screen';
  else if (key === 'stream:camera') audioFrom = 'camera';
  const sel = $('#audioSrc');
  if (sel && sel.value !== key) sel.value = key;
  applyAudioSelection();
}

function applyAudioSelection(){
  const srcs = getAvailableAudioSources();
  const chosen = srcs.find(s => s.key === activeAudioKey) || srcs[0];
  if (!chosen) {
    auxAudioActive = false;
    detachOne('aux');
    updateAudioMute();
    return;
  }
  const mainKey = kind === 'dual' ? 'stream:camera' : ('stream:' + kind);
  const subMatches = kind === 'dual' && chosen.key === 'stream:screen';
  const mainMatches = chosen.key === mainKey;

  if (chosen.kind === 'hlstrack') {
    auxAudioActive = false;
    detachOne('aux');
    if (hls && hls.audioTrack !== chosen.trackId) {
      try { hls.audioTrack = chosen.trackId; } catch(e){}
    }
    v.muted = isMuted;
    vSub.muted = true;
  } else if (mainMatches || subMatches) {
    auxAudioActive = false;
    detachOne('aux');
    if (kind === 'dual') {
      v.muted = isMuted || subMatches;
      vSub.muted = isMuted || !subMatches;
    } else {
      v.muted = isMuted;
      vSub.muted = true;
    }
  } else if (chosen.stream && vAux) {
    v.muted = true;
    vSub.muted = true;
    auxAudioActive = true;
    const t = isFinite(v.currentTime) ? v.currentTime : 0;
    const vol = Number($('#vol') && $('#vol').value || 1);
    vAux.volume = vol;
    vAux.muted = isMuted;
    detachOne('aux');
    attachStream(vAux, '', chosen.stream, { seekTo: t, autoPlay: !v.paused, isAux: true });
    if (!v.paused) vAux.play().catch(()=>{});
  }
  if (chosen.key === 'stream:screen') audioFrom = 'screen';
  else if (chosen.key === 'stream:camera') audioFrom = 'camera';
  $('#btnAudioSrc').textContent = '声音：' + (chosen.label || '教师');
  syncTickState();
}

function updateAudioMute(){
  if (auxAudioActive && vAux) {
    v.muted = true;
    vSub.muted = true;
    vAux.muted = isMuted;
    return;
  }
  if (kind === 'dual') {
    const useScreen = activeAudioKey === 'stream:screen' || audioFrom === 'screen';
    v.muted = isMuted || useScreen;
    vSub.muted = isMuted || !useScreen;
  } else {
    v.muted = isMuted;
    vSub.muted = true;
  }
}

function renderStage(){
  const st = $('#stage');
  const pm = $('#paneMain'), ps = $('#paneSub');
  if (kind === 'dual') {
    st.className = dualPip ? 'stage pip' : 'stage dual';
    ps.classList.remove('hide');
  } else {
    st.className = 'stage single';
    ps.classList.add('hide');
  }
  pm.classList.remove('pip-big', 'pip-sub');
  ps.classList.remove('pip-big', 'pip-sub');
  if (kind === 'dual' && dualPip) {
    if (dualSwapped) { ps.classList.add('pip-big'); pm.classList.add('pip-sub'); }
    else { pm.classList.add('pip-big'); ps.classList.add('pip-sub'); }
  }
  $('#dualbar').classList.toggle('show', kind === 'dual');
  $('#btnLayout').textContent = dualPip ? '画中画' : '并排双屏';
  $('#btnLayout').classList.toggle('on', true);
  $('#btnSwap').style.display = dualPip ? '' : 'none';
  const srcs = getAvailableAudioSources();
  if (srcs.length) {
    const pref = audioPrefByView[kind];
    if (pref && srcs.some(s => s.key === pref)) activeAudioKey = pref;
    else {
      const defK = defaultAudioKeyForView(srcs);
      if (!srcs.some(s => s.key === activeAudioKey) || kind !== 'dual') activeAudioKey = defK;
    }
    populateAudioSelect();
  } else {
    $('#btnAudioSrc').textContent = '声音：' + (audioFrom === 'screen' ? '课件' : '教师');
    updateAudioMute();
  }
  syncTickState();
}

function updateTabs(){
  const have = new Set(((info&&info.streams)||[]).map(x=>x.type));
  const hasDual = have.has('camera') && have.has('screen');
  document.querySelectorAll('.tab').forEach(b=>{
    const k = b.dataset.k;
    b.disabled = (k === 'dual') ? !hasDual : !have.has(k);
    b.classList.toggle('on', k === kind);
  });
}

function pick(t0, { seekTo = 0, autoPlay = true } = {}){
  if(!info) return;
  const streams = info.streams || [];
  const hasDual = streams.some(x => x.type === 'camera') && streams.some(x => x.type === 'screen');
  if (kind === 'dual' && !hasDual) kind = 'camera';
  let st = streams.find(x => x.type === (kind === 'dual' ? 'camera' : kind));
  if (!st) st = streams[0];
  if (!st) { toast('这一讲没有可播放画面'); return; }
  if (kind !== 'dual') kind = st.type;

  updateTabs();
  detach();
  $('#splash').style.display = 'none';
  $('#stage').style.display = '';

  const names = { camera:'教师画面', screen:'课件画面', room:'教室画面', dual:'双画面' };
  $('#tagMain').textContent = kind === 'dual' ? '教师画面' : (names[kind] || kind);

  attachStream(v, '#paneMain', st, { seekTo, autoPlay, isSub: false });
  if (kind === 'dual') {
    const sc = streams.find(x => x.type === 'screen');
    if (sc) attachStream(vSub, '#paneSub', sc, { seekTo, autoPlay, isSub: true });
  }
  renderStage();

  const pc = activePlayCourse();
  const tag = info.kind === 'live' ? ' · 直播回放' : '';
  const titleStr = `${info.title} ${info.subTitle||''}`.trim();
  $('#now').textContent = titleStr || '课程播放';
  $('#nowSub').textContent = `${names[kind]||kind}${tag}${pc && pc.teacher ? ' · ' + pc.teacher : ''}`;
  $('#fsTitle').textContent = titleStr + ' · ' + (names[kind] || kind);

  if(t0){
    const onPlay = ()=>{
      v.removeEventListener('playing', onPlay);
      toast(`起播 ${((performance.now()-t0)/1000).toFixed(2)}s`);
    };
    v.addEventListener('playing', onPlay);
  }
}

let tickId = 0;
function syncTickState(){
  const need = ((kind === 'dual' || auxAudioActive) && $('#stage').style.display !== 'none');
  if (need && !tickId) tickId = requestAnimationFrame(tick);
  if (!need && tickId) { cancelAnimationFrame(tickId); tickId = 0; }
}
function tick(){
  tickId = 0;
  if ((kind !== 'dual' && !auxAudioActive) || $('#stage').style.display === 'none') return;
  if (kind === 'dual' && vSub.readyState >= 2 && v.readyState >= 2) {
    if (Math.abs(v.currentTime - vSub.currentTime) > 0.65) {
      try { vSub.currentTime = v.currentTime; } catch(e){}
    }
    if (v.paused !== vSub.paused) {
      v.paused ? vSub.pause() : vSub.play().catch(()=>{});
    }
  }
  if (auxAudioActive && vAux && vAux.readyState >= 2 && v.readyState >= 2) {
    if (Math.abs((v.currentTime || 0) - (vAux.currentTime || 0)) > 0.4) {
      try { vAux.currentTime = v.currentTime; } catch(e){}
    }
    if (v.paused !== vAux.paused) {
      v.paused ? vAux.pause() : vAux.play().catch(()=>{});
    }
  }
  tickId = requestAnimationFrame(tick);
}

/* ---------- 自定义进度条与控件 ---------- */
function updatePlayUI(){
  const paused = v.paused;
  $('#icoPlay').style.display = paused ? '' : 'none';
  $('#icoPause').style.display = paused ? 'none' : '';
  $('#playTxt').textContent = paused ? '播放' : '暂停';
  updateProgressUI();
}
function updateProgressUI(){
  if (dragging) return;
  const dur = isFinite(v.duration) && v.duration > 0 ? v.duration : (curSub && Number(curSub.duration)) || 0;
  const curT = v.currentTime || 0;
  $('#timeTxt').textContent = fmt(curT) + ' / ' + (dur > 0 ? fmt(dur) : '--:--');
  const pct = dur > 0 ? Math.min(100, Math.max(0, curT / dur * 100)) : 0;
  $('#scrubFill').style.width = pct + '%';
  $('#scrubThumb').style.left = pct + '%';
  let bufPct = 0;
  try { if (dur > 0 && v.buffered && v.buffered.length) bufPct = Math.min(100, v.buffered.end(v.buffered.length-1)/dur*100); } catch(e){}
  $('#scrubBuf').style.width = bufPct + '%';
}
function seekToFraction(frac){
  if (!isFinite(v.duration) || v.duration <= 0) return;
  pendingSeekGuard = 0; suppressProgressSave = false;
  const target = Math.max(0, Math.min(v.duration, frac * v.duration));
  v.currentTime = target;
  if (kind === 'dual') { try { vSub.currentTime = target; } catch(e){} }
  if (auxAudioActive && vAux) { try { vAux.currentTime = target; } catch(e){} }
  updateProgressUI();
}
(() => {
  const sc = $('#scrub'), tip = $('#scrubTip');
  const fracOf = ev => { const r = sc.getBoundingClientRect(); return Math.max(0, Math.min(1, (ev.clientX - r.left) / Math.max(1, r.width))); };
  const showTip = ev => {
    if (!isFinite(v.duration) || v.duration <= 0) return;
    const f = fracOf(ev);
    tip.textContent = fmt(f * v.duration);
    tip.style.left = (f * 100) + '%';
    tip.classList.add('show');
  };
  sc.addEventListener('pointerdown', ev => {
    if (!isFinite(v.duration) || v.duration <= 0) return;
    dragging = true; sc.classList.add('drag'); sc.setPointerCapture(ev.pointerId);
    const f = fracOf(ev);
    $('#scrubFill').style.width = (f * 100) + '%'; $('#scrubThumb').style.left = (f * 100) + '%';
    showTip(ev);
  });
  sc.addEventListener('pointermove', ev => {
    showTip(ev);
    if (!dragging) return;
    const f = fracOf(ev);
    $('#scrubFill').style.width = (f * 100) + '%'; $('#scrubThumb').style.left = (f * 100) + '%';
  });
  sc.addEventListener('pointerup', ev => {
    if (!dragging) return;
    dragging = false; sc.classList.remove('drag'); tip.classList.remove('show');
    seekToFraction(fracOf(ev));
  });
  sc.addEventListener('pointerleave', () => { if (!dragging) tip.classList.remove('show'); });
})();

v.addEventListener('play', () => {
  updatePlayUI();
  if (auxAudioActive && vAux) vAux.play().catch(()=>{});
});
v.addEventListener('pause', () => {
  updatePlayUI();
  saveCourseProgress(true);
  if (auxAudioActive && vAux) vAux.pause();
});
v.addEventListener('timeupdate', () => { updateProgressUI(); saveCourseProgress(false); });
v.addEventListener('progress', updateProgressUI);
v.addEventListener('loadedmetadata', () => { v.playbackRate = getSavedRate(); updateProgressUI(); });
v.addEventListener('waiting', () => $('#spin').classList.add('on'));
v.addEventListener('playing', () => $('#spin').classList.remove('on'));
v.addEventListener('canplay', () => $('#spin').classList.remove('on'));
v.addEventListener('seeking', () => { window.__seekAt = performance.now(); });
v.addEventListener('seeked', () => {
  if (!window.__seekAt) return;
  const s = (performance.now() - window.__seekAt) / 1000;
  window.__seekAt = 0;
  toast(`拖动定位 ${s.toFixed(2)}s`);
});
v.addEventListener('ended', () => {
  saveCourseProgress(true);
  if (!autoNext) return;
  const next = adjacentSession(1);
  if (next) {
    const row = document.querySelector(`.item[data-sid="${CSS.escape(String(next.subId))}"]`);
    toast('即将连播下一讲：' + (next.title || next.date), 2500);
    const pc = activePlayCourse();
    setTimeout(() => play(next, row, { noResume: true, courseData: pc }), 1200);
  }
});

let idleTimer = 0;
function wakeHud(){
  const pb = $('#playerBox');
  pb.classList.remove('idle');
  clearTimeout(idleTimer);
  if ((document.fullscreenElement || document.webkitFullscreenElement) && !v.paused) {
    idleTimer = setTimeout(() => pb.classList.add('idle'), 2800);
  }
}
$('#playerBox').addEventListener('mousemove', wakeHud);
$('#playerBox').addEventListener('touchstart', wakeHud, { passive: true });
document.addEventListener('fullscreenchange', wakeHud);
document.addEventListener('webkitfullscreenchange', wakeHud);

let hudWokeFromIdle = false, lastStageTouchMs = 0, lastStageTap = null, stageTapTimer = 0, stageTouchPt = null;
$('#playerBox').addEventListener('touchstart', e => {
  if (e.touches && e.touches.length === 1) stageTouchPt = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  else stageTouchPt = null;
  if ($('#playerBox').classList.contains('idle') && e.target.closest('#stage')
      && !e.target.closest('.ctrldeck') && !e.target.closest('.fshud')) {
    hudWokeFromIdle = true;
    setTimeout(() => { hudWokeFromIdle = false; }, 500);
  }
}, { passive: true, capture: true });
$('#stage').addEventListener('touchend', e => {
  if (e.target.closest('.perr')) return;
  if (kind === 'dual' && dualPip && e.target.closest('.pip-sub')) return;
  if (!e.changedTouches || e.changedTouches.length !== 1) return;
  const t = e.changedTouches[0];
  if (stageTouchPt && Math.hypot(t.clientX - stageTouchPt.x, t.clientY - stageTouchPt.y) > 24) {
    stageTouchPt = null; lastStageTouchMs = Date.now(); return;
  }
  stageTouchPt = null;
  lastStageTouchMs = Date.now();
  if (hudWokeFromIdle) { hudWokeFromIdle = false; lastStageTap = null; clearTimeout(stageTapTimer); return; }
  const now = Date.now();
  const rect = $('#stage').getBoundingClientRect();
  if (lastStageTap && now - lastStageTap.t < 280
      && Math.hypot(t.clientX - lastStageTap.x, t.clientY - lastStageTap.y) < 56) {
    clearTimeout(stageTapTimer); lastStageTap = null;
    const ratio = rect.width > 0 ? (t.clientX - rect.left) / rect.width : 0.5;
    if (ratio < 0.35) { const b = document.querySelector('[data-jump="-15"]'); if (b) b.click(); }
    else if (ratio > 0.65) { const b = document.querySelector('[data-jump="15"]'); if (b) b.click(); }
    else { $('#fs').click(); }
    return;
  }
  lastStageTap = { t: now, x: t.clientX, y: t.clientY };
  clearTimeout(stageTapTimer);
  stageTapTimer = setTimeout(() => { lastStageTap = null; $('#pp').click(); }, 250);
}, { passive: true });
$('#stage').addEventListener('click', e => {
  if (e.target.closest('.perr')) return;
  if (kind === 'dual' && dualPip && e.target.closest('.pip-sub')) {
    dualSwapped = !dualSwapped; renderStage(); return;
  }
  if (Date.now() - lastStageTouchMs < 600) return;
  $('#pp').click();
});
$('#stage').addEventListener('dblclick', e => {
  if (e.target.closest('.perr') || e.target.closest('.pip-sub')) return;
  if (Date.now() - lastStageTouchMs < 600) return;
  $('#fs').click();
});

/* ---------- 下载与抽屉 ---------- */
let dlPoll = 0;
function openWebDownloads(){ $('#dlModal').style.display = 'flex'; refreshWebDownloads(); }
function closeWebDownloads(){ $('#dlModal').style.display = 'none'; clearTimeout(dlPoll); dlPoll = 0; }
$('#dlClose').onclick = closeWebDownloads;
if ($('#dlClear')) $('#dlClear').onclick = clearWebDownloads;
$('#dlModal').onclick = e => { if (e.target === $('#dlModal')) closeWebDownloads(); };

async function refreshWebDownloads(){
  clearTimeout(dlPoll);
  try {
    const j = await (await fetch('/api/downloads')).json();
    const items = (j && j.items) || [];
    const running = items.filter(x => x.status === 'running').length;
    const queued = items.filter(x => x.status === 'queued').length;
    const activeCnt = running + queued;
    const interrupted = items.filter(x => x.status === 'interrupted').length;
    const dlEntry = $('#dlnk');
    if (dlEntry && !NATIVE_DL) {
      let badge = '';
      if (activeCnt > 0) badge = '（' + activeCnt + ' 进行中）';
      else if (interrupted > 0) badge = '（' + interrupted + ' 未完成）';
      dlEntry.textContent = '⤓ 下载管理' + badge;
      dlEntry.classList.toggle('busy', activeCnt > 0);
      dlEntry.classList.toggle('warn', activeCnt === 0 && interrupted > 0);
    }
    if ($('#dlModal').style.display === 'flex') {
      const body = $('#dlBody');
      if (!items.length) {
        body.innerHTML = '<div class="listnote">当前还没有下载任务。播放界面点「下载」或打开「📦 批量搜课下载专区」即可批量稳定下载。</div>';
      } else {
        body.innerHTML = items.map(it => {
          const pct = it.totalSegs > 1 ? Math.round(it.doneSegs / it.totalSegs * 100)
            : (it.totalBytes > 0 ? Math.round(it.bytes / it.totalBytes * 100) : (it.status === 'done' ? 100 : 0));
          const speedTxt = (it.status === 'running' && it.speedBps > 0) ? (fmtMB(it.speedBps) + '/s · ') : '';
          const stText = it.status === 'running' ? (it.stage || '下载中')
            : it.status === 'queued' ? '排队中'
            : it.status === 'done' ? '已完成'
            : it.status === 'interrupted' ? '已中断（可继续）'
            : it.status === 'cancelled' ? '已取消' : ('失败 ' + (it.error || ''));
          const segText = it.stage ? (it.totalSegs > 1 ? `${it.doneSegs}% · ` : '')
            : (it.totalSegs > 1 ? `${it.doneSegs}/${it.totalSegs} 片 · ` : '');
          let act = '';
          if (it.status === 'running' || it.status === 'queued') {
            act = `<button class="dlcancel" type="button" onclick="cancelWebDownload('${esc(it.id)}')">取消</button>`;
          } else if (it.status === 'interrupted' || it.status === 'error' || it.status === 'cancelled') {
            const btnTxt = it.status === 'interrupted' ? '继续下载' : '重下';
            const resumeBtn = it.reqPath ? `<button class="dlcancel" style="color:#a9d4ff;background:rgba(91,156,255,.15)" type="button" onclick="resumeWebDownload('${esc(it.id)}','${esc(it.reqPath)}')">${btnTxt}</button>` : '';
            const delBtn = `<button class="dlcancel" type="button" onclick="removeWebDownload('${esc(it.id)}',true)">删除</button>`;
            act = resumeBtn + delBtn;
          } else if (it.status === 'done') {
            const dirBtn = (DESKTOP_APP && it.savePath) ? `<button class="dlcancel" style="color:#8be9be;background:rgba(52,211,153,.14)" type="button" onclick="openSavedFolder('${esc(it.savePath)}')">打开目录</button>` : '';
            const rmBtn = `<button class="dlcancel" style="color:var(--dim);background:var(--panel2)" type="button" onclick="removeWebDownload('${esc(it.id)}',false)">移除</button>`;
            act = dirBtn + rmBtn;
          }
          const pathHint = it.savePath ? `<div style="font-size:10.5px;color:var(--muted);margin-top:3px;word-break:break-all">${esc(it.savePath)}</div>` : '';
          return `<div class="dlrow"><div class="dt">${esc(it.title)}</div>`
            + `<div class="dm"><span>${esc(stText)}</span><span style="display:flex;align-items:center;gap:6px">${speedTxt}${segText}${fmtMB(it.bytes)}${act}</span></div>`
            + pathHint
            + `<div class="dlbar"><i style="width:${Math.min(100,pct)}%"></i></div></div>`;
        }).join('');
      }
    }
    if (activeCnt > 0 || $('#dlModal').style.display === 'flex') dlPoll = setTimeout(refreshWebDownloads, 900);
  } catch(e){}
}

function resumeWebDownload(id, reqPath){
  if (!reqPath) return;
  const sep = reqPath.indexOf('?') >= 0 ? '&' : '?';
  window.open(reqPath + sep + 'resumeId=' + encodeURIComponent(id), '_blank');
  toast('正在恢复下载…', 2600);
  setTimeout(refreshWebDownloads, 600);
}

async function removeWebDownload(id, deleteFile){
  try {
    await fetch('/api/downloads/remove?id=' + encodeURIComponent(id) + (deleteFile ? '&deleteFile=1' : ''), { method: 'POST' });
    refreshWebDownloads();
  } catch(e){}
}

async function clearWebDownloads(){
  try {
    await fetch('/api/downloads/clear', { method: 'POST' });
    refreshWebDownloads();
  } catch(e){}
}

function openSavedFolder(p){
  if (!p) return;
  const dir = p.replace(/[\\/][^\\/]+$/, '');
  if (window.yhktApp && window.yhktApp.openDownloadDir) window.yhktApp.openDownloadDir(dir);
}

async function cancelWebDownload(id){
  try {
    await fetch('/api/downloads/cancel?id=' + encodeURIComponent(id), { method: 'POST' });
    toast('已取消下载', 2400);
    refreshWebDownloads();
  } catch(e){}
}

function closeDlMenu(){
  const m = $('#dlMenu');
  if (m) m.classList.remove('show');
}
document.addEventListener('click', e => {
  const wrap = e.target && e.target.closest && e.target.closest('.dlwrap');
  if (!wrap) closeDlMenu();
});

function startY2DownloadKind(dlKind){
  closeDlMenu();
  const pc = activePlayCourse();
  if (!pc || !curSub || !info) { toast('先点一讲再下载', 2600); return; }
  const streams = (info && info.streams) || [];
  const hasCam = streams.some(x => x.type === 'camera' || x.type === 'room');
  const hasScreen = streams.some(x => x.type === 'screen');
  if (dlKind === 'dual' && (!hasCam || !hasScreen)) {
    toast('这一讲缺少教师或课件画面，无法合成双画面', 3000);
    return;
  }
  const label = dlKind === 'dual' ? '双画面' : dlKind === 'screen' ? '课件' : dlKind === 'room' ? '教室' : '教师画面';
  const title = (pc.title || '课程') + '_' + ((curSub.date || '').slice(0, 10)) + '_' + label;
  const url = '/y2dl?c=' + encodeURIComponent(pc.courseId)
    + '&s=' + encodeURIComponent(curSub.subId)
    + '&k=' + encodeURIComponent(dlKind)
    + '&title=' + encodeURIComponent(title);
  window.open(url, '_blank');
  toast(dlKind === 'dual'
    ? '开始下载并合成双画面（完成后保存为单个 .mp4），可在「下载管理」看进度'
    : ('开始下载' + label + '，可在「下载管理」看进度'), 4500);
  if (!NATIVE_DL) setTimeout(refreshWebDownloads, 600);
}

$('#dl').onclick = () => {
  const pc = activePlayCourse();
  if (!pc || !curSub || !info) { toast('先点一讲再下载', 2600); return; }
  const streams = (info && info.streams) || [];
  const types = new Set(streams.map(x => x.type));
  const hasCam = types.has('camera') || types.has('room');
  const hasScreen = types.has('screen');
  const menu = $('#dlMenu');
  if (!menu || (!hasScreen && !types.has('room')) || streams.length <= 1) {
    startY2DownloadKind(kind === 'dual' ? 'camera' : (streams[0] && !types.has(kind) ? streams[0].type : kind));
    return;
  }
  if (menu.classList.contains('show')) { closeDlMenu(); return; }
  const opts = [];
  if (types.has('camera') || !types.has('room')) {
    opts.push({ k: 'camera', label: '教师画面', tag: kind === 'camera' ? '当前视角' : '' });
  }
  if (hasScreen) {
    opts.push({ k: 'screen', label: '课件画面', tag: kind === 'screen' ? '当前视角' : '' });
  }
  if (types.has('room')) {
    opts.push({ k: 'room', label: '教室画面', tag: kind === 'room' ? '当前视角' : '' });
  }
  if (hasCam && hasScreen) {
    const ffHint = serverHasFFmpeg === false ? '需 ffmpeg' : '同屏单个 .mp4';
    opts.push({ k: 'dual', label: '双画面（合成）', tag: kind === 'dual' ? '当前视角 · ' + ffHint : ffHint });
  }
  menu.innerHTML = '';
  opts.forEach(o => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.innerHTML = `<span>⤓ ${esc(o.label)}</span>` + (o.tag ? `<span class="dtag">${esc(o.tag)}</span>` : '');
    btn.onclick = () => startY2DownloadKind(o.k);
    menu.appendChild(btn);
  });
  menu.classList.add('show');
};

const wrapEl = $('#wrap');
const closeDrawer = () => { if (wrapEl) wrapEl.classList.remove('drawer'); };
if ($('#menu')) $('#menu').onclick = () => { if (wrapEl) wrapEl.classList.toggle('drawer'); };
if ($('#backdrop')) $('#backdrop').onclick = closeDrawer;

window.__yhktDl = (n) => {
  const a = document.getElementById('dlnk');
  if (a) {
    a.textContent = '⤓ 下载管理' + (n > 0 ? '（' + n + '）' : '');
    a.classList.toggle('busy', n > 0);
  }
};
if ($('#dlnk')) $('#dlnk').onclick = (e) => {
  e.preventDefault();
  closeDrawer();
  if (window.yhktApp && window.yhktApp.openDownloads) window.yhktApp.openDownloads();
  else openWebDownloads();
};

if (APP) {
  const so = document.getElementById('btnSetup'); if (so) so.style.display = 'none';
  const lg = document.getElementById('lgbtn');
  if (lg) { lg.style.display = 'inline-block'; lg.onclick = () => { closeDrawer(); showLoginModal(); }; }
}

$('#fs').onclick = () => {
  const box = $('#playerBox');
  if (document.fullscreenElement || document.webkitFullscreenElement){
    const exit = document.exitFullscreen || document.webkitExitFullscreen;
    if (exit) exit.call(document);
    return;
  }
  const req = box.requestFullscreen || box.webkitRequestFullscreen;
  if (req) {
    const r = req.call(box);
    if (r && r.catch) r.catch(() => { if (v.webkitEnterFullscreen) try { v.webkitEnterFullscreen(); } catch(e){} });
  } else if (v.webkitEnterFullscreen) {
    try { v.webkitEnterFullscreen(); } catch(e){}
  }
};

$('#go').onclick = () => doFind();
$('#qClr').onclick = () => { $('#q').value = ''; syncClearBtn(); $('#q').focus(); if (!curCourse) renderHist(); };
$('#q').addEventListener('input', syncClearBtn);
$('#q').addEventListener('keydown', e => { if (e.key === 'Enter') doFind(); });
$('#term').onchange = () => {
  if (curTerm().indexOf('old:') === 0 || $('#q').value.trim()) doFind();
  else if (curCourse) loadSessions(curCourse, null);
};
$('#btnSetup').onclick = () => showLogin('');
$('#btnLogout').onclick = async () => {
  try { sessionStorage.setItem('yhkt_manual_logout', '1'); } catch(e){}
  await fetch('/api/y2/logout', { method: 'POST' });
  isLoggedIn = false;
  try { if (window.yhktApp && window.yhktApp.clearAuth) window.yhktApp.clearAuth('y2'); } catch(e){}
  if (APP && window.__yhktRefresh) window.__yhktRefresh();
  detach();
  refreshY2Status();
  showLogin('已退出登录');
};
$('#btnRefresh').onclick = () => { if (curCourse) loadSessions(curCourse, null, { autoLatest: true, refresh: true }); };
$('#pp').onclick = () => {
  if (v.paused) {
    v.play().catch(()=>{});
    if (kind === 'dual') vSub.play().catch(()=>{});
    if (auxAudioActive && vAux) vAux.play().catch(()=>{});
  } else {
    v.pause();
    if (kind === 'dual') vSub.pause();
    if (auxAudioActive && vAux) vAux.pause();
  }
  wakeHud();
};
$('#btnPrev').onclick = () => {
  const s = adjacentSession(-1);
  if (s) {
    const row = document.querySelector(`.item[data-sid="${CSS.escape(String(s.subId))}"]`);
    play(s, row, { courseData: activePlayCourse() });
  }
};
$('#btnNext').onclick = () => {
  const s = adjacentSession(1);
  if (s) {
    const row = document.querySelector(`.item[data-sid="${CSS.escape(String(s.subId))}"]`);
    play(s, row, { courseData: activePlayCourse() });
  }
};
$('#btnAutoNext').onclick = () => {
  autoNext = !autoNext;
  $('#btnAutoNext').classList.toggle('on', autoNext);
  try { localStorage.setItem(LS_AUTONEXT, autoNext ? '1' : '0'); } catch(e){}
  toast(autoNext ? '已开启自动连播' : '已关闭自动连播');
};
$('#btnMute').onclick = () => {
  isMuted = !isMuted;
  $('#btnMute').textContent = isMuted ? '🔇' : '🔊';
  updateAudioMute();
};
$('#vol').oninput = e => {
  const val = Number(e.target.value);
  v.volume = val; vSub.volume = val;
  if (vAux) vAux.volume = val;
  if (val > 0 && isMuted) { isMuted = false; $('#btnMute').textContent = '🔊'; updateAudioMute(); }
};
$('#audioSrc').onchange = e => setAudioSourceKey(e.target.value);
$('#btnLayout').onclick = () => { dualPip = !dualPip; renderStage(); };
$('#btnSwap').onclick = () => { dualSwapped = !dualSwapped; renderStage(); };
$('#btnAudioSrc').onclick = () => {
  const srcs = getAvailableAudioSources();
  if (!srcs.length) return;
  const idx = srcs.findIndex(s => s.key === activeAudioKey);
  const next = srcs[(idx + 1) % srcs.length];
  if (next) setAudioSourceKey(next.key);
};

document.querySelectorAll('[data-jump]').forEach(b => b.onclick = () => {
  pendingSeekGuard = 0; suppressProgressSave = false;
  const target = Math.max(0, (v.currentTime || 0) + Number(b.dataset.jump));
  v.currentTime = target;
  if (kind === 'dual') { try { vSub.currentTime = target; } catch(e){} }
  if (auxAudioActive && vAux) { try { vAux.currentTime = target; } catch(e){} }
  wakeHud();
});
$('#rate').onchange = e => applyRate(e.target.value);

function switchTab(newKind){
  if (!info) return;
  const curTime = v.currentTime || 0;
  const wasPlaying = !v.paused;
  kind = newKind;
  pick(performance.now(), { seekTo: curTime, autoPlay: wasPlaying });
  wakeHud();
}
document.querySelectorAll('.tab').forEach(b => b.onclick = () => {
  if (b.disabled) return;
  switchTab(b.dataset.k);
});

document.addEventListener('keydown', e => {
  if (/^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName)) return;
  if (e.code === 'Space' || e.key === 'k' || e.key === 'K') { e.preventDefault(); $('#pp').click(); }
  else if (e.code === 'ArrowLeft')  document.querySelector('[data-jump="-15"]').click();
  else if (e.code === 'ArrowRight') document.querySelector('[data-jump="15"]').click();
  else if (e.code === 'ArrowUp')   { e.preventDefault(); const n = Math.min(1, Number($('#vol').value) + 0.1); $('#vol').value = n.toFixed(2); $('#vol').dispatchEvent(new Event('input')); toast('音量 ' + Math.round(n*100) + '%'); }
  else if (e.code === 'ArrowDown') { e.preventDefault(); const n = Math.max(0, Number($('#vol').value) - 0.1); $('#vol').value = n.toFixed(2); $('#vol').dispatchEvent(new Event('input')); toast('音量 ' + Math.round(n*100) + '%'); }
  else if (e.key === 'f' || e.key === 'F') $('#fs').click();
  else if (e.key === 'm' || e.key === 'M') $('#btnMute').click();
  else if (e.key === '1' && !document.querySelector('.tab[data-k="camera"]').disabled) switchTab('camera');
  else if (e.key === '2' && !document.querySelector('.tab[data-k="screen"]').disabled) switchTab('screen');
  else if (e.key === '3' && !document.querySelector('.tab[data-k="room"]').disabled) switchTab('room');
  else if (e.key === '4' && !document.querySelector('.tab[data-k="dual"]').disabled) switchTab('dual');
  else if (e.key === 'Escape') { closeDlMenu(); hideLoginModal(); closeWebDownloads(); if (window.yhktBatch) window.yhktBatch.close(); if (window.yhktSettings) window.yhktSettings.close(); }
});

window.__yhktBack = () => {
  if ($('#dlMenu') && $('#dlMenu').classList.contains('show')) { closeDlMenu(); return 'handled'; }
  if (window.yhktSettings && window.yhktSettings.isOpen()) { window.yhktSettings.close(); return 'handled'; }
  if (window.yhktBatch && window.yhktBatch.isOpen()) { window.yhktBatch.close(); return 'handled'; }
  if ($('#dlModal').style.display === 'flex') { closeWebDownloads(); return 'handled'; }
  if ($('#lgmodal').style.display === 'flex') { hideLoginModal(); return 'handled'; }
  if ($('#wrap').classList.contains('drawer')) { closeDrawer(); return 'handled'; }
  if (curCourse && courseListBackup) { backToCourseList(); return 'handled'; }
  return 'none';
};

function mapY2View(v){
  return (v === 'dual' || v === 'screen' || v === 'room' || v === 'camera') ? v : 'camera';
}
function applyAppSettings(s){
  if (!s) return;
  window.__yhktRememberPos = (s.rememberPos !== false);
  autoNext = !!s.autoNext;
  $('#btnAutoNext').classList.toggle('on', autoNext);
  try { localStorage.setItem(LS_AUTONEXT, autoNext ? '1' : '0'); } catch(e){}
  dualPip = !!s.dualPip;
  applyRate(s.defaultRate || 1);
  const nextKind = mapY2View(s.defaultView);
  if (!info) {
    kind = nextKind;
  } else if (nextKind !== kind) {
    const tab = document.querySelector(`.tab[data-k="${nextKind}"]`);
    if (tab && !tab.disabled) switchTab(nextKind);
  }
  renderStage();
}

(async function init(){
  try { autoNext = localStorage.getItem(LS_AUTONEXT) === '1'; } catch(e){}
  $('#btnAutoNext').classList.toggle('on', autoNext);
  applyRate(getSavedRate());
  if (window.yhktSettings) {
    await window.yhktSettings.init({ toast, onBeforeOpen: closeDrawer, onApply: applyAppSettings });
  }
  if (window.yhktBatch) {
    window.yhktBatch.init({
      toast,
      defaultPlatform: 'all',
      onBeforeOpen: closeDrawer,
      openDownloads: () => {
        if (window.yhktApp && window.yhktApp.openDownloads) window.yhktApp.openDownloads();
        else openWebDownloads();
      },
      promptLogin: w => {
        if (w === 'old') {
          if (APP) try { yhktApp.login('old'); } catch(e){}
          else location.href = '/';
        } else {
          showLogin('请先登录后再加载课程列表');
        }
      },
      defaultQuery: () => $('#q').value.trim(),
      getCurrentCourse: () => {
        const pc = curCourse || playCourse;
        if (!pc) return null;
        return {
          platform: 'y2',
          id: String(pc.courseId),
          title: pc.title || ('课程 ' + pc.courseId),
          teacher: pc.teacher || '',
          term: pc.termName || '',
          sessions: pc._sessions || [],
        };
      },
    });
  }
  refreshWebDownloads();
  window.addEventListener('pagehide', () => saveCourseProgress(true));
  window.addEventListener('beforeunload', () => saveCourseProgress(true));
  fetch('/api/status').then(r => r.json()).then(j => { if (j.build) $('#build').textContent = 'build ' + j.build; }).catch(()=>{});

  const hp = new URLSearchParams(location.hash.replace(/^#/, ''));
  const ht = hp.get('t');
  if (ht) {
    const rawCookie = hp.get('c') ? decodeURIComponent(hp.get('c')) : '';
    const hint = hp.get('h') || '';
    history.replaceState(null, '', location.pathname);
    await doLogin(decodeURIComponent(ht), rawCookie, hint);
    return;
  }

  let logged = false;
  try {
    const st = await (await fetch('/api/y2/status')).json();
    if (st && typeof st.hasFFmpeg === 'boolean') serverHasFFmpeg = st.hasFFmpeg;
    logged = !!st.loggedIn;
    if (!logged && (!APP || (DESKTOP_APP && !sessionStorage.getItem('yhkt_manual_logout')))) {
      const a = await (await fetch('/api/y2/login/auto', { method: 'POST' })).json();
      if (a.ok) { logged = true; toast('已自动登录' + (a.from ? '（来自 ' + a.from + '）' : ''), 2600); }
    }
  } catch (e) {}
  isLoggedIn = logged;
  await refreshY2Status();
  if (APP) { window.__yhktRefresh(); setTimeout(window.__yhktRefresh, 1200); setTimeout(window.__yhktRefresh, 5000); }

  await loadTerms();
  const sp = new URLSearchParams(location.search);
  const q0 = (sp.get('q') || '').trim();
  const directId = sp.get('course');
  const setGuestSplash = (title, desc) => {
    splash(`<div class="big">${esc(title)}</div><div>${esc(desc)}</div><div class="actrow"><button class="sbtn2" id="spLogin">登录新版</button></div>`);
    const sl = $('#spLogin'); if (sl) sl.onclick = () => showLogin('');
  };
  if (!directId && q0) {
    $('#q').value = q0;
    syncClearBtn();
    await doFind();
    if (!logged) {
      setGuestSplash('已搜索本地课程库', '点开左侧课程前请先登录新版平台');
      toast('已搜本地课程库；点开课程前需先登录新版', 3600);
    } else {
      splash('<div class="big">在左侧选择课程开始播放</div><div>已自动为你搜索「' + esc(q0) + '」</div>');
    }
    return;
  }
  if (directId) {
    if (!logged) {
      setGuestSplash('需要登录新版平台', '登录后即可自动打开课程 ' + directId);
      showLogin('这门课在新版平台上更快，先登录新版');
      return;
    }
    await loadSessions({
      courseId: directId,
      title: sp.get('title') || ('课程 ' + directId),
      termName: sp.get('term') || '',
      termId: '',
    }, null, { autoLatest: true });
    return;
  }
  if (logged) {
    try { sessionStorage.removeItem('yhkt_manual_logout'); } catch(e){}
    await resumeLast();
  } else {
    renderHist();
    setGuestSplash('未登录新版平台', '可先直接搜索本地 2.7 万门课程库，或点击下方按钮登录');
    if (!APP) showLogin();
  }
})();
</script>
</body>
</html>
