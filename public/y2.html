<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f0f4f9">
<title>延河课堂 · 新版播放器</title>
<link rel="icon" type="image/png" href="/icon.png">
<style>
  /* Material Design 3 — Light Baseline (Google Workspace / Material You) */
  :root{
    color-scheme:light;
    --bg:#f8fafd; --panel:#f0f4f9; --panel2:#e9eef6; --panel3:#dde3ea;
    --surface-card:#ffffff; --dialog-bg:#ffffff; --input-bg:#ffffff; --surface-item:rgba(11,87,208,.03);
    --line:rgba(68,71,70,.15); --line-strong:rgba(68,71,70,.28); --line-hi:rgba(11,87,208,.45);
    --fg:#1f1f1f; --dim:#444746; --muted:#747775;
    --accent:#0b57d0; --on-accent:#ffffff; --accent-soft:#d3e3fd; --on-accent-soft:#041e49;
    --sec-soft:#c2e7ff; --on-sec-soft:#001d35;
    --accent2:#1b6ef3;
    --ok:#146c2e; --ok-soft:#c4eed0; --on-ok-soft:#072711;
    --warn:#b06000; --warn-soft:#feefc3; --on-warn-soft:#412100;
    --err:#b3261e; --err-soft:#f9dedc; --on-err-soft:#410e0b;
    --inv-bg:#303030; --inv-fg:#f2f2f2;
    --hover:rgba(31,31,31,.06); --press:rgba(31,31,31,.11);
    --scrim:rgba(15,23,42,.42);
    --shadow-1:0 1px 2px rgba(0,0,0,.08),0 1px 3px 1px rgba(0,0,0,.05);
    --shadow-2:0 2px 6px 2px rgba(0,0,0,.07),0 1px 2px rgba(0,0,0,.09);
    --shadow:0 8px 28px 4px rgba(15,23,42,.12),0 2px 8px rgba(15,23,42,.08);
    --ease:cubic-bezier(.2,0,0,1);
    --ease-decel:cubic-bezier(.05,.7,.1,1);
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      color-scheme:dark;
      --bg:#131314; --panel:#1b1c1f; --panel2:#24262b; --panel3:#2e3138;
      --surface-card:#1e2025; --dialog-bg:#25272d; --input-bg:#1c1e23; --surface-item:rgba(227,227,227,.03);
      --line:rgba(227,227,227,.10); --line-strong:rgba(227,227,227,.20); --line-hi:rgba(168,199,250,.48);
      --fg:#e3e3e3; --dim:#c4c7c5; --muted:#8e918f;
      --accent:#a8c7fa; --on-accent:#062e6f; --accent-soft:#0842a0; --on-accent-soft:#d3e3fd;
      --sec-soft:#004a77; --on-sec-soft:#c2e7ff;
      --accent2:#7cacf8;
      --ok:#6dd58c; --ok-soft:#0f5223; --on-ok-soft:#c4eed0;
      --warn:#fdd663; --warn-soft:#4d3800; --on-warn-soft:#feefc3;
      --err:#f2b8b5; --err-soft:#601410; --on-err-soft:#f9dedc;
      --inv-bg:#e3e3e3; --inv-fg:#1f1f1f;
      --hover:rgba(227,227,227,.08); --press:rgba(227,227,227,.13);
      --scrim:rgba(0,0,0,.64);
      --shadow-1:0 1px 3px rgba(0,0,0,.35),0 1px 2px rgba(0,0,0,.25);
      --shadow-2:0 2px 6px 2px rgba(0,0,0,.36),0 1px 2px rgba(0,0,0,.3);
      --shadow:0 12px 36px 4px rgba(0,0,0,.52),0 2px 10px rgba(0,0,0,.38);
    }
  }
  :root[data-theme="dark"]{
    color-scheme:dark;
    --bg:#131314; --panel:#1b1c1f; --panel2:#24262b; --panel3:#2e3138;
    --surface-card:#1e2025; --dialog-bg:#25272d; --input-bg:#1c1e23; --surface-item:rgba(227,227,227,.03);
    --line:rgba(227,227,227,.10); --line-strong:rgba(227,227,227,.20); --line-hi:rgba(168,199,250,.48);
    --fg:#e3e3e3; --dim:#c4c7c5; --muted:#8e918f;
    --accent:#a8c7fa; --on-accent:#062e6f; --accent-soft:#0842a0; --on-accent-soft:#d3e3fd;
    --sec-soft:#004a77; --on-sec-soft:#c2e7ff;
    --accent2:#7cacf8;
    --ok:#6dd58c; --ok-soft:#0f5223; --on-ok-soft:#c4eed0;
    --warn:#fdd663; --warn-soft:#4d3800; --on-warn-soft:#feefc3;
    --err:#f2b8b5; --err-soft:#601410; --on-err-soft:#f9dedc;
    --inv-bg:#e3e3e3; --inv-fg:#1f1f1f;
    --hover:rgba(227,227,227,.08); --press:rgba(227,227,227,.13);
    --scrim:rgba(0,0,0,.64);
    --shadow-1:0 1px 3px rgba(0,0,0,.35),0 1px 2px rgba(0,0,0,.25);
    --shadow-2:0 2px 6px 2px rgba(0,0,0,.36),0 1px 2px rgba(0,0,0,.3);
    --shadow:0 12px 36px 4px rgba(0,0,0,.52),0 2px 10px rgba(0,0,0,.38);
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
    font:14px/1.5 "Google Sans","Roboto","Segoe UI Variable","Segoe UI","PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  button,input,select,textarea{font-family:inherit}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  ::-webkit-scrollbar{width:6px;height:6px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:999px}
  ::-webkit-scrollbar-thumb:hover{background:var(--muted)}

  .wrap{display:grid;grid-template-columns:336px 1fr;height:100vh;height:100dvh;overflow:hidden;background:var(--bg)}

  /* M3 Navigation Drawer */
  aside{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
  .hd{padding:14px 16px 12px;border-bottom:1px solid var(--line)}
  .brandhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
  .hd h1{margin:0;font-size:15px;color:var(--fg);font-weight:600;letter-spacing:.01em;display:flex;align-items:center;gap:9px;min-width:0}
  .hd h1 .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px var(--ok-soft);flex:none;transition:background .25s var(--ease),box-shadow .25s var(--ease)}
  .hd h1 .dot.off{background:var(--muted);box-shadow:none}
  .brand-act{display:flex;align-items:center;gap:6px;flex:none}
  .fasttag{font-size:11px;font-weight:600;color:var(--on-ok-soft);background:var(--ok-soft);border-radius:999px;padding:2px 9px}
  .icobtn{width:32px;height:32px;border-radius:50%;border:none;background:transparent;color:var(--dim);
    display:inline-flex;align-items:center;justify-content:center;cursor:pointer;transition:background .16s var(--ease),color .16s var(--ease),transform .12s var(--ease);padding:0;flex:none}
  .icobtn:hover{background:var(--hover);color:var(--fg)}
  .icobtn:active{background:var(--press);transform:scale(.94)}
  .icobtn svg{width:18px;height:18px}
  .icobtn .ico-sun{display:none}
  :root[data-theme="dark"] .icobtn .ico-sun{display:block}
  :root[data-theme="dark"] .icobtn .ico-moon{display:none}
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]) .icobtn .ico-sun{display:block}
    :root:not([data-theme="light"]) .icobtn .ico-moon{display:none}
  }

  /* M3 Pill Search Bar */
  .search{display:flex;gap:8px;align-items:center}
  .inpbox{position:relative;flex:1;min-width:0;display:flex;align-items:center}
  .inpbox svg.ico{position:absolute;left:11px;width:15px;height:15px;color:var(--dim);pointer-events:none;transition:color .16s var(--ease)}
  .inpbox input{width:100%;min-width:0;height:38px;background:var(--input-bg);border:1px solid var(--line);color:var(--fg);
    border-radius:999px;padding:0 28px 0 33px;font-size:12.5px;outline:none;box-shadow:var(--shadow-1);
    transition:border-color .18s var(--ease),box-shadow .18s var(--ease)}
  .inpbox input::placeholder{color:var(--muted)}
  .inpbox input:hover{border-color:var(--line-strong)}
  .inpbox input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .inpbox:focus-within svg.ico{color:var(--accent)}
  .clrbtn{position:absolute;right:5px;width:24px;height:24px;border-radius:50%;border:none;background:transparent;
    color:var(--dim);cursor:pointer;display:none;align-items:center;justify-content:center;padding:0;transition:background .15s var(--ease),color .15s var(--ease)}
  .clrbtn svg{width:14px;height:14px}
  .clrbtn.show{display:inline-flex}
  .clrbtn:hover{background:var(--hover);color:var(--fg)}
  .search button.sbtn{height:38px;background:var(--accent);border:none;color:var(--on-accent);font-weight:600;border-radius:999px;
    padding:0 14px;cursor:pointer;font-size:12.5px;flex:none;box-shadow:var(--shadow-1);
    transition:filter .16s var(--ease),box-shadow .16s var(--ease),transform .12s var(--ease)}
  .search button.sbtn:hover{filter:brightness(1.06);box-shadow:var(--shadow-2)}
  .search button.sbtn:active{transform:scale(.97)}

  .filters{display:flex;gap:8px;margin-top:8px}
  .filters select{flex:1;min-width:0;height:36px;background:var(--input-bg);border:1px solid var(--line);color:var(--fg);
    border-radius:12px;padding:0 12px;font-size:12.5px;outline:none;cursor:pointer;transition:border-color .16s var(--ease)}
  .filters select:hover{border-color:var(--line-strong)}
  .filters select:focus{border-color:var(--accent)}

  /* M3 Account & Platform Strip */
  .userline{padding:9px 16px;font-size:12px;color:var(--dim);border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:6px;flex-wrap:wrap;background:var(--panel)}
  .userline .uico{width:16px;height:16px;color:var(--muted);flex:none}
  .userline .yt{flex:1;min-width:85px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px;font-weight:500;color:var(--fg)}
  .userline a{color:var(--dim);cursor:pointer;text-decoration:none;flex:none;padding:4px 9px;border-radius:999px;
    font-weight:500;transition:background .15s var(--ease),color .15s var(--ease)}
  .userline a:hover{color:var(--fg);background:var(--hover)}
  .userline a#btnLogout:hover{color:var(--err);background:var(--err-soft)}
  .userline a#oldlink{color:var(--on-accent-soft);background:var(--accent-soft);font-weight:600;padding:4px 11px}
  .userline a#oldlink:hover{filter:brightness(.96)}

  /* M3 Tonal Quick Action Grid */
  .sb-tools{padding:10px 14px;display:grid;grid-template-columns:1fr 1fr;gap:8px;border-bottom:1px solid var(--line)}
  .toolbtn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:36px;padding:0 12px;border-radius:999px;
    font-size:12.5px;font-weight:600;text-decoration:none;cursor:pointer;border:1px solid transparent;white-space:nowrap;
    transition:background .16s var(--ease),color .16s var(--ease),box-shadow .16s var(--ease),transform .12s var(--ease)}
  .toolbtn svg{width:16px;height:16px;flex:none}
  .toolbtn:active{transform:scale(.97)}
  .dlentry{background:var(--accent-soft);color:var(--on-accent-soft)}
  .dlentry:hover{box-shadow:var(--shadow-1);filter:brightness(.97)}
  .dlentry.busy{background:var(--ok-soft);color:var(--on-ok-soft)}
  .dlentry.warn{background:var(--warn-soft);color:var(--on-warn-soft)}
  .setentry{background:var(--panel2);color:var(--fg);border-color:var(--line)}
  .setentry:hover{background:var(--panel3)}
  .batchentry{grid-column:1 / -1;background:var(--ok-soft);color:var(--on-ok-soft);border-radius:14px;height:38px}
  .batchentry:hover{box-shadow:var(--shadow-1);filter:brightness(.97)}
  .audsel{max-width:118px;text-overflow:ellipsis}

  /* M3 Course & Session List */
  .fmeta{font-size:11.5px;font-weight:500;color:var(--muted);padding:4px 8px 6px;line-height:1.5;letter-spacing:.01em}
  .fmeta:empty{display:none}
  .list{overflow:auto;padding:10px 10px 16px;flex:1}
  .backrow{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:8px;padding:9px 14px;margin:0 0 10px;
    background:var(--accent-soft);color:var(--on-accent-soft);border-radius:14px;font-size:12.5px;cursor:pointer;
    box-shadow:var(--shadow-1);transition:filter .16s var(--ease),transform .12s var(--ease)}
  .backrow:hover{filter:brightness(.97)}
  .backrow:active{transform:scale(.985)}
  .backrow svg{width:16px;height:16px;flex:none}
  .backrow .bk{font-weight:600;white-space:nowrap}
  .backrow b{margin-left:auto;font-weight:500;opacity:.85;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}

  .item{position:relative;padding:10px 13px;border-radius:14px;cursor:pointer;border:1px solid transparent;margin-bottom:4px;
    background:transparent;transition:background .16s var(--ease),border-color .16s var(--ease),transform .12s var(--ease);overflow:hidden}
  .item:hover{background:var(--hover)}
  .item:active{transform:scale(.99)}
  .item.on{background:var(--sec-soft);color:var(--on-sec-soft)}
  .item.on .d,.item.on .m{color:var(--on-sec-soft)}
  .item.on .m{opacity:.85}
  .item.dim{opacity:.52}
  .item .d{font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;line-height:1.45;color:var(--fg)}
  .item .m{font-size:11.5px;color:var(--dim);margin-top:4px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .badge{font-size:11px;font-weight:500;line-height:1.45;padding:1px 8px;border-radius:8px;color:var(--dim);background:var(--panel2);white-space:nowrap}
  .item.on .badge{background:rgba(255,255,255,.22);color:var(--on-sec-soft)}
  .badge.rec{color:var(--on-accent-soft);background:var(--accent-soft);font-weight:600}
  .badge.ok{color:var(--on-ok-soft);background:var(--ok-soft);font-weight:600}
  .badge.resume{color:var(--on-warn-soft);background:var(--warn-soft);font-weight:600}
  .progbar{position:absolute;left:12px;right:12px;bottom:0;height:3px;border-radius:999px;background:var(--line);overflow:hidden}
  .progbar>i{display:block;height:100%;border-radius:999px;background:var(--accent)}
  .morebtn{width:100%;margin-top:8px;padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface-card);
    color:var(--accent);font-size:12.5px;font-weight:600;cursor:pointer;transition:background .15s var(--ease)}
  .morebtn:hover{background:var(--accent-soft);color:var(--on-accent-soft);border-color:transparent}

  .histbox{padding:6px 4px}
  .histtitle{font-size:11.5px;font-weight:600;color:var(--muted);margin:4px 6px 10px;display:flex;align-items:center;justify-content:space-between;letter-spacing:.02em}
  .histtitle a{color:var(--accent);cursor:pointer;font-size:12px;font-weight:500;padding:2px 6px;border-radius:999px}
  .histtitle a:hover{background:var(--accent-soft)}
  .chips{display:flex;flex-wrap:wrap;gap:7px;padding:0 4px}
  .qchip{display:inline-flex;align-items:center;gap:5px;padding:6px 12px;border-radius:8px;background:var(--surface-card);
    border:1px solid var(--line);color:var(--fg);font-size:12.5px;font-weight:500;cursor:pointer;
    transition:background .15s var(--ease),border-color .15s var(--ease)}
  .qchip:hover{border-color:var(--line-hi);background:var(--accent-soft);color:var(--on-accent-soft)}

  .listnote{padding:10px 12px;font-size:12px;color:var(--dim);line-height:1.6;background:var(--panel2);border-radius:14px;margin-bottom:8px}
  .listnote a{color:var(--accent);cursor:pointer;font-weight:600}

  /* M3 Main Workspace */
  main{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg)}
  .bar{display:flex;gap:12px;align-items:center;padding:10px 20px;background:var(--bg);min-height:62px}
  .bar .who{min-width:0;margin-right:auto;flex:1}
  .bar .t{font-weight:600;font-size:16px;letter-spacing:.005em;color:var(--fg);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bar .subt{display:block;font-size:12px;color:var(--dim);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* M3 Segmented View Tabs */
  .tabs{display:inline-flex;align-items:center;gap:2px;padding:3px;border-radius:999px;background:var(--panel);
    border:1px solid var(--line);flex:none}
  .tab{height:32px;padding:0 14px;border-radius:999px;border:none;background:transparent;color:var(--dim);
    cursor:pointer;font-size:12.5px;font-weight:600;flex:none;transition:background .18s var(--ease),color .18s var(--ease),box-shadow .18s var(--ease);white-space:nowrap}
  .tab:hover:not(:disabled):not(.on){color:var(--fg);background:var(--hover)}
  .tab.on{background:var(--sec-soft);color:var(--on-sec-soft);box-shadow:var(--shadow-1)}
  .tab:disabled{opacity:.35;cursor:not-allowed}

  .dualbar{display:none;align-items:center;gap:8px;padding:0 20px 8px;background:var(--bg);font-size:12px;color:var(--dim);flex-wrap:wrap}
  .dualbar.show{display:flex}
  .chipbtn{height:30px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface-card);color:var(--dim);
    font-size:12px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:5px;transition:all .16s var(--ease)}
  .chipbtn:hover{color:var(--fg);border-color:var(--line-strong);background:var(--hover)}
  .chipbtn.on{color:var(--on-sec-soft);border-color:transparent;background:var(--sec-soft)}

  /* M3 Cinema Player Card */
  .playerbox{flex:1;min-height:0;display:flex;flex-direction:column;position:relative;
    margin:0 20px 10px;border-radius:20px;overflow:hidden;background:#0b0c10;border:1px solid var(--line);box-shadow:var(--shadow-2)}
  .playerbox:fullscreen,.playerbox:-webkit-full-screen{margin:0;border-radius:0;border:none;box-shadow:none;background:#000}
  .stagewrap{flex:1;display:flex;min-height:0;position:relative;overflow:hidden;background:#0b0c10}
  .stage{flex:1;min-height:0;background:#0b0c10;display:grid;gap:2px;position:relative;cursor:pointer}
  .stage.single{grid-template-columns:1fr}
  .stage.dual{grid-template-columns:1fr 1fr}
  .stage.pip{display:block}
  .pane{position:relative;min-height:0;min-width:0;background:#000;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .pane video{width:100%;height:100%;object-fit:contain;background:#000;display:block;pointer-events:none}
  .pane .tag{position:absolute;left:14px;top:12px;font-size:11.5px;font-weight:600;padding:4px 12px;border-radius:999px;
    background:rgba(19,19,20,.68);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.14);color:#eef2f7;pointer-events:none;z-index:2}
  .pane.hide{display:none}
  .stage.pip .pane.pip-big{position:absolute;inset:0;width:100%;height:100%;z-index:1}
  .stage.pip .pane.pip-sub{position:absolute;right:16px;bottom:16px;width:min(30%,320px);aspect-ratio:16/9;height:auto;
    z-index:3;border-radius:14px;border:2px solid rgba(255,255,255,.32);box-shadow:0 14px 36px rgba(0,0,0,.65);cursor:pointer;transition:border-color .18s var(--ease),transform .18s var(--ease)}
  .stage.pip .pane.pip-sub:hover{border-color:#a8c7fa;transform:scale(1.015)}

  .spin{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:6;display:none;align-items:center;gap:10px;
    background:rgba(28,30,36,.88);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.12);border-radius:999px;
    padding:8px 16px;font-size:12.5px;font-weight:500;color:#eef2f7;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.4)}
  .spin.on{display:flex}
  .spin i{width:16px;height:16px;border:2.5px solid rgba(168,199,250,.28);border-top-color:#a8c7fa;border-radius:50%;animation:sp .75s linear infinite;display:block}
  @keyframes sp{to{transform:rotate(360deg)}}

  .pane .perr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:12px;background:rgba(15,16,20,.92);backdrop-filter:blur(12px);color:#eef2f7;padding:24px;text-align:center;font-size:13.5px;z-index:7;cursor:default}
  .pane .perr b{color:#f2b8b5;font-size:15px}
  .pane .perr span{color:#c4c7c5;font-size:12.5px;max-width:460px;line-height:1.7}
  .pane .perr button{background:#a8c7fa;color:#062e6f;border:none;border-radius:999px;padding:9px 20px;font-weight:600;font-size:13px;cursor:pointer;transition:filter .15s}
  .pane .perr button:hover{filter:brightness(1.06)}

  /* Fullscreen HUD */
  .fshud{display:none;position:absolute;left:0;right:0;top:0;z-index:8;padding:14px 20px;
    background:linear-gradient(180deg,rgba(10,11,14,.84),transparent);align-items:center;gap:12px;transition:opacity .25s var(--ease)}
  .playerbox:fullscreen .fshud,.playerbox:-webkit-full-screen .fshud{display:flex}

  }
</style>

<script>
const $ = s => document.querySelector(s);
const LS_THEME = 'yhkt_theme_v1';
function getEffectiveTheme(){
  const t = document.documentElement.dataset.theme;
  if (t === 'light' || t === 'dark') return t;
  return (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
}
function applyTheme(t, persist){
  if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
  else delete document.documentElement.dataset.theme;
  if (persist) { try { localStorage.setItem(LS_THEME, t); } catch(e){} }
  const eff = getEffectiveTheme();
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', eff === 'dark' ? '#1b1c1f' : '#f0f4f9');
  try { if (window.yhktApp && window.yhktApp.setTheme) window.yhktApp.setTheme(eff); } catch(e){}
}
(() => {
  let saved = '';
  try { saved = localStorage.getItem(LS_THEME) || ''; } catch(e){}
  applyTheme(saved, false);
  const bt = $('#btnTheme');
  if (bt) bt.onclick = () => {
    const next = getEffectiveTheme() === 'dark' ? 'light' : 'dark';
    applyTheme(next, true);
    if (typeof toast === 'function') toast(next === 'dark' ? '已切换至深色主题' : '已切换至浅色主题', 1800);
  };
})();
const v = $('#v'), vSub = $('#vSub'), vAux = $('#vAudioAux');
let hls = null, hlsSub = null, hlsAux = null, info = null, infoAudios = [], kind = 'camera', curCourse = null, playCourse = null, curSub = null, curQuery = '';
let serverHasFFmpeg = null;
function activePlayCourse(){ return playCourse || curCourse; }
let dualPip = false, dualSwapped = false, audioFrom = 'camera';
let autoNext = false, lastSaveAt = 0;
let searchSeq = 0, searchAbort = null, listScrollBackup = 0, curSearchLimit = 20;
let isLoggedIn = false;

const LS_RATE = 'yhkt_y2_rate_v1';
const LS_PROG = 'yhkt_y2_prog_v1';
const LS_HIST = 'yhkt_y2_hist_v1';
const LS_AUTONEXT = 'yhkt_y2_autonext_v1';
const LS_AUDIOPREF = 'yhkt_y2_audiopref_v1';

const fmt = t => { if(!isFinite(t)||t<0) t=0; const h=Math.floor(t/3600),m=Math.floor(t%3600/60),s=Math.floor(t%60);
  return (h?String(h).padStart(2,'0')+':':'')+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0'); };
const fmtMB = b => (b / 1048576).toFixed(1) + ' MB';
const b64 = s => btoa(String.fromCharCode(...new TextEncoder().encode(s))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function toast(m, ms){ const t=$('#toast'); t.textContent=m; t.classList.add('on'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('on'), ms||2200); }

async function jget(url, opts){
  const r = await fetch(url, opts);
  if (r.status === 401) { showLogin('登录已过期，重新点一下书签即可'); throw new Error('need login'); }
  return r.json();
}

/* ---------- 偏好与进度记忆 ---------- */
function getSavedRate(){
  try { const r = Number(localStorage.getItem(LS_RATE)); return (r >= 0.5 && r <= 3) ? r : 1; } catch(e){ return 1; }
}
function applyRate(r){
  const rate = Number(r) || 1;
  $('#rate').value = String(rate);
  v.defaultPlaybackRate = rate; vSub.defaultPlaybackRate = rate;
  if (vAux) { vAux.defaultPlaybackRate = rate; vAux.playbackRate = rate; }
  v.playbackRate = rate; vSub.playbackRate = rate;
  try { localStorage.setItem(LS_RATE, String(rate)); } catch(e){}
}
function loadProgMap(){
  try { return JSON.parse(localStorage.getItem(LS_PROG) || '{}') || {}; } catch(e){ return {}; }
}
function saveProgMap(m){
  try {
    const keys = Object.keys(m);
    if (keys.length > 80) keys.sort((a,b) => (m[a].at||0)-(m[b].at||0)).slice(0, keys.length-80).forEach(k => delete m[k]);
    localStorage.setItem(LS_PROG, JSON.stringify(m));
  } catch(e){}
}
let suppressProgressSave = false;
let pendingSeekGuard = 0;

function updateSidebarItemProg(sid, t, dur){
  if (!sid || !dur || dur <= 0) return;
  const el = document.querySelector(`.item[data-sid="${CSS.escape(String(sid))}"]`);
  if (!el) return;
  const pct = Math.min(100, Math.round(t / dur * 100));
  if (pct <= 0) return;
  let bar = el.querySelector('.progbar');
  if (!bar) {
    bar = document.createElement('div');
    bar.className = 'progbar';
    bar.innerHTML = '<i></i>';
    el.appendChild(bar);
  }
  const inner = bar.querySelector('i');
  if (inner) inner.style.width = pct + '%';
}

function saveCourseProgress(force){
  if (suppressProgressSave || window.__yhktRememberPos === false) return;
  const pc = activePlayCourse();
  if (!pc || !curSub) return;
  const now = performance.now();
  if (!force && now - lastSaveAt < 3500) return;
  const t = v.currentTime || 0;
  const dur = (isFinite(v.duration) && v.duration > 0 ? v.duration : 0) || Number(curSub.duration) || 0;
  if (pendingSeekGuard > 0) {
    if (Math.abs(t - pendingSeekGuard) <= 6) {
      pendingSeekGuard = 0;
    } else if (t < Math.max(3, pendingSeekGuard - 6)) {
      return;
    }
  }
  if (t < 3 && !force) return;
  lastSaveAt = now;
  const cid = String(pc.courseId);
  const sid = String(curSub.subId);
  const m = loadProgMap();
  const c = m[cid] || { sessions: {} };
  const prev = c.sessions && c.sessions[sid];
  if (force && t < 3 && prev && prev.t > 5) return;
  c.lastSid = sid; c.at = Date.now();
  c.sessions = c.sessions || {};
  c.sessions[sid] = { t: Math.floor(t), d: Math.floor(dur), at: Date.now() };
  m[cid] = c;
  saveProgMap(m);
  updateSidebarItemProg(sid, t, dur);
}
function getSessionProg(cid, sid){
  if (window.__yhktRememberPos === false) return null;
  const m = loadProgMap()[String(cid)];
  return m && m.sessions ? m.sessions[String(sid)] : null;
}

async function doLogin(tokenFromHash, rawCookie, hint){
  const ta = document.querySelector('#tk');
  const tk = String(tokenFromHash || (ta ? ta.value : '') || '').trim();
  const m = document.querySelector('#m');
  if (m) { m.className='msg'; m.textContent='验证中…'; }
  if (!tk) { if (m) { m.className='msg err'; m.textContent='先粘登录态'; } return; }
  try{
    const j = await jget('/api/y2/login', { method:'POST', headers:{'content-type':'application/json'},
      body: JSON.stringify({ jwt: tk, cookie: String(rawCookie || '').trim() }) });
    if(!j.ok){
      let msg = j.error || '登录失败';
      if (hint === '200') msg += '｜浏览器里同一份 cookie 请求是 200，说明被本地转发拦了';
      else if (hint === '401' || hint === '403') msg += '｜延河那边需重新登录（HTTP ' + hint + '）';
      if (m) { m.className='msg err'; m.textContent = msg; } else toast(msg, 6000);
      return;
    }
    hideLoginModal();
    isLoggedIn = true;
    $('#sdot').classList.remove('off');
    $('#btnLogout').style.display = '';
    $('#btnSetup').textContent = '重登';
    await loadTerms();
    refreshY2Status();
    if (!curCourse) await resumeLast();
    else toast('新版登录状态已更新');
  }catch(e){ if (m) { m.className='msg err'; m.textContent=e.message; } else toast(e.message, 4000); }
}

async function refreshY2Status(){
  const el = $('#ytime');
  try{
    const st = await (await fetch('/api/y2/status')).json();
    isLoggedIn = !!(st && st.loggedIn);
    if (!isLoggedIn) {
      $('#sdot').classList.add('off');
      $('#btnLogout').style.display = 'none';
      $('#btnSetup').textContent = '登录';
      if (el) { el.textContent = '未登录新版'; el.style.color = ''; }
      return st;
    }
    $('#sdot').classList.remove('off');
    $('#btnLogout').style.display = '';
    $('#btnSetup').textContent = '重登';
    if (!el) return st;
    const exp = Number(st.expiresAt) || 0;
    if (!exp) { el.textContent = '新版已登录'; return st; }
    const left = exp * 1000 - Date.now();
    if (left <= 0) { el.textContent = '已过期 · 请重登'; el.style.color = 'var(--warn)'; return st; }
    const txt = left >= 3600000 ? Math.round(left / 3600000) + ' 小时' : Math.max(1, Math.round(left / 60000)) + ' 分钟';
    el.textContent = '还剩 ' + txt;
    el.style.color = left > 3600000 ? 'var(--dim)' : 'var(--warn)';
    return st;
  }catch(e){ if (el) el.textContent = ''; return null; }
}

  const term = curTerm();
  const isOldTerm = term.indexOf('old:') === 0;
  const oldTermName = isOldTerm ? term.slice(4) : '';
  if (!q && !isOldTerm && !term) { toast('先输个课程名，或选学期筛选', 2400); return; }
  if (q) pushHist(q);

  curQuery = q;
  curSearchLimit = limitOverride || 20;
  courseListBackup = null; curCourse = null;
  updateOldLink();

  if (searchAbort) { try { searchAbort.abort(); } catch(e){} }
  searchAbort = new AbortController();
  const sig = searchAbort.signal;
  const seq = ++searchSeq;

  $('#list').innerHTML = '<div class="splash"><span>正在搜索课程…</span></div>';
  $('#fmeta').textContent = '';

  const list = $('#list');
  const section = (title) => {
    const h = document.createElement('div');
    h.className = 'fmeta'; h.style.padding = '8px 4px 4px';
    h.textContent = title;
    return h;
  };

  let newOnes = [];
  let jMeta = { ok:true, total:0, hidden:0, unverified:0, notes:[] };
  let dbMeta = { ok:false, courses:[], total:0 };
  let oldSlot = null;

  const updateHeaderMeta = (loadingOld) => {
    if (seq !== searchSeq || curCourse) return;
    const bits = [];
    if (newOnes.length) bits.push('新版 ' + newOnes.length + (jMeta.total > newOnes.length ? '/' + jMeta.total : '') + ' 门');
    if (dbMeta.courses && dbMeta.courses.length) bits.push('老平台库 ' + dbMeta.total + ' 门');
    else if (loadingOld) bits.push('正加载老平台课程…');
    if (jMeta.hidden) bits.push('已隐藏 ' + jMeta.hidden + ' 门无录像');
    if (jMeta.unverified) bits.push(jMeta.unverified + ' 门未确认');
    const noteText = (jMeta.notes || []).join('；');
    $('#fmeta').innerHTML = esc(bits.join(' · ')) + (noteText ? ' · ' + esc(noteText) : '') + diagHint(jMeta.notes);
  };

  const renderOldSection = (oldOnes) => {
    if (seq !== searchSeq || curCourse) return;
    if (!oldSlot) {
      oldSlot = document.createElement('div');
      list.appendChild(oldSlot);
    }
    oldSlot.innerHTML = '';
    if (!oldOnes.length) return;
    oldSlot.appendChild(section('老平台课程（点开切换老平台）'));
    oldOnes.forEach(c=>{
      const el = document.createElement('div');
      el.className='item';
      el.innerHTML = '<div class="d">' + esc(c.name) + '<span class="badge" style="margin-left:6px">课号 ' + esc(c.id) + '</span></div>'
        + '<div class="m">'
        + (c.term ? '<span class="badge">' + esc(c.term) + '</span>' : '')
        + (c.teacher ? '<span>' + esc(c.teacher) + '</span>' : '')
        + '</div>'
        + '<div class="m">'
        + (c.room ? '<span>教室 ' + esc(c.room) + '</span>' : '')
        + (c.videoCount ? '<span class="badge rec">' + c.videoCount + ' 讲有录像</span>' : '')
        + (c.verified === false ? '<span class="badge" title="' + esc(c.note||'没探到') + '">未确认</span>' : '')
        + '</div>';
      el.onclick = ()=>{ location.href = '/old?course=' + encodeURIComponent(c.id); };
      oldSlot.appendChild(el);
    });
  };

  const y2Promise = !isOldTerm
    ? fetch('/api/y2/search?q=' + encodeURIComponent(q) + (term ? '&term=' + encodeURIComponent(term) : '') + '&limit=' + curSearchLimit, { signal: sig })
        .then(r => r.json()).catch(e => (e && e.name === 'AbortError' ? { aborted:true } : { ok:false, error:e.message, courses:[] }))
    : Promise.resolve({ ok:true, courses:[], hidden:0, unverified:0, source:'skipped', notes:[] });

  const dbQS = 'q=' + encodeURIComponent(q) + (oldTermName ? '&term=' + encodeURIComponent(oldTermName) : '') + '&limit=' + (isOldTerm ? 80 : 20);
  const dbFastPromise = fetch('/api/db/search?' + dbQS + '&probe=0', { signal: sig })
    .then(r => r.json()).catch(() => ({ ok:false, courses:[], total:0 }));

  try{
    const j = await y2Promise;
    if (j && j.aborted || seq !== searchSeq) return;
    jMeta = j || jMeta;
    newOnes = (j.ok && j.courses) ? j.courses : [];

    // 立即先渲染新版结果（毫秒级出图），绝不卡在老平台网络探测上
    list.innerHTML = '';
    if (newOnes.length) {
      list.appendChild(section('新版平台'));
      const pending = [];
      newOnes.forEach(c=>{
        const el = document.createElement('div');
        el.className='item';
        el.dataset.cid = c.courseId;
        const tn = c.termName || (c.termId ? termName(c.termId) : '');
        el.innerHTML = '<div class="d">' + esc(c.title || '（未命名课程）') + '</div>'
          + '<div class="m">'
          + (tn ? '<span class="badge">' + esc(tn) + '</span>' : '')
          + (c.teacher ? '<span>' + esc(c.teacher) + '</span>' : '')
          + '</div>'
          + '<div class="m">'
          + (c.room ? '<span>教室 ' + esc(c.room) + '</span>' : '')
          + '<span class="bd">' + badges(c) + '</span>'
          + '</div>';
        el.onclick = ()=>{ loadSessions(c, el); };
        list.appendChild(el);
        if (isLoggedIn && c.verified !== true) pending.push({ c, el });
      });
      if (pending.length) fillVerdicts(pending);
      if (j.total > newOnes.length && curSearchLimit < 80) {
        const more = document.createElement('button');
        more.type = 'button'; more.className = 'morebtn';
        more.textContent = `显示更多新版结果（已列 ${newOnes.length} / 共 ${j.total} 门）`;
        more.onclick = () => doFind(Math.min(80, curSearchLimit + 30));
        list.appendChild(more);
      }
      oldSlot = document.createElement('div');
      oldSlot.innerHTML = '<div class="listnote" style="margin-top:8px">正在加载老平台课程…</div>';
      list.appendChild(oldSlot);
      updateHeaderMeta(true);
    } else {
      updateHeaderMeta(true);
      list.innerHTML = '<div class="splash"><span>正在同步老平台课程库…</span></div>';
    }

    const db0 = await dbFastPromise;
    if (seq !== searchSeq || curCourse) return;
    dbMeta = db0 || dbMeta;
    const oldOnes = (db0.ok && db0.courses) ? db0.courses : [];
    if (!newOnes.length && !oldOnes.length){
      if (!j.ok && j.error) $('#fmeta').textContent = '新版检索提示：' + j.error;
      list.innerHTML = '<div class="splash"><b>没找到</b><span>课程库里没有匹配的课</span>'
        + '<span class="tiny">换个说法，或把学期改成「全部学期」</span></div>';
      return;
    }
    if (!newOnes.length) list.innerHTML = '';
    updateHeaderMeta(false);
    renderOldSection(oldOnes);

    if (db0.ok && !db0.probed && oldOnes.length > 0) {
      fetch('/api/db/search?' + dbQS + '&probe=1', { signal: sig })
        .then(r => r.json())
        .then(db1 => {
          if (seq !== searchSeq || curCourse || !db1 || !db1.ok) return;
          dbMeta = db1;
          updateHeaderMeta(false);
          renderOldSection(db1.courses || []);
        }).catch(() => {});
    }
  }catch(e){
    if (e.name === 'AbortError' || seq !== searchSeq) return;
    $('#list').innerHTML = '<div class="splash"><b>出错</b><span>'+ esc(e.message) +'</span></div>';
  }
}

function badges(c){
  let h = '';
  if(c.videoCount) h += '<span class="badge rec">' + c.videoCount + ' 讲有录像</span>';
  else if(c.verified) h += '<span class="badge rec">有录像</span>';
  if(c.noVideo) h += '<span class="badge">没录像</span>';
  if(c.totalSessions > c.videoCount) h += '<span class="badge" title="共 ' + c.totalSessions + ' 讲">共 ' + c.totalSessions + ' 讲</span>';
  if(c.verified === false && !c.noVideo) h += '<span class="badge" title="' + esc(c.note||'还没确认过') + '">未确认</span>';
  return h;
}

async function fillVerdicts(pending){
  const ids = pending.slice(0, 20).map(x => x.c.courseId);
  if(!ids.length) return;
  let items = [];
  try{
    const r = await fetch('/api/y2/verify', { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({ ids }) });
    const j = await r.json();
    if(!j.ok) return;
    items = j.items || [];
  }catch(e){ return; }
  const byId = new Map(items.map(i => [i.courseId, i]));
  let noVideo = 0;
  pending.forEach(({ c, el })=>{
    const vres = byId.get(c.courseId);
    if(!vres || vres.error) return;
    if(vres.videos > 0){
      c.verified = true;
      c.videoCount = vres.checked ? vres.videos : null;
      c.totalSessions = vres.total || c.totalSessions;
    }else if(vres.checked){
      noVideo++; c.noVideo = true; c.verified = false;
      el.classList.add('dim');
    }
    const bd = el.querySelector('.bd');
    if(bd) bd.innerHTML = badges(c);
  });
  if(noVideo){
    const meta = $('#fmeta');
    if(meta) meta.textContent = meta.textContent + ' · ' + noVideo + ' 门没录像';
  }
}

let courseListBackup = null, fmetaBackup = '';

function pushCourseList(){
  if (courseListBackup || curCourse) return;
  const list = $('#list');
  if (!list.firstElementChild || list.querySelector('.histbox') || list.querySelector('.splash') || list.querySelector('.backrow')) return;
  listScrollBackup = list.scrollTop;
  courseListBackup = document.createElement('div');

  while (list.firstChild) courseListBackup.appendChild(list.firstChild);
  fmetaBackup = $('#fmeta').textContent;
}

function backToCourseList({ fromPop = false } = {}){
  if (!fromPop && history.state && history.state.y2course) {
    history.back();
    return;
  }
  const list = $('#list');
  if (!courseListBackup) {
    curCourse = null;
    $('#fmeta').textContent = '输入课程名或教师名开始搜课';
    renderHist();
    return;
  }
  list.innerHTML = '';
  while (courseListBackup.firstChild) list.appendChild(courseListBackup.firstChild);

});

function rowBack(c){
  const el = document.createElement('div');
  el.className = 'backrow';
  el.innerHTML = '<svg viewBox="0 0 24 24"><path d="M19 11H7.83l4.88-4.88c.39-.39.39-1.03 0-1.42a.996.996 0 0 0-1.41 0l-6.59 6.59a.996.996 0 0 0 0 1.41l6.59 6.59a.996.996 0 1 0 1.41-1.41L7.83 13H19c.55 0 1-.45 1-1s-.45-1-1-1z" fill="currentColor"/></svg><span class="bk">返回课程列表</span>' + (c && c.title ? '<b>' + esc(c.title) + '</b>' : '');
  el.onclick = () => { backToCourseList(); };
  return el;

const subPrefetchSet = new Set();
function prefetchY2Sub(cid, subId){
  if (!cid || !subId) return;
  const k = cid + ':' + subId;
  if (subPrefetchSet.has(k)) return;
  subPrefetchSet.add(k);
  fetch(`/api/y2/sub?courseId=${encodeURIComponent(cid)}&subId=${encodeURIComponent(subId)}`).catch(()=>{});
}

async function loadSessions(c, el, opts){
  if (c && c.courseId) remember(c, $('#q').value.trim());
  if (!isLoggedIn) {
    showLogin('点播该课程录像前请先登录新版平台');
    return;
  }
  const wasSameCourse = curCourse && String(curCourse.courseId) === String(c.courseId);
  pushCourseList();
  try {
    if (!wasSameCourse && courseListBackup) history.pushState({ y2course: c.courseId }, '', '?course=' + encodeURIComponent(c.courseId));
  } catch(e) {}
  curCourse = c;
  if (el) document.querySelectorAll('.item').forEach(x=>x.classList.toggle('on', x===el));
  remember(c, curQuery);
  $('#now').textContent = c.title || '读取中…';
  $('#nowSub').textContent = [c.teacher, c.termName].filter(Boolean).join(' · ') || '正在读取讲次列表…';
  $('#fsTitle').textContent = $('#now').textContent;
  $('#list').innerHTML = '<div class="splash"><span>正在读取讲次列表…</span></div>';
  try{
    const url = '/api/y2/sessions?courseId=' + encodeURIComponent(c.courseId)
      + '&q=' + encodeURIComponent(curQuery)
      + '&termName=' + encodeURIComponent(c.termName || '')
      + (curTerm() && curTerm().indexOf('old:') !== 0 ? '&term=' + encodeURIComponent(curTerm()) : '')
      + (opts && opts.refresh ? '&refresh=1' : '');
    const j = await jget(url);
    const list = $('#list');
    if(!j.ok){
      list.innerHTML = '';
      list.appendChild(rowBack(c));
      list.insertAdjacentHTML('beforeend', '<div class="splash"><b>取讲次失败</b><span>'+ esc(j.error||'') +'</span></div>');
      return;
    }
    curCourse._sessions = j.sessions || [];
    list.innerHTML = '';
    list.appendChild(rowBack(c));
    if(!j.sessions.length){
      const empty = document.createElement('div');
      empty.className = 'splash';
      empty.innerHTML = '<b>没有可看的讲次</b><span>这门课在 ' + (curTerm()?'这个学期':'任何学期') + ' 都没有录像</span>'
        + (j.hidden ? '<span class="tiny">' + j.hidden + ' 讲里没有一节有录像</span>' : '')
        + (j.notes && j.notes.length ? '<span class="tiny">' + esc(j.notes.join('；')) + '</span>' + diagHint(j.notes) : '');
      list.appendChild(empty);
      return;
    }
    $('#fmeta').textContent = j.sessions.length + ' 讲有录像' + (j.total > j.sessions.length ? '（共 ' + j.total + ' 讲）' : '');

    const progCourse = loadProgMap()[String(c.courseId)] || {};
    let resumeNode = null, firstPlayable = null;
    j.sessions.forEach(s=>{
      const el2 = document.createElement('div');
      el2.className = 'item';
      el2.dataset.sid = s.subId;
      const dur = s.duration ? Math.round(s.duration/60) + ' 分钟' : '';
      const tn = s.termName || '';
      const p = getSessionProg(c.courseId, s.subId);
      const pct = (p && p.d > 0) ? Math.min(100, Math.round(p.t / p.d * 100)) : 0;
      el2.innerHTML = '<div class="d">' + esc((s.date||'—') + (s.period ? ' ' + s.period : '') + (s.title && s.title !== s.period ? ' · ' + s.title : '')) + '</div>'
        + '<div class="m">'
        + (dur ? '<span>' + dur + '</span>' : '')
        + (s.room ? '<span>' + esc(s.room) + '</span>' : '')
        + (tn ? '<span>' + esc(tn) + '</span>' : '')
        + '</div>'
        + (pct > 0 ? `<div class="progbar"><i style="width:${pct}%"></i></div>` : '');
      el2.onmouseenter = ()=>{ prefetchY2Sub(c.courseId, s.subId); };
      el2.onclick = ()=>{ closeDrawer(); play(s, el2); };
      if (!firstPlayable) firstPlayable = { s, el2 };
      if (progCourse.lastSid && String(progCourse.lastSid) === String(s.subId)) resumeNode = { s, el2 };
      list.appendChild(el2);
    });

    if (opts && opts.autoLatest) {
      const target = resumeNode || firstPlayable;
      if (target) {
        target.el2.classList.add('on');
        play(target.s, target.el2);
      }
    } else {
      const warm = resumeNode || firstPlayable;
      if (warm) prefetchY2Sub(c.courseId, warm.s.subId);
    }
  }catch(e){
    if (e.message === 'need login') return;
    const list = $('#list');
    list.innerHTML = '';
    list.appendChild(rowBack(c));
    list.insertAdjacentHTML('beforeend', '<div class="splash"><b>出错</b><span>'+ esc(e.message) +'</span></div>');
  }
}

async function play(s, el, { noResume = false, courseData = null } = {}){
  saveCourseProgress(true);
  suppressProgressSave = true;
  if (courseData && courseData.courseId) {
    playCourse = courseData;
  } else if (curCourse && curCourse.courseId &&
             (!Array.isArray(curCourse._sessions) || curCourse._sessions.some(x => String(x.subId) === String(s.subId)))) {
    playCourse = curCourse;
  }
  const pc = activePlayCourse();
  if (!pc || !pc.courseId) { suppressProgressSave = false; toast('还没有课程信息', 2600); return; }
  document.querySelectorAll('.item').forEach(x=>x.classList.toggle('on', x===el));
  const t0 = performance.now();
  curSub = s;
  const saved = !noResume ? getSessionProg(pc.courseId, s.subId) : null;
  const resumeAt = (saved && saved.t > 5 && (!saved.d || saved.t < saved.d - 15)) ? saved.t : 0;
  pendingSeekGuard = resumeAt;

  try{
    const j = await jget(`/api/y2/sub?courseId=${encodeURIComponent(pc.courseId)}&subId=${encodeURIComponent(s.subId)}`);
    if(!j.ok){ suppressProgressSave = false; pendingSeekGuard = 0; toast('读取失败：'+(j.error||''), 4000); return; }
    info = j.info;
    infoAudios = Array.isArray(j.audios) ? j.audios : (info && info.audio ? [{ label: '独立音频', url: info.audio, format: 'aac' }] : []);
    updateTabs();
    updateNavButtons();
    if (resumeAt > 0) toast('已从 ' + fmt(resumeAt) + ' 续播', 2600);
    pick(t0, { seekTo: resumeAt, autoPlay: true });
    const nextS = adjacentSession(1);
    if (nextS) prefetchY2Sub(pc.courseId, nextS.subId);
  }catch(e){ suppressProgressSave = false; pendingSeekGuard = 0; if (e.message !== 'need login') toast('出错：'+e.message, 4000); }
}

function adjacentSession(dir){
  const pc = activePlayCourse();
  const arr = (pc && pc._sessions) || [];
  if (!arr.length || !curSub) return null;
  const idx = arr.findIndex(x => String(x.subId) === String(curSub.subId));
  if (idx < 0) return null;
  const ni = idx + dir;
  return (ni >= 0 && ni < arr.length) ? arr[ni] : null;
}
function updateNavButtons(){
  const p = adjacentSession(-1), n = adjacentSession(1);
  $('#btnPrev').disabled = !p;
  $('#btnNext').disabled = !n;
}

function detachOne(which){
  if (which === 'sub') {
    if (hlsSub) { try { hlsSub.destroy(); } catch(e){} hlsSub = null; }
