let dbTermsLoaded = false;
async function loadDbTerms(){
  if (dbTermsLoaded) return;
  try {
    const j = await (await fetch('/api/db/terms')).json();
    if (j.ok && j.terms && j.terms.length) {
      const sel = $('#dterm');
      for (const t of j.terms) {
        const o = document.createElement('option');
        o.value = t; o.textContent = t;
        sel.appendChild(o);
      }
      dbTermsLoaded = true;
    }
    if (j.meta && j.meta.count) $('#dq').placeholder = `课程名 / 教师名（库 ${j.meta.count} 门）`;
  } catch (e) {}
}

function dbRow(c){
  const el = document.createElement('div');
  el.className = 'item';
  const meta = [];
  if (c.term) meta.push(`<span>${esc(c.term)}</span>`);
  if (c.teacher) meta.push(`<span>${esc(c.teacher)}</span>`);
  if (c.room) meta.push(`<span>${esc(c.room)}</span>`);
  if (c.videoCount) meta.push(`<span class="pill ok">${c.videoCount} 讲可播</span>`);
  if (c.tag) meta.push(`<span class="pill" title="${esc(c.note || '')}">${esc(c.tag)}</span>`);
  else if (c.verified === false) meta.push(`<span class="pill" title="${esc(c.note || '')}">未确认</span>`);
  // resume badge removed intentionally while keeping breakpoint resume state
  el.innerHTML = `<div class="d">${esc(c.name)}${c.code ? `<span class="t">${esc(c.code)}</span>` : ''}</div>`
    + `<div class="m">${meta.join('') || '<span>' + esc(c.id) + '</span>'}</div>`;
  el.onclick = () => { openCourse(c.id); };
  return el;
}

function syncClearBtn(){
  $('#dqClr').classList.toggle('show', $('#dq').value.length > 0);
  updateY2Href();
}

async function dbSearch(){
  const q = $('#dq').value.trim();
  const term = $('#dterm').value;
  updateY2Href();
  if (srcMode === 'live') { liveQuery = q; renderLive(); return; }
  if (!q && !term) { renderHist(); toast('先输个课程名，或选学期筛选', 2400); return; }

  if (q) pushHist(q);
  courseListBackup = null; headBackup = null; curCourse = null;
  if (searchAbort) { try { searchAbort.abort(); } catch(e){} }
  searchAbort = new AbortController();
  const seq = ++searchSeq;

  const list = $('#list');
  list.innerHTML = '<div class="splash" style="padding:20px"><span style="font-size:12px">正在极速检索课程…</span></div>';

  const renderResult = (j, probing) => {
    if (seq !== searchSeq || curCourse) return;
    if (!j.ok) {
      list.innerHTML = '<div class="splash" style="padding:20px"><span style="font-size:12px">' + esc(j.error || '搜索失败') + '</span></div>';
      return;
    }
    if (!j.courses.length) {
      const why = j.hidden ? ('匹配的 ' + j.hidden + ' 门课都没有可播放的录像') : '课程库里没有匹配的课';
      list.innerHTML = '<div class="splash" style="padding:20px"><span style="font-size:12px">' + esc(why) + '</span></div>';
      return;
    }

    list.innerHTML = '';
    const withVideo = j.courses.filter(c => (c.videoCount || 0) > 0).length;
    const head = document.createElement('div');
    head.className = 'dbmeta';
    const bits = [`匹配 ${j.total} 门`, `列出 ${j.courses.length} 门`];
    if (j.probed) bits.push(`${withVideo} 门有录像`);
    else if (probing) bits.push('正后台核对录像数…');
    if (j.hidden) bits.push(`跳过 ${j.hidden} 门无录像`);
    if (j.source === 'catalog') bits.push('离线课程库');
    if (!j.probed && !probing) bits.push('未登录 → 未查录像数');
    head.textContent = bits.join(' · ');
    list.appendChild(head);

    if (q) {
      const tip = document.createElement('div');
      tip.className = 'listnote';
      tip.innerHTML = `2024 后的课在 <a href="/y2?q=${encodeURIComponent(q)}">新版平台 →</a> 播放快 3~5 倍`;
      list.appendChild(tip);
    }

    j.courses.forEach(c => list.appendChild(dbRow(c)));

    if (j.truncated) {
      const end = document.createElement('div');
      end.className = 'listnote';
      end.textContent = '仅列出前 ' + j.cap + ' 门，可将关键词写更具体或按学期筛选';
      list.appendChild(end);
    }
  };

  try {
    const baseQS = 'q=' + encodeURIComponent(q) + '&term=' + encodeURIComponent(term) + '&limit=100';
    // 先快速取排序后的基础结果（不等待 120 门录像探查）
    const j0 = await (await fetch('/api/db/search?' + baseQS + '&probe=0', { signal: searchAbort.signal })).json();
    if (seq !== searchSeq || curCourse) return;
    renderResult(j0, !!me);

    if (me && !j0.probed) {
      const j1 = await (await fetch('/api/db/search?' + baseQS + '&probe=1', { signal: searchAbort.signal })).json();
      if (seq !== searchSeq || curCourse) return;
      renderResult(j1, false);
    }
  } catch (e) {
    if (e.name === 'AbortError' || seq !== searchSeq) return;
    list.innerHTML = '<div class="splash" style="padding:20px"><span style="font-size:12px">出错：' + esc(e.message) + '</span></div>';
  }
}

/* ---------- 网页版下载进度面板 ---------- */
let dlPoll = 0;
function openWebDownloads(){
  $('#dlModal').style.display = 'flex';
  refreshWebDownloads();
}
function closeWebDownloads(){
  $('#dlModal').style.display = 'none';
  clearTimeout(dlPoll); dlPoll = 0;
}
$('#dlClose').onclick = closeWebDownloads;
if ($('#dlClear')) $('#dlClear').onclick = clearWebDownloads;
$('#dlModal').onclick = e => { if (e.target === $('#dlModal')) closeWebDownloads(); };

async function refreshWebDownloads(){
  clearTimeout(dlPoll);
  try {
    const j = await (await fetch('/api/downloads')).json();
    const items = (j && j.items) || [];
    const running = items.filter(x => x.status === 'running').length;
    const queued = items.filter(x => x.status === 'queued').length;
    const activeCnt = running + queued;
    const interrupted = items.filter(x => x.status === 'interrupted').length;
    const dlEntry = $('#btnDl2');
    if (dlEntry && !NATIVE_DL) {
      let badge = '';
      if (activeCnt > 0) badge = '（' + activeCnt + ' 进行中）';
      else if (interrupted > 0) badge = '（' + interrupted + ' 未完成）';
      dlEntry.textContent = '⤓ 下载管理' + badge;
      dlEntry.classList.toggle('busy', activeCnt > 0);
      dlEntry.classList.toggle('warn', activeCnt === 0 && interrupted > 0);
    }
    if ($('#dlModal').style.display === 'flex') {
      const body = $('#dlBody');
      if (!items.length) {
        body.innerHTML = '<div class="listnote">当前还没有下载任务。播放界面点「下载」或打开「📦 批量搜课下载专区」即可批量稳定下载。</div>';
      } else {
        body.innerHTML = items.map(it => {
          const pct = it.totalSegs > 1 ? Math.round(it.doneSegs / it.totalSegs * 100)
            : (it.totalBytes > 0 ? Math.round(it.bytes / it.totalBytes * 100) : (it.status === 'done' ? 100 : 0));
          const speedTxt = (it.status === 'running' && it.speedBps > 0) ? (fmtMB(it.speedBps) + '/s · ') : '';
          const stText = it.status === 'running' ? '下载中'
            : it.status === 'queued' ? '排队中'
            : it.status === 'done' ? '已完成'
            : it.status === 'interrupted' ? '已中断（可继续）'
            : it.status === 'cancelled' ? '已取消' : ('失败 ' + (it.error || ''));
          const segText = it.totalSegs > 1 ? `${it.doneSegs}/${it.totalSegs} 片 · ` : '';
          let act = '';
          if (it.status === 'running' || it.status === 'queued') {
            act = `<button class="dlcancel" type="button" onclick="cancelWebDownload('${esc(it.id)}')">取消</button>`;
          } else if (it.status === 'interrupted' || it.status === 'error' || it.status === 'cancelled') {
            const btnTxt = it.status === 'interrupted' ? '继续下载' : '重下';
            const resumeBtn = it.reqPath ? `<button class="dlcancel" style="color:#a9d4ff;background:rgba(91,156,255,.15)" type="button" onclick="resumeWebDownload('${esc(it.id)}','${esc(it.reqPath)}')">${btnTxt}</button>` : '';
            const delBtn = `<button class="dlcancel" type="button" onclick="removeWebDownload('${esc(it.id)}',true)">删除</button>`;
            act = resumeBtn + delBtn;
          } else if (it.status === 'done') {
            const dirBtn = (DESKTOP_APP && it.savePath) ? `<button class="dlcancel" style="color:#8be9be;background:rgba(52,211,153,.14)" type="button" onclick="openSavedFolder('${esc(it.savePath)}')">打开目录</button>` : '';
            const rmBtn = `<button class="dlcancel" style="color:var(--dim);background:var(--panel2)" type="button" onclick="removeWebDownload('${esc(it.id)}',false)">移除</button>`;
            act = dirBtn + rmBtn;
          }
          const pathHint = it.savePath ? `<div style="font-size:10.5px;color:var(--muted);margin-top:3px;word-break:break-all">${esc(it.savePath)}</div>` : '';
          return `<div class="dlrow"><div class="dt">${esc(it.title)}</div>`
            + `<div class="dm"><span>${esc(stText)}</span><span style="display:flex;align-items:center;gap:6px">${speedTxt}${segText}${fmtMB(it.bytes)}${act}</span></div>`
            + pathHint
            + `<div class="dlbar"><i style="width:${Math.min(100,pct)}%"></i></div></div>`;
        }).join('');
      }
    }
    if (activeCnt > 0 || $('#dlModal').style.display === 'flex') {
      dlPoll = setTimeout(refreshWebDownloads, 900);
    }
  } catch (e) {}
}

function resumeWebDownload(id, reqPath){
  if (!reqPath) return;
  const sep = reqPath.indexOf('?') >= 0 ? '&' : '?';
  window.open(reqPath + sep + 'resumeId=' + encodeURIComponent(id), '_blank');
  toast('正在恢复下载…', 2600);
  setTimeout(refreshWebDownloads, 600);
}

async function removeWebDownload(id, deleteFile){
  try {
    await fetch('/api/downloads/remove?id=' + encodeURIComponent(id) + (deleteFile ? '&deleteFile=1' : ''), { method: 'POST' });
    refreshWebDownloads();
  } catch (e) {}
}

async function clearWebDownloads(){
  try {
    await fetch('/api/downloads/clear', { method: 'POST' });
    refreshWebDownloads();
  } catch (e) {}
}

function openSavedFolder(p){
  if (!p) return;
  const dir = p.replace(/[\\/][^\\/]+$/, '');
  if (window.yhktApp && window.yhktApp.openDownloadDir) window.yhktApp.openDownloadDir(dir);
}

async function cancelWebDownload(id){
  try {
    await fetch('/api/downloads/cancel?id=' + encodeURIComponent(id), { method: 'POST' });
    toast('已取消下载', 2400);
    refreshWebDownloads();
  } catch (e) {}
}

/* ---------- 控件与快捷键 ---------- */
$('#mRec').onclick = () => setSrcMode('record');
$('#mLive').onclick = () => setSrcMode('live');
$('#dgo').onclick = dbSearch;
$('#dqClr').onclick = () => { $('#dq').value = ''; syncClearBtn(); $('#dq').focus(); if (srcMode === 'live') { liveQuery = ''; renderLive(); } else if (!curCourse) renderHist(); };
$('#dq').addEventListener('input', syncClearBtn);
$('#dq').addEventListener('keydown', e => { if (e.key === 'Enter') dbSearch(); });
$('#dterm').onchange = () => { if (srcMode === 'record' && ($('#dq').value.trim() || $('#dterm').value)) dbSearch(); };
$('#btnSetup').onclick = () => showLogin('', true);
$('#btnRefresh').onclick = () => { if (curCourse) openCourse(curCourse.course.id, { force: true }); };

function downloadCurrent(){
  if (srcMode === 'live') { toast('直播是实时流，不能下载；想存就等它变成回放', 3600); return; }
  if (!cur) { toast('先点一个讲次', 2600); return; }
  const kind = mode === 'vga' ? 'vga' : 'main';
  const label = kind === 'vga' ? '课件' : '全景';
  if (!cur[kind]) { toast('这一讲没有' + label + '画面', 3000); return; }
  const cid = curCourse && curCourse.course && curCourse.course.id;
  if (!cid) { toast('还没有课程信息', 2600); return; }
  const cname = (curCourse.course && curCourse.course.name) || '课程';
  const title = cname + '_' + (cur.date || '') + '_' + label;
  const url = '/dl?course=' + encodeURIComponent(cid)
    + '&session=' + encodeURIComponent(cur.id) + '&kind=' + kind + '&title=' + encodeURIComponent(title);
  window.open(url, '_blank');
  toast('开始下载' + label + '画面，可在「下载管理」看进度', 4200);
  if (!NATIVE_DL) setTimeout(refreshWebDownloads, 600);
}

$('#btnLogout').onclick = async () => {
  try { sessionStorage.setItem('yhkt_manual_logout', '1'); } catch(e){}
  await fetch('/api/logout', { method: 'POST' });
  try { if (window.yhktApp && window.yhktApp.clearAuth) window.yhktApp.clearAuth('old'); } catch(e){}
  if (APP && window.__yhktRefresh) window.__yhktRefresh();
  destroy('main'); destroy('vga'); destroy('aux');
  showLogin('已退出登录');
};

$('#btnPlay').onclick = () => {
  const v = activeVideo();
  if (v.paused) {
    v.play().catch(()=>{});
    if (mode === 'dual') vids.vga.play().catch(()=>{});
    if (auxAudioActive && vids.aux) vids.aux.play().catch(()=>{});
  } else {
    v.pause();
    if (mode === 'dual') vids.vga.pause();
    if (auxAudioActive && vids.aux) vids.aux.pause();
  }
  wakeHud();
};
$('#btnPrev').onclick = () => { const s = adjacentSession(-1); if (s) loadSession(s); };
$('#btnNext').onclick = () => { const s = adjacentSession(1); if (s) loadSession(s); };
$('#btnAutoNext').onclick = () => {
  autoNext = !autoNext;
  $('#btnAutoNext').classList.toggle('on', autoNext);
  try { localStorage.setItem(LS_AUTONEXT, autoNext ? '1' : '0'); } catch(e){}
  toast(autoNext ? '已开启自动连播' : '已关闭自动连播');
};
$('#btnMute').onclick = () => {
  isMuted = !isMuted;
  $('#btnMute').textContent = isMuted ? '🔇' : '🔊';
  updateAudioMute();
};
$('#vol').oninput = e => {
  const val = Number(e.target.value);
  vids.main.volume = val; vids.vga.volume = val;
  if (vids.aux) vids.aux.volume = val;
  if (val > 0 && isMuted) { isMuted = false; $('#btnMute').textContent = '🔊'; updateAudioMute(); }
};
$('#audioSrc').onchange = e => setAudioSourceKey(e.target.value);

$('#btnLayout').onclick = () => { dualPip = !dualPip; renderStage(); };
$('#btnSwap').onclick = () => { dualSwapped = !dualSwapped; renderStage(); };
$('#btnAudioSrc').onclick = () => {
  const srcs = getAvailableAudioSources();
  if (!srcs.length) return;
  const idx = srcs.findIndex(s => s.key === activeAudioKey);
  const next = srcs[(idx + 1) % srcs.length];
  if (next) setAudioSourceKey(next.key);
};

const wrapEl = $('#wrap');
const closeDrawer = () => { if (wrapEl) wrapEl.classList.remove('drawer'); };
if ($('#menu')) $('#menu').onclick = () => { if (wrapEl) wrapEl.classList.toggle('drawer'); };
if ($('#backdrop')) $('#backdrop').onclick = closeDrawer;

window.__yhktDl = (n) => {
  const a = document.getElementById('btnDl2');
  if (a) {
    a.textContent = '⤓ 下载管理' + (n > 0 ? '（' + n + '）' : '');
    a.classList.toggle('busy', n > 0);
  }
};
if ($('#btnDl2')) $('#btnDl2').onclick = e => {
  e.preventDefault();
  closeDrawer();
  if (window.yhktApp && window.yhktApp.openDownloads) window.yhktApp.openDownloads();
  else openWebDownloads();
};

if (APP) {
  const so = document.getElementById('btnSetup'); if (so) so.style.display = 'none';
  const lg = document.getElementById('lgbtn');
  if (lg) {
    lg.style.display = 'inline-block';
    lg.onclick = () => { closeDrawer(); showAppLogin('', true); };
  }
}

document.querySelectorAll('[data-jump]').forEach(b => b.onclick = () => {
  pendingSeekGuard = 0; suppressProgressSave = false;
  const delta = Number(b.dataset.jump);
  const v = activeVideo();
  const next = Math.max(0, (v.currentTime || 0) + delta);
  v.currentTime = next;
  if (mode === 'dual') { vids.main.currentTime = next; try { vids.vga.currentTime = next; } catch(e){} }
  if (auxAudioActive && vids.aux) { try { vids.aux.currentTime = next; } catch(e){} }
  wakeHud();
});
$('#rate').onchange = e => applyRate(e.target.value);
$('#btnFs').onclick = () => {
  const box = $('#playerBox');
  if (document.fullscreenElement || document.webkitFullscreenElement) {
    const exit = document.exitFullscreen || document.webkitExitFullscreen;
    if (exit) exit.call(document);
    return;
  }
  const req = box.requestFullscreen || box.webkitRequestFullscreen;
  if (req) {
    const r = req.call(box);
    if (r && r.catch) r.catch(() => {
      const v = activeVideo();
      if (v.webkitEnterFullscreen) try { v.webkitEnterFullscreen(); } catch(e){}
    });
  } else if (activeVideo().webkitEnterFullscreen) {
    try { activeVideo().webkitEnterFullscreen(); } catch(e){}
  }
};
$('#btnDl').onclick = () => downloadCurrent();

function switchTab(m){
  mode = m;
  ensureStreamsForMode();
  renderStage();
  if (srcMode === 'live') applyLive();
  wakeHud();
}
document.querySelectorAll('.tab').forEach(b => b.onclick = () => {
  if (b.disabled) return;
  switchTab(b.dataset.mode);
});

document.addEventListener('keydown', e => {
  if (/^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName)) return;
  if (e.code === 'Space' || e.key === 'k' || e.key === 'K') { e.preventDefault(); $('#btnPlay').click(); }
  else if (e.code === 'ArrowLeft')  document.querySelector('[data-jump="-15"]').click();
  else if (e.code === 'ArrowRight') document.querySelector('[data-jump="15"]').click();
  else if (e.code === 'ArrowUp')   { e.preventDefault(); const n = Math.min(1, Number($('#vol').value) + 0.1); $('#vol').value = n.toFixed(2); $('#vol').dispatchEvent(new Event('input')); toast('音量 ' + Math.round(n*100) + '%'); }
  else if (e.code === 'ArrowDown') { e.preventDefault(); const n = Math.max(0, Number($('#vol').value) - 0.1); $('#vol').value = n.toFixed(2); $('#vol').dispatchEvent(new Event('input')); toast('音量 ' + Math.round(n*100) + '%'); }
  else if (e.key === 'f' || e.key === 'F') $('#btnFs').click();
  else if (e.key === 'm' || e.key === 'M') $('#btnMute').click();
  else if (e.key === '1') switchTab('main');
  else if (e.key === '2' && !document.querySelector('.tab[data-mode="vga"]').disabled) switchTab('vga');
  else if (e.key === '3' && !document.querySelector('.tab[data-mode="dual"]').disabled) switchTab('dual');
  else if (e.key === 'Escape') { hideLoginModal(); closeWebDownloads(); if (window.yhktBatch) window.yhktBatch.close(); if (window.yhktSettings) window.yhktSettings.close(); }
});

/* 给 Android App 返回键用的优先关闭钩子 */
window.__yhktBack = () => {
  if (window.yhktSettings && window.yhktSettings.isOpen()) { window.yhktSettings.close(); return 'handled'; }
  if (window.yhktBatch && window.yhktBatch.isOpen()) { window.yhktBatch.close(); return 'handled'; }
  if ($('#dlModal').style.display === 'flex') { closeWebDownloads(); return 'handled'; }
  if ($('#lgmodal').style.display === 'flex') { hideLoginModal(); return 'handled'; }
  if ($('#wrap').classList.contains('drawer')) { closeDrawer(); return 'handled'; }
  if (curCourse && courseListBackup) { backToCourseList(); return 'handled'; }
  return 'none';
};

function mapOldView(v){
  return v === 'dual' ? 'dual' : v === 'screen' ? 'vga' : 'main';
}
function applyAppSettings(s){
  if (!s) return;
  window.__yhktRememberPos = (s.rememberPos !== false);
  autoNext = !!s.autoNext;
  $('#btnAutoNext').classList.toggle('on', autoNext);
  try { localStorage.setItem(LS_AUTONEXT, autoNext ? '1' : '0'); } catch(e){}
  dualPip = !!s.dualPip;
  if (typeof applyRate === 'function') applyRate(s.defaultRate || 1);
  const nextMode = mapOldView(s.defaultView);
  if (!cur) {
    mode = nextMode;
  } else if (nextMode !== mode) {
    const can = nextMode === 'main' || (cur && !!cur.vga);
    if (can) switchTab(nextMode);
  }
  if (typeof renderStage === 'function') renderStage();
}

/* ---------- 启动 ---------- */
(async function boot(){
  try { autoNext = localStorage.getItem(LS_AUTONEXT) === '1'; } catch(e){}
  $('#btnAutoNext').classList.toggle('on', autoNext);
  applyRate(getSavedRate());
  if (window.yhktSettings) {
    await window.yhktSettings.init({ toast, onBeforeOpen: closeDrawer, onApply: applyAppSettings });
  }
  if (window.yhktBatch) {
    window.yhktBatch.init({
      toast,
      defaultPlatform: 'all',
      onBeforeOpen: closeDrawer,
      openDownloads: () => {
        if (window.yhktApp && window.yhktApp.openDownloads) window.yhktApp.openDownloads();
        else openWebDownloads();
      },
      promptLogin: w => {
        if (w === 'y2' && APP) { showAppLogin('', true); }
        else showLogin('', true);
      },
      defaultQuery: () => $('#dq').value.trim(),
      getCurrentCourse: () => {
        if (!curCourse || !curCourse.course) return null;
        const c = curCourse.course;
        return {
          platform: 'old',
          id: String(c.id),
          title: c.name || ('课程 ' + c.id),
          teacher: (c.professors || []).join('、'),
          term: c.year ? (c.year + ' 第' + c.semester + '学期') : '',
          sessions: curCourse.sessions || [],
        };
      },
    });
  }
  refreshWebDownloads();
  window.addEventListener('pagehide', () => saveCourseProgress(true));
  window.addEventListener('beforeunload', () => saveCourseProgress(true));
  loadDbTerms();
  fetch('/api/status').then(r => r.json()).then(j => {
    if (j.build) {
      $('#build').textContent = 'build ' + j.build;
      $('#verpill').textContent = 'v' + j.build;
    }
  }).catch(() => {});

  const ht = (location.hash.match(/^#t=(.+)$/) || [])[1];
  if (ht) {
    const token = decodeURIComponent(ht);
    if (/^eyJ/.test(token)) { location.replace('/y2' + location.hash); return; }
    history.replaceState(null, '', location.pathname + location.search);
    await loginWithToken(token);
    if (me) return;
  }

  try {
    const j = await (await fetch('/api/status')).json();
    if (j.loggedIn) {
      signedIn(j.user);
    } else {
      renderHist();
      if (!APP || (DESKTOP_APP && !sessionStorage.getItem('yhkt_manual_logout'))) {
        const ok = await autoLogin({ silent: true });
        if (!ok) showLogin(ht ? 'token 无效或已过期，请重新点一次书签' : '');
      } else {
        showLogin('');
      }
    }
  } catch (e) {
    showLogin('无法连接本地服务：' + e.message);
  }

  const sp = new URLSearchParams(location.search);
  if (sp.get('src') === 'live') {
    setSrcMode('live');
  } else if (sp.get('course')) {
    if (me) openCourse(sp.get('course'));
  } else if (sp.get('s')) {
    $('#dq').value = sp.get('s');
    syncClearBtn();
    await loadDbTerms();
    dbSearch();
  }
})();
</script>
</body>
