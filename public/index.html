<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<title>延河课堂 · 在线播放器</title>
<link rel="icon" type="image/png" href="/icon.png">
<style>
  :root{
    --bg:#0b0d12; --panel:#12161f; --panel2:#181e2a; --panel3:#202737;
    --line:rgba(255,255,255,.08); --line-hi:rgba(91,156,255,.42);
    --fg:#eef2f7; --dim:#8f99ac; --muted:#5c6678;
    --accent:#5b9cff; --accent2:#7c8cff; --ok:#34d399; --warn:#fbbf24; --err:#f87171;
    --shadow:0 14px 40px rgba(0,0,0,.45);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
    font:14px/1.5 -apple-system,"Segoe UI",system-ui,"PingFang SC","Microsoft YaHei",sans-serif}
  ::-webkit-scrollbar{width:6px;height:6px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:99px}
  ::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.24)}

  .wrap{display:grid;grid-template-columns:324px 1fr;height:100vh;height:100dvh;overflow:hidden}

  /* 侧边栏 */
  aside{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
  .brand{padding:14px 14px 11px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,rgba(91,156,255,.06),transparent)}
  .brandhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
  .brand h1{margin:0;font-size:13.5px;font-weight:700;letter-spacing:.2px;color:var(--fg);display:flex;align-items:center;gap:7px}
  .brand h1 .dot{width:7px;height:7px;border-radius:50%;background:var(--muted);flex:none;transition:all .2s}
  .brand h1 .dot.ok{background:var(--ok);box-shadow:0 0 10px rgba(52,211,153,.75)}
  .verpill{font-size:10.5px;color:var(--dim);background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:1px 7px}

  .srcsw{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:3px;background:var(--bg);border:1px solid var(--line);border-radius:9px;margin-bottom:9px}
  .srcsw button{padding:5px 0;font-size:12.5px;font-weight:600;border-radius:6px;border:none;background:transparent;color:var(--dim);cursor:pointer;transition:all .15s}
  .srcsw button:hover{color:var(--fg)}
  .srcsw button.on{background:linear-gradient(135deg,var(--accent),#4384ec);color:#051020;box-shadow:0 2px 10px rgba(91,156,255,.25)}

  .finder{display:flex;gap:6px;align-items:center}
  .finder + .finder{margin-top:7px}
  .inpbox{position:relative;flex:1;min-width:0;display:flex;align-items:center}
  .inpbox svg.ico{position:absolute;left:10px;width:14px;height:14px;color:var(--muted);pointer-events:none}
  .inpbox input{width:100%;min-width:0;background:var(--panel2);border:1px solid var(--line);color:var(--fg);
    border-radius:8px;padding:7.5px 28px 7.5px 30px;font-size:13px;outline:none;transition:border-color .15s,box-shadow .15s}
  .inpbox input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(91,156,255,.14)}
  .clrbtn{position:absolute;right:5px;width:20px;height:20px;border-radius:50%;border:none;background:transparent;
    color:var(--muted);cursor:pointer;display:none;align-items:center;justify-content:center;font-size:13px;line-height:1;padding:0}
  .clrbtn.show{display:flex}
  .clrbtn:hover{background:rgba(255,255,255,.1);color:var(--fg)}
  .finder button.sbtn{background:var(--panel3);border:1px solid var(--line);color:var(--fg);font-weight:600;border-radius:8px;
    padding:7.5px 12px;cursor:pointer;font-size:12.5px;flex:none;transition:all .15s}
  .finder button.sbtn:hover{border-color:var(--line-hi);background:#252e41}
  .finder select{flex:1;min-width:0;background:var(--panel2);border:1px solid var(--line);color:var(--fg);
    border-radius:8px;padding:6.5px 10px;font-size:12px;outline:none;cursor:pointer}
  .finder select:focus{border-color:var(--accent)}

  .userline{padding:8px 14px;font-size:11.5px;color:var(--dim);border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:7px;flex-wrap:wrap;background:rgba(255,255,255,.015)}
  .userline .who{flex:1;min-width:80px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--fg);font-weight:500}
  .userline a{color:var(--dim);cursor:pointer;text-decoration:none;flex:none;padding:2px 6px;border-radius:6px;transition:all .15s}
  .userline a:hover{color:var(--fg);background:rgba(255,255,255,.06)}
  .userline a#btnLogout:hover{color:var(--err)}
  .userline a#btnY2{color:#9cc2ff;background:rgba(91,156,255,.11);border:1px solid rgba(91,156,255,.26);font-weight:600}
  .userline a#btnY2:hover{background:rgba(91,156,255,.2);color:#cce0ff}
  .sb-tools{padding:8px 14px;display:grid;grid-template-columns:1fr 1fr;gap:8px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.02)}
  .toolbtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:7.5px 10px;border-radius:9px;
    font-size:13px;font-weight:700;text-decoration:none;cursor:pointer;transition:all .15s;white-space:nowrap}
  .dlentry{border:1px solid rgba(91,156,255,.38);background:rgba(28,45,76,.78);color:#bfe0ff}
  .dlentry:hover{background:rgba(41,66,112,.94);border-color:rgba(91,156,255,.65);color:#fff}
  .dlentry.busy{border-color:rgba(52,211,153,.55);color:var(--ok);background:rgba(18,44,32,.85)}
  .dlentry.warn{border-color:rgba(251,191,36,.5);color:#fde68a;background:rgba(56,42,16,.75)}
  .batchentry{grid-column:1 / -1;border:1px solid rgba(52,211,153,.38);background:rgba(16,44,34,.75);color:#9bf2cd}
  .batchentry:hover{background:rgba(22,60,46,.92);border-color:rgba(52,211,153,.65);color:#fff}
  .setentry{border:1px solid rgba(255,255,255,.18);background:var(--panel2);color:var(--fg)}
  .setentry:hover{border-color:rgba(91,156,255,.5);background:var(--panel3);color:#fff}
  .audsel{max-width:165px;text-overflow:ellipsis}

  .list{overflow:auto;padding:8px 9px 14px;flex:1}
  .dbmeta{font-size:11px;color:var(--dim);padding:4px 5px 8px;line-height:1.55}
  .listnote{padding:7px 9px;font-size:11.5px;color:var(--dim);line-height:1.6;background:rgba(255,255,255,.025);border:1px solid var(--line);border-radius:8px;margin-bottom:6px}
  .listnote a{color:var(--accent);cursor:pointer;text-decoration:underline}

  .backrow{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:8px;padding:8px 11px;margin:0 0 8px;
    background:rgba(20,31,52,.92);backdrop-filter:blur(10px);border:1px solid rgba(91,156,255,.35);
    border-radius:10px;color:#b8d7ff;font-size:12.5px;cursor:pointer;box-shadow:0 6px 16px rgba(0,0,0,.35)}
  .backrow:hover{background:rgba(26,41,68,.98)}
  .backrow .bk{font-weight:600;white-space:nowrap}
  .backrow b{margin-left:auto;font-weight:500;color:#dbe7f7;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}

  .item{position:relative;padding:9px 11px;border-radius:10px;cursor:pointer;border:1px solid transparent;margin-bottom:4px;
    background:rgba(255,255,255,.018);transition:background .14s,border-color .14s,transform .12s;overflow:hidden}
  .item:hover{background:var(--panel2);border-color:var(--line)}
  .item.on{background:linear-gradient(135deg,rgba(91,156,255,.16),rgba(124,140,255,.08));border-color:rgba(91,156,255,.5)}
  .item.on::before{content:"";position:absolute;left:0;top:7px;bottom:7px;width:3px;border-radius:0 3px 3px 0;background:var(--accent)}
  .item.dead{opacity:.42;cursor:default;background:transparent}
  .item.dead:hover{background:transparent;border-color:transparent}
  .item .d{font-size:13px;font-weight:600;display:flex;gap:6px;align-items:baseline;flex-wrap:wrap;line-height:1.45}
  .item .d .w{font-size:10.5px;font-weight:600;color:#9cc2ff;background:rgba(91,156,255,.14);padding:1px 6px;border-radius:5px;flex:none}
  .item .d .t{font-weight:500;color:var(--dim);font-size:12px}
  .item .m{font-size:11px;color:var(--dim);margin-top:4px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .pill{font-size:10.5px;padding:1px 6px;border-radius:5px;background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--dim)}
  .pill.ok{color:#8be9be;border-color:rgba(52,211,153,.32);background:rgba(52,211,153,.1)}
  .pill.resume{color:#fde68a;border-color:rgba(251,191,36,.32);background:rgba(251,191,36,.1)}
  .pill.warn{color:#fca5a5;border-color:rgba(248,113,113,.3);background:rgba(248,113,113,.08)}
  .progbar{position:absolute;left:0;right:0;bottom:0;height:2.5px;background:rgba(255,255,255,.05)}
  .progbar>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--ok))}

  .histbox{padding:6px 4px}
  .histtitle{font-size:11px;color:var(--muted);margin:4px 4px 8px;display:flex;align-items:center;justify-content:space-between}
  .histtitle a{color:var(--dim);cursor:pointer;font-size:11px}
  .histtitle a:hover{color:var(--fg)}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .qchip{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:999px;background:var(--panel2);
    border:1px solid var(--line);color:var(--fg);font-size:12px;cursor:pointer;transition:all .15s}
  .qchip:hover{border-color:var(--line-hi);background:var(--panel3)}

  .livebadge{font-size:10px;font-weight:700;color:#052014;background:var(--ok);border-radius:4px;padding:1px 6px;flex:none}
  .livebadge.up{background:var(--warn);color:#221504}

  /* 主舞台 */
  main{display:flex;flex-direction:column;min-width:0;min-height:0;background:radial-gradient(ellipse at top,rgba(91,156,255,.06),transparent 58%),var(--bg)}
  .bar{display:flex;align-items:center;gap:8px;padding:9px 16px;border-bottom:1px solid var(--line);background:rgba(18,22,31,.94);backdrop-filter:blur(8px);min-height:52px}
  .bar .who{min-width:0;margin-right:auto;flex:1}
  .bar .who b{font-size:14px;font-weight:700;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bar .who span{display:block;font-size:11.5px;color:var(--dim);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tabs{display:flex;align-items:center;gap:5px;flex:none}
  .tab{padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel2);color:var(--dim);
    cursor:pointer;font-size:12px;font-weight:500;flex:none;transition:all .15s;white-space:nowrap}
  .tab:hover:not(:disabled){color:var(--fg);border-color:rgba(255,255,255,.2)}
  .tab.on{background:var(--accent);border-color:var(--accent);color:#051020;font-weight:700;box-shadow:0 2px 10px rgba(91,156,255,.28)}
  .tab:disabled{opacity:.3;cursor:not-allowed}

  .dualbar{display:none;align-items:center;gap:6px;padding:5px 16px;background:rgba(18,22,31,.8);border-bottom:1px solid var(--line);font-size:11.5px;color:var(--dim);flex-wrap:wrap}
  .dualbar.show{display:flex}
  .chipbtn{padding:3px 9px;border-radius:999px;border:1px solid var(--line);background:var(--panel2);color:var(--dim);
    font-size:11.5px;cursor:pointer;display:inline-flex;align-items:center;gap:4px;transition:all .15s}
  .chipbtn:hover{color:var(--fg);border-color:var(--line-hi)}
  .chipbtn.on{color:#b8d7ff;border-color:rgba(91,156,255,.5);background:rgba(91,156,255,.16)}

  /* 播放器整体壳（全屏时连控制条一起全屏） */
  .playerbox{flex:1;min-height:0;display:flex;flex-direction:column;position:relative;background:#050608}
  .playerbox:fullscreen,.playerbox:-webkit-full-screen{background:#000}
  .stagewrap{flex:1;display:flex;min-height:0;position:relative;overflow:hidden}
  .stage{flex:1;min-height:0;background:#050608;display:grid;gap:2px;position:relative;cursor:pointer}
  .stage.single{grid-template-columns:1fr}
  .stage.dual{grid-template-columns:1fr 1fr}
  .stage.pip{display:block}
  .pane{position:relative;min-height:0;min-width:0;background:#000;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .pane video{width:100%;height:100%;object-fit:contain;background:#000;display:block;pointer-events:none}
  .pane .tag{position:absolute;left:12px;top:10px;font-size:11px;font-weight:600;padding:3px 9px;border-radius:6px;
    background:rgba(10,12,18,.68);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.1);color:#d7e0ee;pointer-events:none;z-index:2}
  .pane.hide{display:none}
  /* 画中画布局 */
  .stage.pip .pane.pip-big{position:absolute;inset:0;width:100%;height:100%;z-index:1}
  .stage.pip .pane.pip-sub{position:absolute;right:14px;bottom:14px;width:min(30%,320px);aspect-ratio:16/9;height:auto;
    z-index:3;border-radius:10px;border:1.5px solid rgba(255,255,255,.28);box-shadow:0 12px 32px rgba(0,0,0,.7);cursor:pointer}
  .stage.pip .pane.pip-sub:hover{border-color:var(--accent)}

  .spin{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:6;display:none;align-items:center;gap:8px;
    background:rgba(14,17,24,.82);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:12px;color:var(--fg);pointer-events:none}
  .spin.on{display:flex}
  .spin i{width:14px;height:14px;border:2px solid rgba(91,156,255,.25);border-top-color:var(--accent);border-radius:50%;animation:sp .75s linear infinite;display:block}
  @keyframes sp{to{transform:rotate(360deg)}}

  .pane .perr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:10px;background:rgba(8,10,15,.88);backdrop-filter:blur(8px);color:var(--fg);padding:20px;text-align:center;font-size:13px;z-index:5;cursor:default}
  .pane .perr b{color:var(--err);font-size:14.5px}
  .pane .perr span{color:var(--dim);font-size:12px;max-width:480px;line-height:1.7}
  .pane .perr button{background:var(--accent);color:#051020;border:none;border-radius:8px;padding:7px 16px;font-weight:700;font-size:12.5px;cursor:pointer}

  /* 全屏时顶部悬浮条 */
  .fshud{display:none;position:absolute;left:0;right:0;top:0;z-index:8;padding:12px 18px;
    background:linear-gradient(180deg,rgba(8,10,15,.85),transparent);align-items:center;gap:10px;transition:opacity .25s}
  .playerbox:fullscreen .fshud,.playerbox:-webkit-full-screen .fshud{display:flex}
  .playerbox.idle .fshud,.playerbox.idle .ctrldeck{opacity:0;pointer-events:none}
  .playerbox:fullscreen .ctrldeck,.playerbox:-webkit-full-screen .ctrldeck{position:absolute;left:0;right:0;bottom:0;z-index:8;
    background:linear-gradient(0deg,rgba(8,10,15,.92) 35%,transparent);border-top:none;padding-top:20px}
  .fshud .fstitle{flex:1;min-width:0;font-size:14px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 4px rgba(0,0,0,.8)}

  /* 统一控制底栏 */
  .ctrldeck{background:var(--panel);border-top:1px solid var(--line);padding:6px 14px 8px;display:flex;flex-direction:column;gap:6px;transition:opacity .25s}
  .scrub{position:relative;height:18px;display:flex;align-items:center;cursor:pointer;touch-action:none;user-select:none}
  .scrubtrack{position:relative;width:100%;height:4px;border-radius:99px;background:rgba(255,255,255,.13);transition:height .12s}
  .scrub:hover .scrubtrack,.scrub.drag .scrubtrack{height:6px}
  .scrubbuf{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:99px;background:rgba(255,255,255,.22)}
  .scrubfill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:99px;background:linear-gradient(90deg,var(--accent),#7eb3ff)}
  .scrubthumb{position:absolute;top:50%;width:13px;height:13px;border-radius:50%;background:#fff;border:2px solid var(--accent);
    transform:translate(-50%,-50%) scale(0);box-shadow:0 2px 8px rgba(0,0,0,.5);transition:transform .12s;left:0}
  .scrub:hover .scrubthumb,.scrub.drag .scrubthumb{transform:translate(-50%,-50%) scale(1)}
  .scrubtip{position:absolute;bottom:22px;transform:translateX(-50%);background:rgba(15,19,28,.95);border:1px solid var(--line);
    color:var(--fg);font-size:11px;font-variant-numeric:tabular-nums;padding:2px 7px;border-radius:5px;pointer-events:none;display:none;white-space:nowrap}
  .scrubtip.show{display:block}

  .ctrl{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .ctrl button,.ctrl select{background:var(--panel2);border:1px solid var(--line);color:var(--fg);border-radius:7px;
    height:30px;padding:0 9px;cursor:pointer;font-size:12px;display:inline-flex;align-items:center;gap:4px;transition:all .14s;flex:none}
  .ctrl button:hover:not(:disabled),.ctrl select:hover{border-color:var(--line-hi);background:var(--panel3)}
  .ctrl button:disabled{opacity:.35;cursor:not-allowed}
  .ctrl button.pri{background:var(--accent);border-color:var(--accent);color:#051020;font-weight:700;padding:0 12px}
  .ctrl button.pri:hover{filter:brightness(1.08);background:var(--accent)}
  .ctrl button.on{border-color:rgba(91,156,255,.55);color:#b8d7ff;background:rgba(91,156,255,.15)}
  .ctrl svg{width:14px;height:14px;flex:none}
  .ctrl .time{font-variant-numeric:tabular-nums;color:var(--dim);font-size:12px;padding:0 4px;flex:none}
  .ctrl .sp{flex:1}
  .volbox{display:inline-flex;align-items:center;gap:5px}
  .volbox input[type=range]{width:68px;accent-color:var(--accent);cursor:pointer}

  .hint{padding:6px 16px;font-size:11.5px;color:var(--muted);border-top:1px solid var(--line);background:var(--panel);display:flex;align-items:center;justify-content:space-between;gap:10px}
  .hint kbd{background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:0 5px;font-size:10.5px;color:var(--dim)}
  .hint a{color:var(--accent);cursor:pointer;text-decoration:none}
  .hint a:hover{text-decoration:underline}

  /* 空白引导页 */
  .splash{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
    color:var(--dim);padding:26px;text-align:center;overflow:auto}
  .splash .big{font-size:16px;font-weight:600;color:var(--fg)}
  .splash .err{color:var(--err)}
  .splash code{background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:2px 6px;font-size:12px;color:#b8d7ff}
  .splash .actrow{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:6px}
  .splash .sbtn2{background:var(--accent);color:#051020;border:none;border-radius:8px;padding:7px 14px;font-weight:700;font-size:12.5px;cursor:pointer}
  .splash .sbtn2.ghost{background:var(--panel2);color:var(--fg);border:1px solid var(--line)}

  .toast{position:fixed;right:18px;top:62px;z-index:60;background:rgba(16,20,29,.94);backdrop-filter:blur(10px);
    border:1px solid var(--line-hi);color:var(--fg);border-radius:10px;padding:8px 13px;font-size:12.5px;
    opacity:0;transform:translateY(-4px);transition:opacity .2s,transform .2s;pointer-events:none;box-shadow:var(--shadow)}
  .toast.on{opacity:1;transform:translateY(0)}

  /* 弹窗（登录 / 下载管理） */
  .lgmodal{position:fixed;inset:0;background:rgba(4,6,10,.72);backdrop-filter:blur(6px);display:none;align-items:center;
    justify-content:center;padding:14px;z-index:45}
  .login{width:min(540px,94vw);max-height:88vh;overflow:auto;text-align:left;background:var(--panel);border:1px solid var(--line);
    border-radius:16px;padding:22px;box-shadow:var(--shadow)}
  .login h2{margin:0 0 4px;font-size:17px;color:var(--fg);display:flex;align-items:center;justify-content:space-between;gap:10px}
  .login .sub{margin:0 0 12px;font-size:12.5px;color:var(--dim)}
  .login .xbtn{background:var(--panel2);border:1px solid var(--line);color:var(--dim);border-radius:8px;width:28px;height:28px;cursor:pointer;font-size:15px}
  .login .xbtn:hover{color:var(--fg)}
  .login textarea{width:100%;height:60px;resize:vertical;background:var(--panel2);border:1px solid var(--line);
    color:var(--fg);border-radius:8px;padding:9px 11px;font:12px/1.5 ui-monospace,Consolas,monospace;outline:none}
  .login textarea:focus{border-color:var(--accent)}
  .login .ghost{background:var(--panel2);border:1px solid var(--line);color:var(--fg);border-radius:8px;
    padding:7px 14px;cursor:pointer;font-size:12.5px;text-decoration:none;display:inline-block}

<script>
const $ = s => document.querySelector(s);
const vids = { main: $('#vMain'), vga: $('#vVga'), aux: $('#vAudioAux') };
const players = { main: null, vga: null, aux: null };
const attachedUrls = { main: '', vga: '', aux: '' };
let mode = 'main', dualPip = false, dualSwapped = false, audioFrom = 'main';
let curCourse = null, cur = null, me = null;
let autoNext = false, pendingResumeSec = 0, lastSaveAt = 0;
let searchSeq = 0, searchAbort = null, listScrollBackup = 0;

const LS_RATE = 'yhkt_rate_v1';
const LS_PROG = 'yhkt_prog_v1';
const LS_HIST = 'yhkt_hist_v1';
const LS_AUTONEXT = 'yhkt_autonext_v1';
const LS_AUDIOPREF = 'yhkt_audiopref_v1';

const b64 = s => btoa(String.fromCharCode(...new TextEncoder().encode(s)))
  .replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const fmt = t => {
  if (!isFinite(t) || t < 0) t = 0;
  const h = Math.floor(t/3600), m = Math.floor(t%3600/60), s = Math.floor(t%60);
  return (h ? String(h).padStart(2,'0')+':' : '') + String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
};
const fmtMB = b => (b / 1048576).toFixed(1) + ' MB';
const mins = d => d ? Math.round(d/60) + ' 分钟' : '—';
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function toast(msg, ms){
  const t = $('#toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove('on'), ms || 2200);
}

/* ---------- 偏好与进度记忆 ---------- */
function getSavedRate(){
  try { const r = Number(localStorage.getItem(LS_RATE)); return (r >= 0.5 && r <= 3) ? r : 1; } catch(e){ return 1; }
}
function applyRate(r){
  const rate = Number(r) || 1;
  $('#rate').value = String(rate);
  vids.main.defaultPlaybackRate = rate;
  vids.vga.defaultPlaybackRate = rate;
  if (vids.aux) {
    vids.aux.defaultPlaybackRate = rate;
    vids.aux.playbackRate = rate;
  }
  vids.main.playbackRate = rate;
  vids.vga.playbackRate = rate;
  try { localStorage.setItem(LS_RATE, String(rate)); } catch(e){}
}
function loadProgMap(){
  try { return JSON.parse(localStorage.getItem(LS_PROG) || '{}') || {}; } catch(e){ return {}; }
}
function saveProgMap(m){
  try {
    const keys = Object.keys(m);
    if (keys.length > 80) {
      keys.sort((a,b) => (m[a].at||0) - (m[b].at||0)).slice(0, keys.length - 80).forEach(k => delete m[k]);
    }
    localStorage.setItem(LS_PROG, JSON.stringify(m));
  } catch(e){}
}
let suppressProgressSave = false;
let pendingSeekGuard = 0;

function updateSidebarItemProg(sid, t, dur){
  if (!sid || !dur || dur <= 0) return;
  const el = document.querySelector(`.item[data-id="${CSS.escape(String(sid))}"]`);
  if (!el) return;
  const pct = Math.min(100, Math.round(t / dur * 100));
  let bar = el.querySelector('.progbar');
  if (pct <= 0) return;
  if (!bar) {
    bar = document.createElement('div');
    bar.className = 'progbar';
    bar.innerHTML = '<i></i>';
    el.appendChild(bar);
  }
  const inner = bar.querySelector('i');
  if (inner) inner.style.width = pct + '%';
}

function saveCourseProgress(force){
  if (suppressProgressSave || window.__yhktRememberPos === false) return;
  if (srcMode !== 'record' || !curCourse || !curCourse.course || !cur) return;
  const now = performance.now();
  if (!force && now - lastSaveAt < 3500) return;
  const v = activeVideo();
  const t = v.currentTime || 0;
  const dur = (isFinite(v.duration) && v.duration > 0 ? v.duration : 0) || Number(cur.duration) || 0;
  if (pendingSeekGuard > 0) {
    if (Math.abs(t - pendingSeekGuard) <= 6) {
      pendingSeekGuard = 0;
    } else if (t < Math.max(3, pendingSeekGuard - 6)) {
      return; // 尚未完成断点跳转前禁止用 0 秒覆盖已有进度
    }
  }
  if (t < 3 && !force) return;
  lastSaveAt = now;
  const cid = String(curCourse.course.id);
  const sid = String(cur.id);
  const m = loadProgMap();
  const c = m[cid] || { sessions: {} };
  const prev = c.sessions && c.sessions[sid];
  if (force && t < 3 && prev && prev.t > 5) return;
  c.lastSid = sid;
  c.at = Date.now();
  c.sessions = c.sessions || {};
  c.sessions[sid] = { t: Math.floor(t), d: Math.floor(dur), at: Date.now() };
  m[cid] = c;
  saveProgMap(m);
  updateSidebarItemProg(sid, t, dur);
}
function getSessionProg(cid, sid){
  if (window.__yhktRememberPos === false) return null;
  const m = loadProgMap();
  const c = m[String(cid)];
  return c && c.sessions ? c.sessions[String(sid)] : null;
}

/* ---------- 播放器与多音源 ---------- */
function destroy(k){
  attachedUrls[k] = '';
  if (players[k]) { try { players[k].destroy(); } catch(e){} players[k] = null; }
  if (vids[k]) {
    vids[k].removeAttribute('src');
    try { vids[k].load(); } catch(e){}
  }
  clearErr(k);
}
function clearErr(key){
  if (key === 'aux') return;
  const pane = key === 'main' ? $('#paneMain') : $('#paneVga');
  const el = pane && pane.querySelector('.perr');
  if (el) el.remove();
}
function showErr(key, title, detail, retryFn){
  if (key === 'aux') return;
  const pane = key === 'main' ? $('#paneMain') : $('#paneVga');
  if (!pane) return;
  clearErr(key);
  const d = document.createElement('div');
  d.className = 'perr';
  d.innerHTML = `<b>${esc(title)}</b><span>${esc(detail)}</span>`;
  if (retryFn) {
    const btn = document.createElement('button');
    btn.type = 'button'; btn.textContent = '重试加载';
    btn.onclick = e => { e.stopPropagation(); clearErr(key); retryFn(); };
    d.appendChild(btn);
  }
  pane.appendChild(d);
}

const toLocal = s => (s ? '/p?u=' + b64(s) : null);

function attach(k, url, seekTo, opts){
  const isLive = !!(opts && opts.live) || srcMode === 'live';
  const force = !!(opts && opts.force);
  if (!url) { destroy(k); return; }
  if (!force && attachedUrls[k] === url && (players[k] || vids[k].getAttribute('src'))) {
    clearErr(k);
    return;
  }
  destroy(k);
  attachedUrls[k] = url;
  const v = vids[k];
  clearErr(k);
  const rate = getSavedRate();
  v.defaultPlaybackRate = rate;
  v.playbackRate = rate;

  let needSeek = (!isLive && seekTo && seekTo > 1) ? Number(seekTo) : 0;
  const tryApplySeek = () => {
    v.playbackRate = getSavedRate();
    if (!needSeek) {
      if (k === 'main' || mode === 'vga') suppressProgressSave = false;
      return;
    }
    if (isFinite(v.duration) && v.duration > 0 && needSeek >= v.duration - 2) {
      needSeek = 0; pendingSeekGuard = 0;
      if (k === 'main' || mode === 'vga') suppressProgressSave = false;
      return;
    }
    if (Math.abs((v.currentTime || 0) - needSeek) <= 2.5) {
      needSeek = 0; pendingSeekGuard = 0;
      if (k === 'main' || mode === 'vga') suppressProgressSave = false;
      return;
    }
    try { v.currentTime = needSeek; } catch(e){}
  };

  if (needSeek) {
    v.addEventListener('loadedmetadata', tryApplySeek);
    v.addEventListener('loadeddata', tryApplySeek);
    v.addEventListener('canplay', tryApplySeek);
    const onSeeked = () => {
      if (needSeek && Math.abs((v.currentTime || 0) - needSeek) <= 3) {
        needSeek = 0;
        pendingSeekGuard = 0;
        if (k === 'main' || mode === 'vga') suppressProgressSave = false;
        v.removeEventListener('seeked', onSeeked);
      }
    };
    v.addEventListener('seeked', onSeeked);
    setTimeout(() => {
      needSeek = 0;
      pendingSeekGuard = 0;
      if (k === 'main' || mode === 'vga') suppressProgressSave = false;
    }, 3500);
  } else {
    if (k === 'main' || mode === 'vga') suppressProgressSave = false;
  }

  const autoPlay = !opts || opts.autoPlay !== false;
  const onReady = () => {
    tryApplySeek();
    if (autoPlay && k !== 'aux') v.play().catch(()=>{});
  };

  const isHLSUrl = /\.m3u8(\?|$)/i.test(url) || url.indexOf('/p?u=') === 0 || url.indexOf('/lp?u=') === 0;
  if (isHLSUrl && window.Hls && Hls.isSupported()) {
    const hCfg = {
      maxBufferLength: isLive ? 18 : 36,
      maxMaxBufferLength: isLive ? 36 : 90,
      fragLoadingTimeOut: 15000,
      manifestLoadingTimeOut: 10000,
      levelLoadingTimeOut: 10000,
      fragLoadingMaxRetry: 6,
      fragLoadingRetryDelay: 300,
      manifestLoadingMaxRetry: 4,
      levelLoadingMaxRetry: 4,
      startFragPrefetch: true,
      startLevel: -1,
      startPosition: needSeek ? needSeek : -1,
      abortLoadingOnSeek: true,
    };
    if (isLive) {
      hCfg.liveSyncDurationCount = 3;
      hCfg.liveMaxLatencyDurationCount = 10;
      hCfg.backBufferLength = 25;
    }
    const h = new Hls(hCfg);
    h.on(Hls.Events.MANIFEST_PARSED, () => { clearErr(k); onReady(); populateAudioSelect(); });
    h.on(Hls.Events.AUDIO_TRACKS_UPDATED, () => { populateAudioSelect(); });
    h.on(Hls.Events.ERROR, (_, d) => {
      if (!d.fatal) return;
      const code = d.response && d.response.code;
      const retry = () => attach(k, url, v.currentTime || seekTo || 0, { live: isLive, force: true, autoPlay: true });
      if (d.type === Hls.ErrorTypes.NETWORK_ERROR) {
        showErr(k, '取不到视频流' + (code ? `（HTTP ${code}）` : ''),
          '本地代理未能从学校视频服务器拿到数据（可能 CDN 限流、校园网波动或登录已过期）。', retry);
      } else {
        showErr(k, '播放出错', '解码或分片异常：' + (d.details || '未知'), retry);
      }
    });
    h.loadSource(url); h.attachMedia(v); players[k] = h;
  } else if (!isHLSUrl || v.canPlayType('application/vnd.apple.mpegurl')) {
    v.src = url;
    onReady();
    v.onerror = () => showErr(k, '取不到视频流', '浏览器无法加载该流，请稍后重试。', () => attach(k, url, v.currentTime || 0, { live: isLive, force: true, autoPlay: true }));
  } else {
    showErr(k, '浏览器不支持 HLS 播放', '请使用较新的 Chrome 或 Edge。');
  }
}

let audioPrefByView = {};
try { audioPrefByView = JSON.parse(localStorage.getItem(LS_AUDIOPREF) || '{}') || {}; } catch(e){}
let activeAudioKey = 'stream:main';
let auxAudioActive = false;

function getAvailableAudioSources(){
  const srcs = [];
  if (srcMode === 'live' && liveCur) {
    if (liveCur.main) srcs.push({ key: 'stream:main', kind: 'main', label: '全景声音', url: liveUrl(liveCur.main) });
    if (liveCur.vga) srcs.push({ key: 'stream:vga', kind: 'vga', label: '课件声音', url: liveUrl(liveCur.vga) });
    if (liveCur.roomCam) srcs.push({ key: 'stream:room', kind: 'room', label: '教室声音', url: liveUrl(liveCur.roomCam) });
    if (liveCur.audio) srcs.push({ key: 'ext:0', kind: 'ext', label: '独立音频', url: liveUrl(liveCur.audio) });
  } else if (srcMode === 'record' && cur) {
    if (cur.main) srcs.push({ key: 'stream:main', kind: 'main', label: '全景声音', url: toLocal(cur.main) });
    if (cur.vga) srcs.push({ key: 'stream:vga', kind: 'vga', label: '课件声音', url: toLocal(cur.vga) });
    if (cur.roomCam) srcs.push({ key: 'stream:room', kind: 'room', label: '教室声音', url: toLocal(cur.roomCam) });
    if (Array.isArray(cur.audios)) {
      cur.audios.forEach((a, i) => {
        if (a && a.url) srcs.push({ key: 'ext:' + i, kind: 'ext', label: a.label || ('独立音频 ' + (i + 1)), url: toLocal(a.url) });
      });
    }
  }
  const activePl = players[mode === 'vga' ? 'vga' : 'main'];
  if (activePl && Array.isArray(activePl.audioTracks) && activePl.audioTracks.length > 1) {
    activePl.audioTracks.forEach((tr, idx) => {
      const nm = (tr && (tr.name || tr.lang)) || ('音轨 ' + (idx + 1));
      srcs.push({ key: 'hlstrack:' + idx, kind: 'hlstrack', label: '内嵌·' + nm, trackId: idx });
    });
  }
  return srcs;
}

function defaultAudioKeyForView(srcs){
  const pref = audioPrefByView[mode];
  if (pref && srcs.some(s => s.key === pref)) return pref;
  const viewKey = 'stream:' + (mode === 'dual' ? 'main' : mode);
  if (srcs.some(s => s.key === viewKey)) return viewKey;
  return (srcs[0] && srcs[0].key) || 'stream:main';
}

function populateAudioSelect(){
  const sel = $('#audioSrc');
  if (!sel) return;
  const srcs = getAvailableAudioSources();
  if (!srcs.length) {
    sel.style.display = 'none';
    return;
  }
  if (!srcs.some(s => s.key === activeAudioKey)) {
    activeAudioKey = defaultAudioKeyForView(srcs);
  }
  sel.innerHTML = '';
  for (const s of srcs) {
    const o = document.createElement('option');
    o.value = s.key;
    o.textContent = '🔊 ' + s.label;
    sel.appendChild(o);
  }
  sel.value = activeAudioKey;
  sel.style.display = '';
  applyAudioSelection();
}

function setAudioSourceKey(key){
  activeAudioKey = key;
  audioPrefByView[mode] = key;
  try { localStorage.setItem(LS_AUDIOPREF, JSON.stringify(audioPrefByView)); } catch(e){}
  if (key === 'stream:vga') audioFrom = 'vga';
  else if (key === 'stream:main') audioFrom = 'main';
  const sel = $('#audioSrc');
  if (sel && sel.value !== key) sel.value = key;
  $('#btnAudioSrc').textContent = '声音：' + (audioFrom === 'vga' ? '课件' : '全景');
  applyAudioSelection();
}

function applyAudioSelection(){
  const srcs = getAvailableAudioSources();
  const chosen = srcs.find(s => s.key === activeAudioKey) || srcs[0];
  if (!chosen) {
    auxAudioActive = false;
    destroy('aux');
    updateAudioMute();
    return;
  }
  const activeKey = activeVideo() === vids.vga ? 'vga' : 'main';
  const mainMatches = (mode === 'dual' || mode === 'main') && chosen.key === 'stream:main';
  const vgaMatches = (mode === 'dual' || mode === 'vga') && chosen.key === 'stream:vga';
  const roomMatches = mode === 'room' && chosen.key === 'stream:room';

  if (chosen.kind === 'hlstrack') {
    auxAudioActive = false;
    destroy('aux');
    const pl = players[activeKey];
    if (pl && pl.audioTrack !== chosen.trackId) {
      try { pl.audioTrack = chosen.trackId; } catch(e){}
    }
    vids.main.muted = isMuted || activeKey !== 'main';
    vids.vga.muted = isMuted || activeKey !== 'vga';
  } else if (mainMatches || vgaMatches || roomMatches) {
    auxAudioActive = false;
    destroy('aux');
    const useVga = vgaMatches;
    vids.main.muted = isMuted || useVga;
    vids.vga.muted = isMuted || !useVga;
  } else if (chosen.url) {
    vids.main.muted = true;
    vids.vga.muted = true;
    auxAudioActive = true;
    const mv = activeVideo();
    const t = mv && isFinite(mv.currentTime) ? mv.currentTime : 0;
    const isLive = srcMode === 'live';
    const vol = Number($('#vol') && $('#vol').value || 1);
    vids.aux.volume = vol;
    vids.aux.muted = isMuted;
    attach('aux', chosen.url, isLive ? 0 : t, { live: isLive, autoPlay: mv ? !mv.paused : true });
    if (!isLive && mv && isFinite(mv.currentTime) && Math.abs((vids.aux.currentTime || 0) - mv.currentTime) > 0.6) {
      try { vids.aux.currentTime = mv.currentTime; } catch(e){}
    }
    if (mv && !mv.paused) vids.aux.play().catch(()=>{});
  }
  if (chosen.key === 'stream:vga') audioFrom = 'vga';
  else if (chosen.key === 'stream:main') audioFrom = 'main';
  $('#btnAudioSrc').textContent = '声音：' + (chosen.label || '全景');
  syncTickState();
}

function updateAudioMute(){
  const srcs = getAvailableAudioSources();
  const chosen = srcs.find(s => s.key === activeAudioKey);
  if (auxAudioActive && vids.aux) {
    vids.main.muted = true;
    vids.vga.muted = true;
    vids.aux.muted = isMuted;
    return;
  }
  if (mode === 'dual') {
    const useVga = chosen ? chosen.key === 'stream:vga' : audioFrom === 'vga';
    vids.main.muted = isMuted || useVga;
    vids.vga.muted = isMuted || !useVga;
  } else if (mode === 'vga') {
    vids.main.muted = true;
    vids.vga.muted = isMuted;
  } else {
    vids.main.muted = isMuted;
    vids.vga.muted = true;
  }
}

function renderStage(){
  const st = $('#stage');
  if (mode === 'dual') {
    st.className = dualPip ? 'stage pip' : 'stage dual';
  } else {
    st.className = 'stage single';
  }
  const pm = $('#paneMain'), pv = $('#paneVga');
  pm.classList.toggle('hide', mode === 'vga');
  pv.classList.toggle('hide', !(mode === 'vga' || mode === 'dual'));
  pm.classList.remove('pip-big', 'pip-sub');
  pv.classList.remove('pip-big', 'pip-sub');
  if (mode === 'dual' && dualPip) {
    if (dualSwapped) { pv.classList.add('pip-big'); pm.classList.add('pip-sub'); }
    else { pm.classList.add('pip-big'); pv.classList.add('pip-sub'); }
  }

  $('#dualbar').classList.toggle('show', mode === 'dual');
  $('#btnLayout').textContent = dualPip ? '画中画' : '并排双屏';
  $('#btnLayout').classList.toggle('on', true);
  $('#btnSwap').style.display = dualPip ? '' : 'none';

  const srcs = getAvailableAudioSources();
  if (srcs.length) {
    const pref = audioPrefByView[mode];
    if (pref && srcs.some(s => s.key === pref)) activeAudioKey = pref;
    else {
      const defK = defaultAudioKeyForView(srcs);
      if (!srcs.some(s => s.key === activeAudioKey)) activeAudioKey = defK;
      else if (mode !== 'dual') activeAudioKey = defK;
    }
    populateAudioSelect();
  } else {
    updateAudioMute();
  }
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.mode === mode));
  syncTickState();
}

function ensureStreamsForMode(){
  if (srcMode !== 'record' || !cur) return;
  const wantTime = (vids.main.currentTime || vids.vga.currentTime || pendingResumeSec || 0);
  if (mode !== 'vga' && cur.main && !players.main && !vids.main.getAttribute('src')) {
    attach('main', toLocal(cur.main), wantTime, { autoPlay: true });
  }
  if ((mode === 'vga' || mode === 'dual') && cur.vga && !players.vga && !vids.vga.getAttribute('src')) {
    attach('vga', toLocal(cur.vga), wantTime, { autoPlay: true });
  }
  if (mode === 'vga' && !vids.vga.paused) return;
  if (mode === 'main' && !vids.main.paused) return;
  if (mode === 'dual') {
    const t = vids.main.currentTime || 0;
    try { if (Math.abs((vids.vga.currentTime || 0) - t) > 0.5) vids.vga.currentTime = t; } catch(e){}
    if (!vids.main.paused) vids.vga.play().catch(()=>{});
  } else if (mode === 'vga') {
    if (!vids.main.paused) {
      vids.main.pause();
      if (wantTime > 1) try { vids.vga.currentTime = wantTime; } catch(e){}
      vids.vga.play().catch(()=>{});
    }
  } else if (mode === 'main') {
    if (!vids.vga.paused) {
      const vt = vids.vga.currentTime || 0;
      vids.vga.pause();
      if (vt > 1) try { vids.main.currentTime = vt; } catch(e){}
      vids.main.play().catch(()=>{});
    }
  }
}

function activeVideo(){
  return (mode === 'vga' && ((srcMode === 'record' && cur && cur.vga) || (srcMode === 'live' && liveCur))) ? vids.vga : vids.main;
}

function loadSession(s, { noResume = false } = {}){
  saveCourseProgress(true);
  suppressProgressSave = true;
  cur = s;
  $('#splash').style.display = 'none';
  $('#stage').style.display = '';
  $('#tagMain').textContent = '全景（讲台 / 投影）';
  $('#tagVga').textContent = '课件（屏幕）';
  document.querySelectorAll('.item').forEach(el => el.classList.toggle('on', String(el.dataset.id) === String(s.id)));

  const cid = curCourse && curCourse.course ? curCourse.course.id : '';
  const saved = (!noResume && cid) ? getSessionProg(cid, s.id) : null;
  let resumeAt = 0;
  if (saved && saved.t > 5 && (!saved.d || saved.t < saved.d - 15)) {
    resumeAt = saved.t;
  }
  pendingResumeSec = resumeAt;
  pendingSeekGuard = resumeAt;

  const hasVga = !!s.vga;
  document.querySelectorAll('.tab').forEach(b => { if (b.dataset.mode !== 'main') b.disabled = !hasVga; });
  if (mode !== 'main' && !hasVga) mode = 'main';

  // 先清理旧流（此时 suppressProgressSave=true，不会用 0 秒覆盖新节次进度）
  destroy('main'); destroy('vga'); destroy('aux');
  auxAudioActive = false;
  if (mode === 'vga' && s.vga) {
    attach('vga', toLocal(s.vga), resumeAt, { autoPlay: true });
  } else {
    if (s.main) attach('main', toLocal(s.main), resumeAt, { autoPlay: true });
    if (mode === 'dual' && s.vga) attach('vga', toLocal(s.vga), resumeAt, { autoPlay: true });
  }
  renderStage();
  updateNavButtons();
  $('#fsTitle').textContent = ($('#cname').textContent || '') + (s.title ? ' · ' + s.title : '');
  markLoad('起播');
  if (resumeAt > 0) toast('已从 ' + fmt(resumeAt) + ' 续播', 2600);
}

let tickId = 0;
function syncTickState(){
  const need = ((mode === 'dual' || auxAudioActive) && $('#stage').style.display !== 'none');
  if (need && !tickId) { tickId = requestAnimationFrame(tick); }
  if (!need && tickId) { cancelAnimationFrame(tickId); tickId = 0; }
}
function tick(){
  tickId = 0;
  if ((mode !== 'dual' && !auxAudioActive) || $('#stage').style.display === 'none') return;
  const master = activeVideo();
  if (mode === 'dual' && vids.vga.readyState >= 2 && vids.main.readyState >= 2) {
    if (srcMode === 'record' && Math.abs(vids.main.currentTime - vids.vga.currentTime) > 0.65) {
      try { vids.vga.currentTime = vids.main.currentTime; } catch(e){}
    }
    if (vids.main.paused !== vids.vga.paused) {
      vids.main.paused ? vids.vga.pause() : vids.vga.play().catch(()=>{});
    }
  }
  if (auxAudioActive && vids.aux && vids.aux.readyState >= 2 && master && master.readyState >= 2) {
    if (srcMode === 'record' && Math.abs((master.currentTime || 0) - (vids.aux.currentTime || 0)) > 0.4) {
      try { vids.aux.currentTime = master.currentTime; } catch(e){}
    }
    if (master.paused !== vids.aux.paused) {
      master.paused ? vids.aux.pause() : vids.aux.play().catch(()=>{});
    }
  }
  tickId = requestAnimationFrame(tick);
}

function splash(html){
  $('#stage').style.display = 'none';
  $('#spin').classList.remove('on');
  const sp = $('#splash'); sp.style.display = ''; sp.innerHTML = html;
  syncTickState();
}

function splashEmpty(title, data){
  let body;
  const st = (data && data.stats) || {};
  if (st.total > 0 && st.unresolved > 0) {
    body = '这门课有录像记录，但播放地址没取到 —— 多半是登录过期了。<div class="actrow"><button class="sbtn2" id="goLogin">重新登录</button></div>';
  } else if (st.total > 0) {
    body = '这门课排了 ' + st.total + ' 次课，但平台上一个可播放的录像都没有（没生成回放、或只有直播）。';
  } else {
    body = '后端返回的节次列表为空：可能还没排课，或者你的账号没有这门课的权限。';
  }
  splash('<div class="big">' + esc(title) + '</div><div>' + body + '</div>');
  const a = document.querySelector('#goLogin');
  if (a) a.onclick = () => showLogin('', true);
}

/* ---------- 自定义进度条 / 播放控件 ---------- */
let isMuted = false, dragging = false;
function updatePlayUI(){
  const v = activeVideo();
  const paused = v.paused;
  $('#icoPlay').style.display = paused ? '' : 'none';
  $('#icoPause').style.display = paused ? 'none' : '';
  $('#playTxt').textContent = paused ? '播放' : '暂停';
  updateProgressUI();
}
function updateProgressUI(){
  if (dragging) return;
  const v = activeVideo();
  const dur = isFinite(v.duration) && v.duration > 0 ? v.duration : (cur && Number(cur.duration)) || 0;
  const curT = v.currentTime || 0;
  $('#timeTxt').textContent = fmt(curT) + ' / ' + (dur > 0 ? fmt(dur) : '--:--');
  const pct = dur > 0 ? Math.min(100, Math.max(0, curT / dur * 100)) : 0;
  $('#scrubFill').style.width = pct + '%';
  $('#scrubThumb').style.left = pct + '%';
  let bufPct = 0;
  try {
    if (dur > 0 && v.buffered && v.buffered.length) {
      bufPct = Math.min(100, v.buffered.end(v.buffered.length - 1) / dur * 100);
    }
  } catch(e){}
  $('#scrubBuf').style.width = bufPct + '%';
}
function seekToFraction(frac){
  const v = activeVideo();
  const dur = v.duration;
  if (!isFinite(dur) || dur <= 0) return;
  pendingSeekGuard = 0; suppressProgressSave = false;
  const target = Math.max(0, Math.min(dur, frac * dur));
  v.currentTime = target;
  if (mode === 'dual') {
    vids.main.currentTime = target;
    try { vids.vga.currentTime = target; } catch(e){}
  }
  if (auxAudioActive && vids.aux) {
    try { vids.aux.currentTime = target; } catch(e){}
  }
  updateProgressUI();
}
(() => {
  const sc = $('#scrub'), tip = $('#scrubTip');
  const fracOf = ev => {
    const r = sc.getBoundingClientRect();
    return Math.max(0, Math.min(1, (ev.clientX - r.left) / Math.max(1, r.width)));
  };
  const showTip = ev => {
    const v = activeVideo();
    if (!isFinite(v.duration) || v.duration <= 0) return;
    const f = fracOf(ev);
    tip.textContent = fmt(f * v.duration);
    tip.style.left = (f * 100) + '%';
    tip.classList.add('show');
  };
  sc.addEventListener('pointerdown', ev => {
    const v = activeVideo();
    if (!isFinite(v.duration) || v.duration <= 0) return;
    dragging = true;
    sc.classList.add('drag');
    sc.setPointerCapture(ev.pointerId);
    const f = fracOf(ev);
    $('#scrubFill').style.width = (f * 100) + '%';
    $('#scrubThumb').style.left = (f * 100) + '%';
    showTip(ev);
  });
  sc.addEventListener('pointermove', ev => {
    showTip(ev);
    if (!dragging) return;
    const f = fracOf(ev);
    $('#scrubFill').style.width = (f * 100) + '%';
    $('#scrubThumb').style.left = (f * 100) + '%';
  });
  sc.addEventListener('pointerup', ev => {
    if (!dragging) return;
    dragging = false;
    sc.classList.remove('drag');
    tip.classList.remove('show');
    seekToFraction(fracOf(ev));
  });
  sc.addEventListener('pointerleave', () => { if (!dragging) tip.classList.remove('show'); });
})();

function adjacentSession(dir){
  if (!curCourse || !curCourse.sessions || !cur) return null;
  // sessions 默认按时间倒序（最新在前），"下一讲"指时间更晚或列表下一条？按学习习惯：列表按时间顺序往下一节（dir=+1 为下一条，dir=-1 为上一条）
  const playable = curCourse.sessions.filter(s => s.main || s.vga);
  const idx = playable.findIndex(s => String(s.id) === String(cur.id));
  if (idx < 0) return null;
  const ni = idx + dir;
  return (ni >= 0 && ni < playable.length) ? playable[ni] : null;
}

let hudWokeFromIdle = false, lastStageTouchMs = 0, lastStageTap = null, stageTapTimer = 0, stageTouchPt = null;
$('#playerBox').addEventListener('touchstart', e => {
  if (e.touches && e.touches.length === 1) stageTouchPt = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  else stageTouchPt = null;
  if ($('#playerBox').classList.contains('idle') && e.target.closest('#stage')
      && !e.target.closest('.ctrldeck') && !e.target.closest('.fshud')) {
    hudWokeFromIdle = true;
    setTimeout(() => { hudWokeFromIdle = false; }, 500);
  }
}, { passive: true, capture: true });
$('#stage').addEventListener('touchend', e => {
  if (e.target.closest('.perr')) return;
  if (mode === 'dual' && dualPip && e.target.closest('.pip-sub')) return;
  if (!e.changedTouches || e.changedTouches.length !== 1) return;
  const t = e.changedTouches[0];
  if (stageTouchPt && Math.hypot(t.clientX - stageTouchPt.x, t.clientY - stageTouchPt.y) > 24) {
    stageTouchPt = null; lastStageTouchMs = Date.now(); return;
  }
  stageTouchPt = null;
  lastStageTouchMs = Date.now();
  if (hudWokeFromIdle) { hudWokeFromIdle = false; lastStageTap = null; clearTimeout(stageTapTimer); return; }
  const now = Date.now();
  const rect = $('#stage').getBoundingClientRect();
  if (lastStageTap && now - lastStageTap.t < 280
      && Math.hypot(t.clientX - lastStageTap.x, t.clientY - lastStageTap.y) < 56) {
    clearTimeout(stageTapTimer); lastStageTap = null;
    const ratio = rect.width > 0 ? (t.clientX - rect.left) / rect.width : 0.5;
    if (ratio < 0.35) { const b = document.querySelector('[data-jump="-15"]'); if (b) b.click(); }
    else if (ratio > 0.65) { const b = document.querySelector('[data-jump="15"]'); if (b) b.click(); }
    else { $('#btnFs').click(); }
    return;
  }
  lastStageTap = { t: now, x: t.clientX, y: t.clientY };
  clearTimeout(stageTapTimer);
  stageTapTimer = setTimeout(() => { lastStageTap = null; $('#btnPlay').click(); }, 250);
}, { passive: true });
$('#stage').addEventListener('click', e => {
  if (e.target.closest('.perr')) return;

    const sub = e.target.closest('.pip-sub');

  }
  if (Date.now() - lastStageTouchMs < 600) return;
  $('#btnPlay').click();
});

});

let courseListBackup = null, headBackup = null;

function pushCourseList(){
  if (courseListBackup || curCourse) return;
  const list = $('#list');
  if (!list.firstElementChild || list.querySelector('.histbox') || list.querySelector('.splash') || list.querySelector('.backrow')) return;
  listScrollBackup = list.scrollTop;
  courseListBackup = document.createElement('div');
  courseListBackup.style.display = 'none';
  document.body.appendChild(courseListBackup);
  while (list.firstChild) courseListBackup.appendChild(list.firstChild);
  headBackup = { name: $('#cname').textContent, meta: $('#cmeta').textContent };
}

function backToCourseList({ fromPop = false } = {}){
  const list = $('#list');
  if (!fromPop && history.state && history.state.course) {
    history.back();
    return;
  }
  if (!courseListBackup) {
    curCourse = null;
    if (!cur) {
      $('#cname').textContent = '延河课堂在线播放器';
      $('#cmeta').textContent = '搜课程名开始，可按学期筛';
    }
    renderHist();
    updateY2Href();
    return;
  }
  list.innerHTML = '';
  while (courseListBackup.firstChild) list.appendChild(courseListBackup.firstChild);
  document.body.removeChild(courseListBackup);
  courseListBackup = null;
  curCourse = null;
  if (headBackup && !cur) { $('#cname').textContent = headBackup.name; $('#cmeta').textContent = headBackup.meta; }
  list.scrollTop = listScrollBackup || 0;
  updateY2Href();
}

async function openCourse(input, { force = false } = {}){
  const raw = String(input || '').trim();
  const m = raw.match(/(\d{2,})/);
  const id = m ? m[1] : '';
  if (id) { try { localStorage.setItem('yhkt_last_course', id); } catch(e){} }
  if (!me) { showLogin('请先登录老平台后再看录像', true); return; }
  if (!id) { $('#cmeta').textContent = '请输入课程编号'; return; }

  const wasSameCourse = curCourse && curCourse.course && String(curCourse.course.id) === String(id);
  pushCourseList();
  try {
    if (!wasSameCourse && courseListBackup) history.pushState({ course: id }, '', '?course=' + id);
    else if (!wasSameCourse) history.replaceState(null, '', '?course=' + id);
  } catch(e) {}
  try { localStorage.setItem('yhkt_last_course', id); } catch(e){}

  $('#list').innerHTML = '<div class="splash" style="padding:20px"><span style="font-size:12px">读取课程 ' + esc(id) + '…</span></div>';
  $('#cname').textContent = '读取中…'; $('#cmeta').textContent = '';

  let data;
  try {
    const r = await fetch('/api/open?id=' + encodeURIComponent(id) + (force ? '&refresh=1' : ''));
    data = await r.json();
    if (r.status === 401 || data.needLogin) { showLogin('登录已过期，请重新登录', true); return; }
  } catch (e) {
    $('#list').innerHTML = '';
    splash('<div class="big err">请求本地服务失败</div><div>' + esc(e.message) + '</div>');
    return;
  }

  if (!data.ok) {
    const list = $('#list');
    list.innerHTML = '';
    list.appendChild(rowBack('课程 ' + id));
    $('#cname').textContent = '课程 ' + id;
    $('#cmeta').textContent = '读取失败';
    splash('<div class="big err">' + esc(data.error || '读取失败') + '</div><div>该编号可能不存在，或你的账号没有这门课的权限</div>');
    return;
  }

  curCourse = data;
  const c = data.course;
  updateY2Href();
  $('#cname').textContent = c.name;
  const bits = [c.college, c.year ? c.year + ' 第' + c.semester + '学期' : '', c.code ? '课程号 ' + c.code : '',
                (c.professors || []).join('、')].filter(Boolean);
  $('#cmeta').textContent = bits.join(' · ') + ` ｜ ${data.stats.playable}/${data.stats.total} 讲可播`;

  const list = $('#list'); list.innerHTML = '';
  list.appendChild(rowBack(c.name));

  if (data.stats && data.stats.total > 0 && data.stats.playable === 0) {
    const n = document.createElement('div');
    n.className = 'listnote';
    n.innerHTML = (data.stats.unresolved > 0)
      ? '这门课有 ' + data.stats.total + ' 次课的记录，但播放地址没取到（多半是登录过期）。<a id="noteLogin">重新登录</a>'
      : '这门课排了 ' + data.stats.total + ' 次课，老平台上暂无录像（可点左下角「新版平台 →」碰碰运气）。';
    list.appendChild(n);
    const a = n.querySelector('#noteLogin');
    if (a) a.onclick = () => showLogin('', true);
  }
  if (!data.sessions.length) {
    const empty = document.createElement('div');
    empty.className = 'splash'; empty.style.padding = '20px';
    empty.innerHTML = '<span style="font-size:12px">该课程暂无节次记录</span>';
    list.appendChild(empty);
    splashEmpty('这门课没有可播放的节次', data);
    return;
  }

  const progMap = loadProgMap()[String(c.id)] || {};
  data.sessions.forEach(s => {
    const playable = !!(s.main || s.vga);
    const el = document.createElement('div');
    el.className = 'item' + (playable ? '' : ' dead');
    el.dataset.id = s.id;
    const p = playable ? getSessionProg(c.id, s.id) : null;
    const pct = (p && p.d > 0) ? Math.min(100, Math.round(p.t / p.d * 100)) : 0;
    el.innerHTML = `<div class="d">${esc(s.date || '—')}${s.week ? `<span class="w">第${esc(s.week)}周</span>` : ''}<span class="t">${esc(s.title)}</span></div>`
      + `<div class="m"><span>${playable ? mins(s.duration) : '无录像'}</span>`
      + `${s.vga ? '<span class="pill">全景+课件</span>' : (playable ? '<span class="pill">仅全景</span>' : '')}`
      + `${s.location ? '<span>' + esc(s.location) + '</span>' : ''}</div>`
      + (pct > 0 ? `<div class="progbar"><i style="width:${pct}%"></i></div>` : '');
    if (playable) el.onclick = () => { closeDrawer(); loadSession(s); };
    list.appendChild(el);
  });

  let target = null;
  if (progMap.lastSid) {
    target = data.sessions.find(s => String(s.id) === String(progMap.lastSid) && (s.main || s.vga));
  }
  if (!target) target = data.sessions.find(s => s.main || s.vga);

  if (target) {
    if ($('#wrap').classList.contains('drawer')) {
      const row = list.querySelector('.item[data-id="' + target.id + '"]');
      if (row) row.classList.add('on');
    } else {
      loadSession(target);
    }
  } else {
    splashEmpty('这些节次都没有录像', data);
  }
}

/* ---------- 直播 ---------- */
let srcMode = 'record';
let liveItems = [], liveCur = null, liveTimer = null, liveQuery = '', liveErr = '', liveTz = '', liveRaw = -1, liveSrc = -1, liveAtTxt = '';

function setSrcMode(m){
  if (srcMode === m) return;
  srcMode = m;
  $('#mRec').classList.toggle('on', m === 'record');
  $('#mLive').classList.toggle('on', m === 'live');
  document.querySelectorAll('.liveonly').forEach(b => { b.style.display = m === 'live' ? '' : 'none'; });
  $('#btnDl').disabled = (m === 'live');
  $('#btnPrev').disabled = (m === 'live');
  $('#btnNext').disabled = (m === 'live');
  $('#btnAutoNext').disabled = (m === 'live');
  $('#btnDl').title = m === 'live' ? '直播是实时流，不能下载' : '把这一讲下载成单个文件';
  if (m === 'live') {
    saveCourseProgress(true);
    cur = null; curCourse = null; liveCur = null;
    if (mode === 'room') mode = 'main';
    $('#dualbar').classList.remove('show');
    loadLive();
  } else {
    stopLive();
    liveItems = []; liveCur = null;
    $('#cname').textContent = '延河课堂在线播放器';
    $('#cmeta').textContent = '搜课程名开始，可按学期筛';
    renderHist();
    splash('<div class="big">在左上角搜课程名</div><div>例如 <code>数值分析</code>，可以再按学期筛</div>');
  }
}

function stopLive(){
  clearInterval(liveTimer); liveTimer = null;
  auxAudioActive = false;
  destroy('main'); destroy('vga'); destroy('aux');
}

async function loadLive(){
  const list = $('#list');
  list.innerHTML = '<div class="splash" style="padding:20px"><span style="font-size:12px">读取全校直播列表…</span></div>';
  try {
    const j = await (await fetch('/api/live?refresh=1')).json();
    if (!j.ok) throw new Error(j.error || '取不到直播列表');
    liveItems = j.items || [];
    liveErr = j.err || ''; liveTz = j.tz || '';
    liveRaw = (typeof j.raw === 'number') ? j.raw : -1;
    liveSrc = (typeof j.src === 'number') ? j.src : -1;
    liveAtTxt = j.at ? new Date(j.at).toLocaleTimeString('zh-CN', { hour12: false }) : '';
    renderLive();
    clearInterval(liveTimer);
    liveTimer = setInterval(() => { if (srcMode === 'live') loadLive(); }, 60 * 1000);
  } catch (e) {
    list.innerHTML = '<div class="listnote">直播列表读取失败：' + esc(e.message) + '</div>';
  }
}

function renderLive(){
  const list = $('#list');
  list.innerHTML = '';
  const q = liveQuery.trim().toLowerCase();
  const view = q ? liveItems.filter(x => (x.title + ' ' + x.teacher + ' ' + x.room).toLowerCase().includes(q)) : liveItems;
  const onair = view.filter(x => x.phase === 'live').length;
  const head = document.createElement('div');
  head.className = 'listnote';
  head.innerHTML = esc((q ? `筛出 ${view.length} 场（共 ${liveItems.length} 场）` : `直播 ${liveItems.length} 场`)
    + ` · 正在直播 ${onair} 场 · 每分钟自动刷新`)
    + `<div style="margin-top:2px;color:var(--muted);font-size:10.5px">引擎 ${esc(liveTz || '?')} · 更新 ${esc(liveAtTxt || '刚刚')}</div>`;
  list.appendChild(head);

  if (liveErr) {
    const errLine = document.createElement('div');
    errLine.className = 'listnote'; errLine.style.color = '#fca5a5';
    errLine.textContent = '接口报错：' + liveErr;
    list.appendChild(errLine);
  } else if (liveItems.length && !onair) {
    const noLive = document.createElement('div');
    noLive.className = 'listnote'; noLive.style.color = '#fbbf24';
    noLive.textContent = '当前没有正在直播的课，以下是今日其它场次';
    list.appendChild(noLive);
  }

  if (!view.length) {
    splash('<div class="big">' + (q ? '没有匹配的直播' : '现在没有直播') + '</div><div>'
      + (q ? '换个关键词，或清空搜索框' : '直播一般在上课时段；可切回「录播」看录像') + '</div>');
    return;
  }
  for (const it of view) {
    const el = document.createElement('div');
    el.className = 'item';
    el.dataset.id = it.id;
    const badge = it.phase === 'live'
      ? '<span class="livebadge">直播中</span>'
      : '<span class="livebadge up">' + (it.phase === 'upcoming' ? '未开始' : '已结束') + '</span>';
    el.innerHTML = `<div class="d">${badge}<span class="t" style="color:var(--fg);font-weight:600">${esc(it.title)}</span></div>
      <div class="m">${it.teacher ? '<span>' + esc(it.teacher) + '</span>' : ''}${it.room ? '<span>' + esc(it.room) + '</span>' : ''}${it.vga ? '<span class="pill ok">含课件画面</span>' : ''}<span>${esc(String(it.startedAt).slice(11, 16))}–${esc(String(it.endedAt).slice(11, 16))}</span></div>`;
    el.onclick = () => { closeDrawer(); playLive(it); };
    list.appendChild(el);
  }
  if (!liveCur && !q) {
    const first = view.find(x => x.phase === 'live') || view[0];
    if (first) playLive(first);
  }
}

const liveUrl = u => (u ? '/lp?u=' + b64(u) : null);

function playLive(it){
  liveCur = it; cur = null;
  $('#cname').textContent = it.title + (it.phase === 'live' ? '（直播中）' : '');
  $('#cmeta').textContent = [it.teacher, it.room, it.startedAt + ' ~ ' + String(it.endedAt).slice(11, 16)].filter(Boolean).join(' · ');
  $('#fsTitle').textContent = $('#cname').textContent;
  $('#splash').style.display = 'none';
  $('#stage').style.display = '';
  document.querySelectorAll('.item').forEach(el => el.classList.toggle('on', String(el.dataset.id) === String(it.id)));
  const hasVga = !!it.vga;
  document.querySelectorAll('.tab[data-mode="vga"], .tab[data-mode="dual"]').forEach(b => { b.disabled = !hasVga; });
  document.querySelectorAll('.tab[data-mode="main"]').forEach(b => { b.disabled = !it.main; });
  document.querySelectorAll('.liveonly').forEach(b => { b.disabled = !it.roomCam; });
  if (mode === 'dual' && !hasVga) mode = it.main ? 'main' : 'vga';
  if (mode === 'vga' && !hasVga) mode = 'main';
  if (mode === 'room' && !it.roomCam) mode = it.main ? 'main' : 'vga';
  if (mode === 'main' && !it.main && hasVga) mode = 'vga';
  destroy('main'); destroy('vga'); destroy('aux');
  auxAudioActive = false;
  applyLive();
}

function applyLive(){
  const it = liveCur;
  if (!it) return;
  if (mode === 'dual') {
    $('#tagMain').textContent = '全景（讲台 / 投影）';
    $('#tagVga').textContent = '课件（屏幕）';
    attach('main', liveUrl(it.main), 0, { live: true, autoPlay: true });
    attach('vga', liveUrl(it.vga), 0, { live: true, autoPlay: true });
    vids.main.play().catch(()=>{});
    vids.vga.play().catch(()=>{});
  } else if (mode === 'vga') {
    $('#tagVga').textContent = '课件（屏幕）';
    destroy('main');
    attach('vga', liveUrl(it.vga || it.main), 0, { live: true, autoPlay: true });
    vids.vga.play().catch(()=>{});
  } else {
    $('#tagMain').textContent = mode === 'room' ? '教室视角' : '全景（讲台 / 投影）';
    destroy('vga');
    const u = mode === 'room' ? (it.roomCam || it.main) : (it.main || it.vga);
    attach('main', liveUrl(u), 0, { live: true, autoPlay: true });
    vids.main.play().catch(()=>{});
  }
  renderStage();
}
