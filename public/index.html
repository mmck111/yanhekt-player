  if (msg) { msg.className = 'msg'; msg.textContent = '正在找…'; }
  try {
    const r = await fetch('/api/login/auto', { method: 'POST' });
    const j = await r.json();
    if (j.ok) {
      hideLoginModal();
      signedIn(j.user);
      toast('已自动登录' + (j.from ? '（来自 ' + j.from + '）' : ''), 2600);
      return true;
    }
    if (msg) { msg.className = 'msg err'; msg.textContent = '没找到登录状态 —— 展开下面「手动登录」，30 秒搞定'; }
    const mb = $('#manualBox'); if (mb) mb.open = true;
    if (btn) {
      btn.disabled = false;
      btn.querySelector('i').textContent = '再找一次（先去浏览器里登录延河课堂）';
    }
    return false;
  } catch (e) {
    if (msg) { msg.className = 'msg err'; msg.textContent = '本地服务连不上：' + e.message; }
    if (btn) btn.disabled = false;
    return false;
  }
}

async function doLogin(){
  const tk = $('#tk').value.trim();
  const msg = $('#lmsg');
  if (!tk) { msg.className = 'msg err'; msg.textContent = '请先粘贴 token'; return; }
  await loginWithToken(tk, msg);
}
async function loginWithToken(tk, msg){
  if (msg) { msg.className = 'msg'; msg.textContent = '验证中…'; }
  try {
    const r = await fetch('/api/login', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ token: tk }) });
    const j = await r.json();
    if (!j.ok) { if (msg) { msg.className = 'msg err'; msg.textContent = j.error || '登录失败'; } return; }
    hideLoginModal();
    signedIn(j.user, { keepView: !!cur || !!courseListBackup });
  } catch (e) {
    if (msg) { msg.className = 'msg err'; msg.textContent = '请求失败：' + e.message; }
  }
}

function signedIn(user, { keepView = false } = {}){
  try { sessionStorage.removeItem('yhkt_manual_logout'); } catch(e){}
  me = user;
  $('#dot').classList.add('ok');
  $('#stateTxt').textContent = '延河课堂 · 已登录';
  $('#who').textContent = (user.nickname || '已登录') + (user.badge ? ' · ' + user.badge : '');
  $('#btnLogout').style.display = '';
  $('#btnSetup').textContent = '重登';
  if (keepView) {
    toast('登录状态已更新');
    return;
  }
  if (!$('#list').firstElementChild) renderHist();
  splash('<div class="big">在左上角搜课程名</div><div>例如 <code>数值分析</code>，可以再按学期筛</div>');
  const q = new URLSearchParams(location.search).get('course');
  let last = null;
  try { last = localStorage.getItem('yhkt_last_course'); } catch(e){}
  const start = q || last;
  if (start) { openCourse(start); } else { $('#dq').focus(); }
}

/* ---------- 课程 ---------- */
let courseListBackup = null, headBackup = null;

function pushCourseList(){
  if (courseListBackup || curCourse) return;
  const list = $('#list');
  if (!list.firstElementChild || list.querySelector('.histbox') || list.querySelector('.favsec') || list.querySelector('.favview') || list.querySelector('.splash') || list.querySelector('.backrow')) return;
  listScrollBackup = list.scrollTop;
  courseListBackup = document.createElement('div');
  courseListBackup.style.display = 'none';
  document.body.appendChild(courseListBackup);
  while (list.firstChild) courseListBackup.appendChild(list.firstChild);
  headBackup = { name: $('#cname').textContent, meta: $('#cmeta').textContent };
}

function backToCourseList({ fromPop = false } = {}){
  const list = $('#list');
  if (!fromPop && history.state && history.state.course) {
    history.back();
    return;
  }
  exitFavView({ restoreList: false });
  if (!courseListBackup) {
    curCourse = null;
    if (!cur) {
      $('#cname').textContent = '延河课堂在线播放器';
      $('#cmeta').textContent = '搜课程名开始，可按学期筛';
    }
    renderHist();
    updateY2Href();
    syncFavUI();
    return;
  }
  list.innerHTML = '';
  while (courseListBackup.firstChild) list.appendChild(courseListBackup.firstChild);
  document.body.removeChild(courseListBackup);
  courseListBackup = null;
  curCourse = null;
  if (headBackup && !cur) { $('#cname').textContent = headBackup.name; $('#cmeta').textContent = headBackup.meta; }
  list.scrollTop = listScrollBackup || 0;
  updateY2Href();
  syncFavUI();
}

function rowBack(title, favItem){
  const el = document.createElement('div');
  el.className = 'backrow';
  el.innerHTML = '<svg viewBox="0 0 24 24"><path d="M19 11H7.83l4.88-4.88c.39-.39.39-1.03 0-1.42a.996.996 0 0 0-1.41 0l-6.59 6.59a.996.996 0 0 0 0 1.41l6.59 6.59a.996.996 0 1 0 1.41-1.41L7.83 13H19c.55 0 1-.45 1-1s-.45-1-1-1z" fill="currentColor"/></svg><span class="bk">返回课程列表</span>' + (title ? '<b>' + esc(title) + '</b>' : '');
  if (favItem) el.appendChild(makeFavBtn(favItem, 'backfav'));
  el.onclick = () => { backToCourseList(); };
  return el;
}

window.addEventListener('popstate', () => {
  if (curCourse) backToCourseList({ fromPop: true });
});

function updateY2Href(){
  const a = $('#btnY2');
  if (!a) return;
  const q = $('#dq').value.trim() || (curCourse && curCourse.course && curCourse.course.name) || '';
  a.href = q ? '/y2?q=' + encodeURIComponent(q) : '/y2';
}

async function openCourse(input, { force = false } = {}){
  const raw = String(input || '').trim();
  const m = raw.match(/(\d{2,})/);
  const id = m ? m[1] : '';
  if (id) { try { localStorage.setItem('yhkt_last_course', id); } catch(e){} }
  if (!me) { showLogin('请先登录老平台后再看录像', true); return; }
  if (!id) { $('#cmeta').textContent = '请输入课程编号'; return; }

  const wasSameCourse = curCourse && curCourse.course && String(curCourse.course.id) === String(id);
  pushCourseList();
  try {
    if (!wasSameCourse && courseListBackup) history.pushState({ course: id }, '', '?course=' + id);
    else if (!wasSameCourse) history.replaceState(null, '', '?course=' + id);
  } catch(e) {}
  try { localStorage.setItem('yhkt_last_course', id); } catch(e){}

  $('#list').innerHTML = '<div class="splash" style="padding:20px"><span style="font-size:12px">读取课程 ' + esc(id) + '…</span></div>';
  $('#cname').textContent = '读取中…'; $('#cmeta').textContent = '';

  let data;
  try {
    const r = await fetch('/api/open?id=' + encodeURIComponent(id) + (force ? '&refresh=1' : ''));
    data = await r.json();
    if (r.status === 401 || data.needLogin) { showLogin('登录已过期，请重新登录', true); return; }
  } catch (e) {
    $('#list').innerHTML = '';
    splash('<div class="big err">请求本地服务失败</div><div>' + esc(e.message) + '</div>');
    return;
  }

  if (!data.ok) {
    const list = $('#list');
    list.innerHTML = '';
    list.appendChild(rowBack('课程 ' + id));
    $('#cname').textContent = '课程 ' + id;
    $('#cmeta').textContent = '读取失败';
    splash('<div class="big err">' + esc(data.error || '读取失败') + '</div><div>该编号可能不存在，或你的账号没有这门课的权限</div>');
    return;
  }

  curCourse = data;
  const c = data.course;
  updateY2Href();
  syncFavUI();
  $('#cname').textContent = c.name;
  const bits = [c.college, c.year ? c.year + ' 第' + c.semester + '学期' : '', c.code ? '课程号 ' + c.code : '',
                (c.professors || []).join('、')].filter(Boolean);
  $('#cmeta').textContent = bits.join(' · ') + ` ｜ ${data.stats.playable}/${data.stats.total} 讲可播`;

  const list = $('#list'); list.innerHTML = '';
  list.appendChild(rowBack(c.name, favItemFromOld(c)));

  if (data.stats && data.stats.total > 0 && data.stats.playable === 0) {
    const n = document.createElement('div');
    n.className = 'listnote';
    n.innerHTML = (data.stats.unresolved > 0)
      ? '这门课有 ' + data.stats.total + ' 次课的记录，但播放地址没取到（多半是登录过期）。<a id="noteLogin">重新登录</a>'
      : '这门课排了 ' + data.stats.total + ' 次课，老平台上暂无录像（可点左下角「新版平台 →」查看）。';
    list.appendChild(n);
    const a = n.querySelector('#noteLogin');
    if (a) a.onclick = () => showLogin('', true);
  }
  if (!data.sessions.length) {
    const empty = document.createElement('div');
    empty.className = 'splash'; empty.style.padding = '20px';
    empty.innerHTML = '<span style="font-size:12px">该课程暂无节次记录</span>';
    list.appendChild(empty);
    splashEmpty('这门课没有可播放的节次', data);
    return;
  }

  const progMap = loadProgMap()[String(c.id)] || {};
  data.sessions.forEach(s => {
    const playable = !!(s.main || s.vga);
    const el = document.createElement('div');
    el.className = 'item' + (playable ? '' : ' dead');
    el.dataset.id = s.id;
    const p = playable ? getSessionProg(c.id, s.id) : null;
    const pct = (p && p.d > 0) ? Math.min(100, Math.round(p.t / p.d * 100)) : 0;
    el.innerHTML = `<div class="d">${esc(s.date || '—')}${s.week ? `<span class="w">第${esc(s.week)}周</span>` : ''}<span class="t">${esc(s.title)}</span></div>`
      + `<div class="m"><span>${playable ? mins(s.duration) : '无录像'}</span>`
      + `${s.vga ? '<span class="pill">全景+课件</span>' : (playable ? '<span class="pill">仅全景</span>' : '')}`
      + `${s.location ? '<span>' + esc(s.location) + '</span>' : ''}</div>`
      + (pct > 0 ? `<div class="progbar"><i style="width:${pct}%"></i></div>` : '');
    if (playable) el.onclick = () => { closeDrawer(); loadSession(s); };
    list.appendChild(el);
  });

  let target = null;
  if (progMap.lastSid) {
    target = data.sessions.find(s => String(s.id) === String(progMap.lastSid) && (s.main || s.vga));
  }
  if (!target) target = data.sessions.find(s => s.main || s.vga);

  if (target) {
    if ($('#wrap').classList.contains('drawer')) {
      const row = list.querySelector('.item[data-id="' + target.id + '"]');
      if (row) row.classList.add('on');
    } else {
      loadSession(target);
    }
  } else {
    splashEmpty('这些节次都没有录像', data);
  }
}

/* ---------- 直播 ---------- */
let srcMode = 'record';
let liveItems = [], liveCur = null, liveTimer = null, liveQuery = '', liveErr = '', liveTz = '', liveRaw = -1, liveSrc = -1, liveAtTxt = '';

function setSrcMode(m){
  if (srcMode === m) return;
  srcMode = m;
  $('#mRec').classList.toggle('on', m === 'record');
  $('#mLive').classList.toggle('on', m === 'live');
  document.querySelectorAll('.liveonly').forEach(b => { b.style.display = m === 'live' ? '' : 'none'; });
  $('#btnDl').disabled = (m === 'live');
  $('#btnPrev').disabled = (m === 'live');
  $('#btnNext').disabled = (m === 'live');
  $('#btnAutoNext').disabled = (m === 'live');
  $('#btnDl').title = m === 'live' ? '直播是实时流，不能下载' : '把这一讲下载成单个文件';
  if (m === 'live') {
    saveCourseProgress(true);
    exitFavView({ restoreList: false });
    cur = null; curCourse = null; playCourse = null; liveCur = null;
    syncFavUI();
    if (mode === 'room') mode = 'main';
    $('#dualbar').classList.remove('show');
    loadLive();
  } else {
    stopLive();
    liveItems = []; liveCur = null;
    $('#cname').textContent = '延河课堂在线播放器';
    $('#cmeta').textContent = '搜课程名开始，可按学期筛';
    syncFavUI();
    renderHist();
    splash('<div class="big">在左上角搜课程名</div><div>例如 <code>数值分析</code>，可以再按学期筛</div>');
  }
}

function stopLive(){
  clearInterval(liveTimer); liveTimer = null;
  auxAudioActive = false;
  destroy('main'); destroy('vga'); destroy('aux');
}

async function loadLive(){
  const list = $('#list');
  list.innerHTML = '<div class="splash" style="padding:20px"><span style="font-size:12px">读取全校直播列表…</span></div>';
  try {
    const j = await (await fetch('/api/live?refresh=1')).json();
    if (!j.ok) throw new Error(j.error || '取不到直播列表');
    liveItems = j.items || [];
    liveErr = j.err || ''; liveTz = j.tz || '';
    liveRaw = (typeof j.raw === 'number') ? j.raw : -1;
    liveSrc = (typeof j.src === 'number') ? j.src : -1;
    liveAtTxt = j.at ? new Date(j.at).toLocaleTimeString('zh-CN', { hour12: false }) : '';
    renderLive();
    clearInterval(liveTimer);
    liveTimer = setInterval(() => { if (srcMode === 'live') loadLive(); }, 60 * 1000);
  } catch (e) {
    list.innerHTML = '<div class="listnote">直播列表读取失败：' + esc(e.message) + '</div>';
  }
}

function renderLive(){
  const list = $('#list');
  list.innerHTML = '';
  const q = liveQuery.trim().toLowerCase();
  const view = q ? liveItems.filter(x => (x.title + ' ' + x.teacher + ' ' + x.room).toLowerCase().includes(q)) : liveItems;
  const onair = view.filter(x => x.phase === 'live').length;
  const head = document.createElement('div');
  head.className = 'listnote';
  head.innerHTML = esc((q ? `筛出 ${view.length} 场（共 ${liveItems.length} 场）` : `直播 ${liveItems.length} 场`)
    + ` · 正在直播 ${onair} 场 · 每分钟自动刷新`)
    + `<div style="margin-top:2px;color:var(--muted);font-size:10.5px">更新于 ${esc(liveAtTxt || '刚刚')}</div>`;
  list.appendChild(head);

  if (liveErr) {
    const errLine = document.createElement('div');
    errLine.className = 'listnote err';
    errLine.textContent = '接口报错：' + liveErr;
    list.appendChild(errLine);
  } else if (liveItems.length && !onair) {
    const noLive = document.createElement('div');
    noLive.className = 'listnote warn';
    noLive.textContent = '当前没有正在直播的课，以下是今日其它场次';
    list.appendChild(noLive);
  }

  if (!view.length) {
    splash('<div class="big">' + (q ? '没有匹配的直播' : '现在没有直播') + '</div><div>'
      + (q ? '换个关键词，或清空搜索框' : '直播一般在上课时段；可切回「录播」看录像') + '</div>');
    return;
  }
  for (const it of view) {
    const el = document.createElement('div');
    el.className = 'item';
    el.dataset.id = it.id;
    const badge = it.phase === 'live'
      ? '<span class="livebadge">直播中</span>'
      : '<span class="livebadge up">' + (it.phase === 'upcoming' ? '未开始' : '已结束') + '</span>';
    el.innerHTML = `<div class="d">${badge}<span class="t livetitle">${esc(it.title)}</span></div>
      <div class="m">${it.teacher ? '<span>' + esc(it.teacher) + '</span>' : ''}${it.room ? '<span>' + esc(it.room) + '</span>' : ''}${it.vga ? '<span class="pill ok">含课件画面</span>' : ''}<span>${esc(String(it.startedAt).slice(11, 16))}–${esc(String(it.endedAt).slice(11, 16))}</span></div>`;
    el.onclick = () => { closeDrawer(); playLive(it); if (isMobileUI()) setMobileTab('player'); };
    list.appendChild(el);
  }
  if (!liveCur && !q) {
    const first = view.find(x => x.phase === 'live') || view[0];
    if (first) playLive(first);
  }
}

const liveUrl = u => (u ? '/lp?u=' + b64(u) : null);

function playLive(it){
  liveCur = it; cur = null;
  $('#cname').textContent = it.title + (it.phase === 'live' ? '（直播中）' : '');
  $('#cmeta').textContent = [it.teacher, it.room, it.startedAt + ' ~ ' + String(it.endedAt).slice(11, 16)].filter(Boolean).join(' · ');
  $('#fsTitle').textContent = $('#cname').textContent;
  $('#splash').style.display = 'none';
  $('#stage').style.display = '';
  document.querySelectorAll('.item').forEach(el => el.classList.toggle('on', String(el.dataset.id) === String(it.id)));
  const hasVga = !!it.vga;
  document.querySelectorAll('.tab[data-mode="vga"], .tab[data-mode="dual"]').forEach(b => { b.disabled = !hasVga; });
  document.querySelectorAll('.tab[data-mode="main"]').forEach(b => { b.disabled = !it.main; });
  document.querySelectorAll('.liveonly').forEach(b => { b.disabled = !it.roomCam; });
  if (mode === 'dual' && !hasVga) mode = it.main ? 'main' : 'vga';
  if (mode === 'vga' && !hasVga) mode = 'main';
  if (mode === 'room' && !it.roomCam) mode = it.main ? 'main' : 'vga';
  if (mode === 'main' && !it.main && hasVga) mode = 'vga';
  destroy('main'); destroy('vga'); destroy('aux');
  auxAudioActive = false;
  applyLive();
}

function applyLive(){
  const it = liveCur;
  if (!it) return;
  if (mode === 'dual') {
    $('#tagMain').textContent = '全景（讲台 / 投影）';
    $('#tagVga').textContent = '课件（屏幕）';
    attach('main', liveUrl(it.main), 0, { live: true, autoPlay: true });
    attach('vga', liveUrl(it.vga), 0, { live: true, autoPlay: true });
    vids.main.play().catch(()=>{});
    vids.vga.play().catch(()=>{});
  } else if (mode === 'vga') {
    $('#tagVga').textContent = '课件（屏幕）';
    destroy('main');
    attach('vga', liveUrl(it.vga || it.main), 0, { live: true, autoPlay: true });
    vids.vga.play().catch(()=>{});
  } else {
    $('#tagMain').textContent = mode === 'room' ? '教室视角' : '全景（讲台 / 投影）';
    destroy('vga');
    const u = mode === 'room' ? (it.roomCam || it.main) : (it.main || it.vga);
    attach('main', liveUrl(u), 0, { live: true, autoPlay: true });
    vids.main.play().catch(()=>{});
  }
  renderStage();
}

/* ---------- 交互耗时提示 ---------- */
let tMark = 0, markLabel = null;
function markLoad(label){ tMark = performance.now(); markLabel = label; }
vids.main.addEventListener('playing', () => {
  if (!markLabel) return;
  const ms = Math.round(performance.now() - tMark);
  toast(`${markLabel} ${(ms / 1000).toFixed(1)}s`);
  markLabel = null;
});
vids.main.addEventListener('seeking', () => { if (!markLabel) markLoad('拖动后起播'); });

/* ---------- 课程库搜索 ---------- */
let dbTermsLoaded = false;
async function loadDbTerms(){
  if (dbTermsLoaded) return;
  try {
    const j = await (await fetch('/api/db/terms')).json();
    if (j.ok && j.terms && j.terms.length) {
      const sel = $('#dterm');
      for (const t of j.terms) {
        const o = document.createElement('option');
        o.value = t; o.textContent = t;
        sel.appendChild(o);
      }
      dbTermsLoaded = true;
    }
    if (j.meta && j.meta.count) $('#dq').placeholder = `课程名 / 教师名（库 ${j.meta.count} 门）`;
  } catch (e) {}
}

function dbRow(c){
  const el = document.createElement('div');
  el.className = 'item hasfav';
  const meta = [];
  if (c.term) meta.push(`<span>${esc(c.term)}</span>`);
  if (c.teacher) meta.push(`<span>${esc(c.teacher)}</span>`);
  if (c.room) meta.push(`<span>${esc(c.room)}</span>`);
  if (c.videoCount) meta.push(`<span class="pill ok">${c.videoCount} 讲可播</span>`);
  if (c.tag) meta.push(`<span class="pill" title="${esc(c.note || '')}">${esc(c.tag)}</span>`);
  else if (c.verified === false) meta.push(`<span class="pill" title="${esc(c.note || '')}">未确认</span>`);
  // resume badge removed intentionally while keeping breakpoint resume state
  el.innerHTML = `<div class="d">${esc(c.name)}${c.code ? `<span class="t">${esc(c.code)}</span>` : ''}</div>`
    + `<div class="m">${meta.join('') || '<span>' + esc(c.id) + '</span>'}</div>`;
  const favItem = favItemFromOld(c);
  if (favItem) el.appendChild(makeFavBtn(favItem));
  el.onclick = () => { openCourse(c.id); };
  return el;
}

function syncClearBtn(){
  $('#dqClr').classList.toggle('show', $('#dq').value.length > 0);
  updateY2Href();
}

async function dbSearch(){
  const q = $('#dq').value.trim();
  const term = $('#dterm').value;
  updateY2Href();
  if (srcMode === 'live') { liveQuery = q; renderLive(); return; }
  exitFavView({ restoreList: false });
  if (!q && !term) { renderHist(); toast('先输个课程名，或选学期筛选', 2400); return; }

  if (q) pushHist(q);
  courseListBackup = null; headBackup = null; curCourse = null;
  syncFavUI();
  if (searchAbort) { try { searchAbort.abort(); } catch(e){} }
  searchAbort = new AbortController();
  const seq = ++searchSeq;

  const list = $('#list');
  list.innerHTML = '<div class="splash" style="padding:20px"><span style="font-size:12px">正在搜索课程…</span></div>';

  const renderResult = (j, probing) => {
    if (seq !== searchSeq || curCourse) return;
    if (!j.ok) {
      list.innerHTML = '<div class="splash" style="padding:20px"><span style="font-size:12px">' + esc(j.error || '搜索失败') + '</span></div>';
      return;
    }
    if (!j.courses.length) {
      const why = j.hidden ? ('匹配的 ' + j.hidden + ' 门课都没有可播放的录像') : '课程库里没有匹配的课';
      list.innerHTML = '<div class="splash" style="padding:20px"><span style="font-size:12px">' + esc(why) + '</span></div>';
      return;
    }

    list.innerHTML = '';
    const withVideo = j.courses.filter(c => (c.videoCount || 0) > 0).length;
    const head = document.createElement('div');
    head.className = 'dbmeta';
    const bits = [`匹配 ${j.total} 门`, `列出 ${j.courses.length} 门`];
    if (j.probed) bits.push(`${withVideo} 门有录像`);
    else if (probing) bits.push('正后台核对录像数…');
    if (j.hidden) bits.push(`跳过 ${j.hidden} 门无录像`);
    head.textContent = bits.join(' · ');
    list.appendChild(head);

    j.courses.forEach(c => list.appendChild(dbRow(c)));

    if (j.truncated) {
      const end = document.createElement('div');
      end.className = 'listnote';
      end.textContent = '仅列出前 ' + j.cap + ' 门，可将关键词写更具体或按学期筛选';
      list.appendChild(end);
    }
  };

  try {
    const baseQS = 'q=' + encodeURIComponent(q) + '&term=' + encodeURIComponent(term) + '&limit=100';
    // 先快速取排序后的基础结果（不等待 120 门录像探查）
    const j0 = await (await fetch('/api/db/search?' + baseQS + '&probe=0', { signal: searchAbort.signal })).json();
    if (seq !== searchSeq || curCourse) return;
    renderResult(j0, !!me);

    if (me && !j0.probed) {
      const j1 = await (await fetch('/api/db/search?' + baseQS + '&probe=1', { signal: searchAbort.signal })).json();
      if (seq !== searchSeq || curCourse) return;
      renderResult(j1, false);
    }
  } catch (e) {
    if (e.name === 'AbortError' || seq !== searchSeq) return;
    list.innerHTML = '<div class="splash" style="padding:20px"><span style="font-size:12px">出错：' + esc(e.message) + '</span></div>';
  }
}

let dlPoll = 0;
function openWebDownloads(){
  $('#dlModal').style.display = 'flex';

  refreshWebDownloads();
}
function closeWebDownloads(){

async function refreshWebDownloads(){
  clearTimeout(dlPoll);
  try {
    const j = await (await fetch('/api/downloads')).json();
    const items = (j && j.items) || [];
    const running = items.filter(x => x.status === 'running').length;
    const queued = items.filter(x => x.status === 'queued').length;
    const activeCnt = running + queued;
    const interrupted = items.filter(x => x.status === 'interrupted').length;
    const dlEntry = $('#btnDl2');
    if (dlEntry && !NATIVE_DL) {
      let badge = '';
      if (activeCnt > 0) badge = '（' + activeCnt + '）';
      else if (interrupted > 0) badge = '（' + interrupted + ' 未完成）';
      const lbl = dlEntry.querySelector('.tlbl');
      if (lbl) lbl.textContent = '下载管理' + badge;
      else dlEntry.textContent = '下载管理' + badge;
      dlEntry.classList.toggle('busy', activeCnt > 0);
      dlEntry.classList.toggle('warn', activeCnt === 0 && interrupted > 0);
    }
    if (!NATIVE_DL && typeof updateMobileDlBadge === 'function') updateMobileDlBadge(activeCnt);
    if ($('#dlModal').style.display === 'flex') {
      const body = $('#dlBody');
      if (!items.length) {
        body.innerHTML = '<div class="listnote">当前还没有下载任务。播放界面点「下载」或打开「批量下载」即可批量稳定下载。</div>';
      } else {
        body.innerHTML = items.map(it => {
          const pct = it.totalSegs > 1 ? Math.round(it.doneSegs / it.totalSegs * 100)
            : (it.totalBytes > 0 ? Math.round(it.bytes / it.totalBytes * 100) : (it.status === 'done' ? 100 : 0));
          const speedTxt = (it.status === 'running' && it.speedBps > 0) ? (fmtMB(it.speedBps) + '/s · ') : '';
          const stText = it.status === 'running' ? (it.stage || '下载中')
            : it.status === 'queued' ? '排队中'
            : it.status === 'done' ? '已完成'
            : it.status === 'interrupted' ? '已中断（可继续）'
            : it.status === 'cancelled' ? '已取消' : ('失败 ' + (it.error || ''));
          const segText = it.stage ? (it.totalSegs > 1 ? `${it.doneSegs}% · ` : '')
            : (it.totalSegs > 1 ? `${it.doneSegs}/${it.totalSegs} 片 · ` : '');
          let act = '';
          if (it.status === 'running' || it.status === 'queued') {
            act = `<button class="dlcancel" type="button" onclick="cancelWebDownload('${esc(it.id)}')">取消</button>`;
          } else if (it.status === 'interrupted' || it.status === 'error' || it.status === 'cancelled') {
            const btnTxt = it.status === 'interrupted' ? '继续下载' : '重下';
            const resumeBtn = it.reqPath ? `<button class="dlcancel pri" type="button" onclick="resumeWebDownload('${esc(it.id)}','${esc(it.reqPath)}')">${btnTxt}</button>` : '';
            const delBtn = `<button class="dlcancel" type="button" onclick="removeWebDownload('${esc(it.id)}',true)">删除</button>`;
            act = resumeBtn + delBtn;
          } else if (it.status === 'done') {
            const dirBtn = (DESKTOP_APP && it.savePath) ? `<button class="dlcancel ok" type="button" onclick="openSavedFolder('${esc(it.savePath)}')">打开目录</button>` : '';
            const rmBtn = `<button class="dlcancel ghost" type="button" onclick="removeWebDownload('${esc(it.id)}',false)">移除</button>`;
            act = dirBtn + rmBtn;
          }
          const pathHint = it.savePath ? `<div style="font-size:11px;color:var(--muted);margin-top:4px;word-break:break-all">${esc(it.savePath)}</div>` : '';
          return `<div class="dlrow"><div class="dt">${esc(it.title)}</div>`
            + `<div class="dm"><span>${esc(stText)}</span><span style="display:flex;align-items:center;gap:6px">${speedTxt}${segText}${fmtMB(it.bytes)}${act}</span></div>`
            + pathHint
            + `<div class="dlbar"><i style="width:${Math.min(100,pct)}%"></i></div></div>`;
        }).join('');
      }
    }
    if (activeCnt > 0 || $('#dlModal').style.display === 'flex') {
      dlPoll = setTimeout(refreshWebDownloads, 900);
    }
  } catch (e) {}
}

function resumeWebDownload(id, reqPath){
  if (!reqPath) return;
  const sep = reqPath.indexOf('?') >= 0 ? '&' : '?';
  window.open(reqPath + sep + 'resumeId=' + encodeURIComponent(id), '_blank');
  toast('正在恢复下载…', 2600);
  setTimeout(refreshWebDownloads, 600);

async function clearWebDownloads(){

function startDownloadKind(kind){
  closeDlMenu();
  if (srcMode === 'live') { toast('直播是实时流，不能下载；想存就等它变成回放', 3600); return; }
  if (!cur) { toast('先点一个讲次', 2600); return; }
  const pc = activePlayCourse();
  const cid = pc && pc.course && pc.course.id;
  if (!cid) { toast('还没有课程信息', 2600); return; }
  const cname = (pc.course && pc.course.name) || '课程';
  const makeReq = k => {
    const lbl = k === 'dual' ? '双画面' : (k === 'vga' ? '课件' : '全景');
    const title = cname + '_' + (cur.date || '') + '_' + lbl;
    const url = '/dl?course=' + encodeURIComponent(cid)
      + '&session=' + encodeURIComponent(cur.id) + '&kind=' + k + '&title=' + encodeURIComponent(title);
    return { url, title, lbl };
  };
  if (kind === 'both') {
    if (!cur.main || !cur.vga) { toast('这一讲缺少全景或课件画面', 3000); return; }
    const tMain = makeReq('main'), tVga = makeReq('vga');
    const batchItems = [
      { url: tMain.url, title: tMain.title },
      { url: tVga.url, title: tVga.title },
    ];
    if (window.yhktApp && (window.yhktApp.downloadBatch || window.yhktApp.downloadBatchJson)) {
      if (window.yhktApp.downloadBatch) window.yhktApp.downloadBatch(batchItems);
      else window.yhktApp.downloadBatchJson(JSON.stringify(batchItems));
    } else {
      window.open(tMain.url, '_blank');
      setTimeout(() => window.open(tVga.url, '_blank'), 850);
      toast('开始分别下载全景和课件两个原画文件，可在「下载管理」看进度', 4500);
      if (!NATIVE_DL) setTimeout(refreshWebDownloads, 900);
    }
    return;
  }
  const label = kind === 'dual' ? '双画面' : (kind === 'vga' ? '课件' : '全景');
  if (kind === 'dual') {
    if (!cur.main || !cur.vga) { toast('这一讲缺少全景或课件画面，无法合成双画面', 3000); return; }
  } else if (!cur[kind]) {
    toast('这一讲没有' + label + '画面', 3000); return;
  }
  const req = makeReq(kind);
  window.open(req.url, '_blank');
  toast(kind === 'dual'
    ? '开始下载并合成双画面（完成后保存为单个 .mp4），可在「下载管理」看进度'
    : ('开始下载' + label + '画面，可在「下载管理」看进度'), 4500);
  if (!NATIVE_DL) setTimeout(refreshWebDownloads, 600);
}

async function downloadCurrent(){
  if (srcMode === 'live') { toast('直播是实时流，不能下载；想存就等它变成回放', 3600); return; }
  if (!cur) { toast('先点一个讲次', 2600); return; }

  if (!menu || !cur.vga || !cur.main) {
    startDownloadKind(cur.vga && !cur.main ? 'vga' : (mode === 'vga' && cur.vga ? 'vga' : 'main'));
    return;
  }
  if (menu.classList.contains('show')) { closeDlMenu(); return; }
  if (serverHasFFmpeg === null) {
    try {
      const j = await (await fetch('/api/status')).json();
      serverHasFFmpeg = !!(j && j.hasFFmpeg);
      window.__yhktHasFFmpeg = serverHasFFmpeg;
    } catch (e) { serverHasFFmpeg = false; }
  }
  const opts = [
    { k: 'main', label: '教师 / 全景画面', tag: mode === 'main' ? '当前视角' : '' },
    { k: 'vga', label: '课件画面', tag: mode === 'vga' ? '当前视角' : '' },
    { k: 'both', label: '教师 + 课件（两路都下）', tag: (mode === 'dual' && !serverHasFFmpeg) ? '当前视角 · 分别保存 2 个文件' : '分别保存 2 个文件' },
  ];
  if (serverHasFFmpeg) {
    opts.push({ k: 'dual', label: '双画面（同屏合成）', tag: mode === 'dual' ? '当前视角 · 单个 .mp4' : '单个 .mp4' });
  }
  menu.innerHTML = '';
  opts.forEach(o => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.innerHTML = `<span><svg viewBox="0 0 24 24"><path d="M12 3a1 1 0 0 1 1 1v8.59l2.3-2.3a1 1 0 1 1 1.4 1.42l-4 4a1 1 0 0 1-1.4 0l-4-4a1 1 0 1 1 1.4-1.42l2.3 2.3V4a1 1 0 0 1 1-1zm-7 15a1 1 0 0 1 1-1h12a1 1 0 1 1 0 2H6a1 1 0 0 1-1-1z" fill="currentColor"/></svg>${esc(o.label)}</span>` + (o.tag ? `<span class="dtag">${esc(o.tag)}</span>` : '');
    btn.onclick = () => startDownloadKind(o.k);
    menu.appendChild(btn);
  });
  menu.classList.add('show');
}

  if ($('#lgmodal').style.display === 'flex') { hideLoginModal(); return 'handled'; }
  if ($('#wrap').classList.contains('drawer')) { closeDrawer(); return 'handled'; }
  if (isMobileUI() && mobTab === 'player') { setMobileTab('courses'); return 'handled'; }
  if (curCourse && courseListBackup) { backToCourseList(); return 'handled'; }
  return 'none';
};

function mapOldView(v){
  return v === 'dual' ? 'dual' : v === 'screen' ? 'vga' : 'main';
}
function applyAppSettings(s){
  if (!s) return;
  window.__yhktRememberPos = (s.rememberPos !== false);
  autoNext = !!s.autoNext;
  $('#btnAutoNext').classList.toggle('on', autoNext);
  try { localStorage.setItem(LS_AUTONEXT, autoNext ? '1' : '0'); } catch(e){}
  dualPip = !!s.dualPip;
  if (typeof applyRate === 'function') applyRate(s.defaultRate || 1);
  const nextMode = mapOldView(s.defaultView);
  if (!cur) {
    mode = nextMode;
  } else if (nextMode !== mode) {
    const can = nextMode === 'main' || (cur && !!cur.vga);
    if (can) switchTab(nextMode);
  }
  if (typeof renderStage === 'function') renderStage();
}

/* ---------- 启动 ---------- */
(async function boot(){
  try { autoNext = localStorage.getItem(LS_AUTONEXT) === '1'; } catch(e){}
  $('#btnAutoNext').classList.toggle('on', autoNext);
  applyRate(getSavedRate());
  if (window.yhktSettings) {
    await window.yhktSettings.init({ toast, onBeforeOpen: closeDrawer, onOpen: () => setMobileNavState('settings'), onClose: syncMobileBackFromModal, onApply: applyAppSettings });
  }
  if (window.yhktBatch) {
    window.yhktBatch.init({
      toast,
      defaultPlatform: 'all',
      onBeforeOpen: closeDrawer,
      onOpen: () => setMobileNavState('batch'),
      onClose: syncMobileBackFromModal,
      openDownloads: () => {
        if (window.yhktApp && window.yhktApp.openDownloads) window.yhktApp.openDownloads();
        else openWebDownloads();
      },
      promptLogin: w => {
        if (w === 'y2' && APP) { showAppLogin('', true); }
        else showLogin('', true);
      },
      defaultQuery: () => $('#dq').value.trim(),
      getCurrentCourse: getBatchCoursePayload,
    });
  }
  refreshWebDownloads();
  syncFavUI();
  syncFavFromServer();
  window.addEventListener('pagehide', () => saveCourseProgress(true));
  window.addEventListener('beforeunload', () => saveCourseProgress(true));
  loadDbTerms();
  fetch('/api/status').then(r => r.json()).then(j => {
    if (j && typeof j.hasFFmpeg === 'boolean') {
      serverHasFFmpeg = j.hasFFmpeg;
      window.__yhktHasFFmpeg = j.hasFFmpeg;
    }
    if (j.build) {
      $('#build').textContent = 'build ' + j.build;
      $('#verpill').textContent = 'v' + j.build;
    }
  }).catch(() => {});

  const ht = (location.hash.match(/^#t=(.+)$/) || [])[1];
  if (ht) {
    const token = decodeURIComponent(ht);
    if (/^eyJ/.test(token)) { location.replace('/y2' + location.hash); return; }
    history.replaceState(null, '', location.pathname + location.search);
    await loginWithToken(token);
    if (me) return;
  }

  try {
    const j = await (await fetch('/api/status')).json();
    if (j.loggedIn) {
      signedIn(j.user);
    } else {
      renderHist();
      if (!APP || (DESKTOP_APP && !sessionStorage.getItem('yhkt_manual_logout'))) {
        const ok = await autoLogin({ silent: true });
        if (!ok) showLogin(ht ? 'token 无效或已过期，请重新点一次书签' : '');
      } else {
        showLogin('');
      }
    }
  } catch (e) {
    showLogin('无法连接本地服务：' + e.message);
  }

  const sp = new URLSearchParams(location.search);
  if (sp.get('src') === 'live') {
    setSrcMode('live');
  } else if (sp.get('course')) {
    if (me) openCourse(sp.get('course'));
  } else if (sp.get('s')) {
    $('#dq').value = sp.get('s');
    syncClearBtn();
    await loadDbTerms();
    dbSearch();
  }
})();
</script>
</body>
</html>
